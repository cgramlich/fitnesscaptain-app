        'item name; detail = specifics you can actually see (brand, model, weight range, attachments), ' +
        'or "" if none. tags: the subset of ' + JSON.stringify(GATING_EQUIP) + ' present in the photos.';
      const content = imgs.map(im => ({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data: im.b64 } }));
      content.push({ type:"text", text:"Inventory this gym's equipment from the photos." });
      const out = await aiRelay("inventory_gym", [{ role:"user", content }], { system, maxTokens: 4000 });
      let obj;
      try{ obj = JSON.parse(stripFences(out)); }
      catch(e){ throw new Error("Couldn't read the result - try again."); }
      const existing = (gym.inventory||"").toLowerCase();
      const rows = (Array.isArray(obj && obj.items) ? obj.items : []).map(it => {
        const name = String(it.name||"").slice(0,60);
        const dup = !!name && existing.indexOf(name.toLowerCase()) !== -1;
        return {
          include: !dup,                        // already-listed items default to Skip
          name,
          detail: String(it.detail||"").slice(0,200),
          count: Math.max(1, Math.min(99, Math.round(Number(it.count)||1))),
          low: it.confidence === "low",
          dup,
        };
      }).filter(it=>it.name);
      if(!rows.length) throw new Error("No equipment recognized - try clearer photos.");
      setItems(rows);
      setTags((Array.isArray(obj.tags)?obj.tags:[]).filter(t=>GATING_EQUIP.includes(t)));
      setPhase("review");
      log("SCAN","recognized "+rows.length+" items");
    }catch(e){
      setErr(e.message||"Scan failed."); setPhase("pick");
      log("ERROR","inventory_gym: "+e.message);
    }
  };

  const setCount = (i, d) => setItems(p=>p.map((x,j)=> j===i
    ? {...x, count: Math.max(1, Math.min(99, x.count+d))} : x));

  const save = () => {
    const inc = items.filter(it=>it.include);
    if(!inc.length){ setErr("Everything is set to skip."); return; }
    const lines = (gym.inventory||"").split("\n").map(s=>s.trim()).filter(Boolean);
    const lower = lines.map(l=>l.toLowerCase());
    let added = 0;
    inc.forEach(it => {
      const line = it.name + (it.count>1 ? " x"+it.count : "") + (it.detail ? " - "+it.detail : "");
      if(lower.indexOf(line.toLowerCase()) === -1){ lines.push(line); lower.push(line.toLowerCase()); added++; }
    });
    const equipment = Array.from(new Set([...(gym.equipment||[]), ...tags]));
    // catalog dropped on purpose: the inventory text changed, so the AI
    // catalog is stale; the place page offers re-organize.
    store.saveGyms((store.gyms||[]).map(g => g.id===gym.id
      ? { ...g, inventory: lines.join("\n"), equipment, catalog: undefined, updatedAt: nowISO() } : g));
    log("SCAN","saved "+added+" items to gym");
    onSaved(added);
  };

  return (
    <div className="layer" style={{zIndex:85}}>
      <div className="layer-inner">
        <div className="layer-top" style={{zIndex:86}}>
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2>Scan equipment</h2>
        </div>

        {phase==="pick" && <>
          <p className="hint" style={{marginTop:4}}>
            Film a walk round the room, or add photos - plus receipts or order
            screenshots if you have them, they nail exact models. Up to{" "}
            {SCAN_MAX_IMAGES} shots per scan; you review everything before it
            saves to {gym.name}.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          {imgs.length>0 &&
            <div className="row" style={{flexWrap:"wrap",gap:10,marginTop:12}}>
              {imgs.map((im,i)=>(
                <div key={i} style={{position:"relative"}}>
                  <img src={im.thumb} alt="" style={{width:76,height:76,objectFit:"cover",
                    borderRadius:10,border:"1px solid var(--line-2)",display:"block"}} />
                  <button onClick={()=>setImgs(p=>p.filter((_,j)=>j!==i))} aria-label="Remove photo"
                    style={{position:"absolute",top:-7,right:-7,width:22,height:22,borderRadius:11,
                            background:"var(--bg-4)",border:"1px solid var(--line-2)",
                            color:"var(--ink-2)",fontSize:12,lineHeight:"20px",padding:0}}>x</button>
                </div>
              ))}
            </div>}
          {/* Three ways in, because the right one depends on where you are.
              Walking the floor filming beats framing eight stills; standing at
              one rack, a photo is faster; and receipts live in your library. */}
          <input ref={vidRef} type="file" accept="video/*" capture="environment" style={{display:"none"}}
            onChange={e=>{ const f=e.target.files && e.target.files[0]; e.target.value=""; if(f) addVideo(f); }} />
          <input ref={camRef} type="file" accept="image/*" capture="environment" multiple style={{display:"none"}}
            onChange={e=>{ addFiles(e.target.files); e.target.value=""; }} />
          <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}}
            onChange={e=>{ addFiles(e.target.files); e.target.value=""; }} />

          <button className="btn btn-primary btn-block" style={{marginTop:14}}
            disabled={vidBusy || imgs.length>=SCAN_MAX_IMAGES}
            onClick={()=>{ if(vidRef.current) vidRef.current.click(); }}>
            {vidBusy ? <span className="spin"></span>
                     : <><Icon d={ICONS.play} size={15}/> Record a walkthrough</>}
          </button>
          <p className="hint center" style={{marginTop:6,marginBottom:0}}>
            Walk the floor filming. It pulls {SCAN_MAX_IMAGES} frames out and reads those.
          </p>

          <div className="row" style={{marginTop:10}}>
            <button className="btn btn-ghost btn-sm" style={{flex:1}}
              disabled={vidBusy || imgs.length>=SCAN_MAX_IMAGES}
              onClick={()=>{ if(camRef.current) camRef.current.click(); }}>
              Take photos
            </button>
            <button className="btn btn-ghost btn-sm" style={{flex:1}}
              disabled={vidBusy || imgs.length>=SCAN_MAX_IMAGES}
              onClick={()=>{ if(fileRef.current) fileRef.current.click(); }}>
              Upload
            </button>
          </div>
          {imgs.length>0 &&
            <p className="hint center" style={{marginTop:8,marginBottom:0}}>
              {imgs.length} of {SCAN_MAX_IMAGES} shots ready
            </p>}
          {imgs.length>0 &&
            <button className="btn btn-primary btn-block" style={{marginTop:10}} onClick={analyze}>
              Read the equipment
            </button>}
        </>}

        {phase==="busy" &&
          <div className="empty" style={{padding:"60px 20px"}}>
            <span className="spin spin-lg" style={{margin:"0 auto 16px",display:"block"}}></span>
            <p>Reading {imgs.length} photo{imgs.length===1?"":"s"}...</p>
          </div>}

        {phase==="review" && <>
          <p className="hint" style={{marginTop:4}}>
            Check the list - fix counts, skip anything it imagined. Nothing
            saves until you confirm.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          {items.map((it,i)=>(
            <div key={i} className="entry" style={{opacity:it.include?1:.45}}>
              <div className="entry-head">
                <div style={{flex:1,minWidth:0}}>
                  <div className="entry-name">{it.name}</div>
                  {it.detail && <div className="entry-last">{it.detail}</div>}
                  <div className="item-meta" style={{marginTop:6,alignItems:"center"}}>
                    <button className="pill" style={{padding:"2px 10px"}} onClick={()=>setCount(i,-1)} aria-label="Fewer">-</button>
                    <span className="chip">{it.count}</span>
                    <button className="pill" style={{padding:"2px 10px"}} onClick={()=>setCount(i,1)} aria-label="More">+</button>
                    {it.low && <span className="chip violet">check this</span>}
                    {it.dup && <span className="chip">already listed</span>}
                  </div>
                </div>
                <button className={"pill "+(it.include?"on":"")} style={{flex:"0 0 auto"}}
                  onClick={()=>setItems(p=>p.map((x,j)=>j===i?{...x,include:!x.include}:x))}>
                  {it.include ? "Included" : "Skipped"}
                </button>
              </div>
            </div>
          ))}
          <button className="btn btn-primary btn-block" style={{marginTop:14}} onClick={save}>
            Add {items.filter(it=>it.include).length} item{items.filter(it=>it.include).length===1?"":"s"} to the inventory
          </button>
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>{ setPhase("pick"); setErr(""); }}>
            Back to photos
          </button>
        </>}
      </div>
    </div>
  );
}

/* ============================================================
   WORKOUT LOGGING - the product. Big tap targets, pre-filled from last
   time, +/- steppers, rest timer. One JSONB doc per workout.
   ============================================================ */
function Stepper({ label, value, onChange, step, min }){
  const clamp = v => Math.max(min===undefined?0:min, Math.round(v*100)/100);
  return (
    <div className="stepper">
      <span className="lbl">{label}</span>
      <button className="step-btn" onClick={()=>onChange(clamp((Number(value)||0)-step))} aria-label={"Decrease "+label}>-</button>
      {/* Select-on-focus is the part that made typing feel impossible: without
          it, tapping a field showing 45 and typing "12" gives you 4512, because
          the caret lands after the existing digits. Now a tap replaces. */}
      <input className="step-val" inputMode="decimal" value={String(value)}
        onFocus={e=>{ try{ e.target.select(); }catch(_){} }}
        onChange={e=>{ const v=parseFloat(e.target.value); onChange(isNaN(v)?0:clamp(v)); }} />
      <button className="step-btn" onClick={()=>onChange(clamp((Number(value)||0)+step))} aria-label={"Increase "+label}>+</button>
    </div>
  );
}

/* One exercise inside a workout. Strength: reps x weight sets. Cardio and
   mobility: minutes + distance. The steppers seed from the last set here,
   else from the previous workout ("same as last time"), else defaults. */
function EntryCard({ entry, prev, units, active, hasDemo, restSecs, onHelp, onUpdate, onRemove, onSetLogged, onMoveUp, onUndoable }){
  /* Chris added 90/90 Hip Switch to a fresh workout and got MINUTES and
     DIST (MI) steppers. A hip switch is 8 reps a side, not 20 minutes and
     zero miles. The bug: anything that was not strength fell into the cardio
     branch, so every mobility drill was logged as a cardio session. Mobility
     now logs REPS - the same question he asked days ago ("how many hip
     switches should I do?") - just without a weight, which is meaningless
     for a stretch. */
  const isCardio   = entry.type === "cardio";
  const isMobility = entry.type === "mobility";
  const wStep = units==="kg" ? 2.5 : 5;
  const sets = entry.sets || [];
  const plan = planOf(entry);
  // A plan prescribes THIS set, so it beats both "same as the last set you
  // did" and "same as last session" - that is the whole point of writing a
  // pyramid down. Falls through to the old behaviour once the plan runs out.
  const planned = plan && plan[sets.length] ? plan[sets.length] : null;
  const seed = planned
             || (sets.length ? sets[sets.length-1]
             : (prev && prev.sets && prev.sets.length ? prev.sets[prev.sets.length-1] : { reps:10, weight:0 }));
  const [reps, setReps]   = useState(Number(seed.reps)||0);
  const [weight, setWeight] = useState(Number(seed.weight)||0);
  const [mins, setMins]   = useState(entry.cardio ? Number(entry.cardio.minutes)||0 : 20);
  const [dist, setDist]   = useState(entry.cardio ? Number(entry.cardio.distance)||0 : 0);
  const [selIdx, setSelIdx] = useState(-1);   // set being edited, -1 = logging a new one
  const [effort, setEffort] = useState(null); // optional tag for the set being logged
  /* Chris: "I need to be able to put a note next to each set, like how many
     reps I was trying to do." The entry already carried a machine-setup note,
     but that is one note for the whole exercise - this is per SET, which is
     where the intent lives ("wanted 10, got 8"). Hidden behind a toggle so
     the logger does not grow a field you rarely use. */
  const [note, setNote] = useState("");
  const [noteOpen, setNoteOpen] = useState(false);
  /* Chris, five sets into a five-set plan: "I'm done with my fifth set and
     don't wanna add a sixth, so I'm not sure how I close out this exercise
     without closing the workout." There was no closed state - the logger sat
     open offering "Log set 6", which reads as an instruction. An exercise that
     has met its plan now says so and puts the logger away. Nothing is locked:
     one tap reopens it, and any set is still editable. */
  const [moreSets, setMoreSets] = useState(false);
  const targetCount = plan ? plan.length : (Number(entry.targetSets)||0);
  // Must come AFTER the state above: it reads selIdx and moreSets, and const
  // has no hoisting - computing it earlier threw "Cannot access 'selIdx'
  // before initialization" and took the whole workout screen down.
  const doneAll = targetCount > 0 && sets.length >= targetCount && selIdx < 0 && !moreSets;
  /* Chris: "this done - completed 5 of 5 sets takes way too much space. Once
     it's done you should go to a marker with maybe a little pencil for edit."
     Right - the head already carries a "done" chip and the five set rows were
     still listed underneath, so the green block was a third telling of the
     same news, ~200px of it, per finished exercise. A done exercise collapses
     to one line; the pencil puts it all back. */
  const [expanded, setExpanded] = useState(false);
  /* Auto-collapse only fires when a plan or targetSets says how many sets were
     wanted. Anything added mid-workout has neither, so the flyes Chris added
     could never close - it would have sat open for the rest of the session.
     The checkmark is the manual version: "I am done with this one", stored ON
     THE ENTRY so it survives closing and reopening the workout. */
  const closed = !!entry.closed;
  const collapsed = (doneAll || closed) && !expanded;

  // Advance the steppers to the next prescribed set once one is logged.
  // Guarded on selIdx so correcting an earlier set doesn't yank the numbers.
  useEffect(() => {
    if(!planned || selIdx >= 0) return;
    setReps(Number(planned.reps)||0);
    setWeight(Number(planned.weight)||0);
  }, [sets.length]);

  const logSet = () => {
    const next = sets.slice();
    const rec = { reps, weight };
    if(effort) rec.effort = effort;
    if(note.trim()) rec.note = note.trim().slice(0,80);
    if(selIdx>=0 && selIdx<next.length){ next[selIdx] = rec; setSelIdx(-1); }
    else { next.push(rec); onSetLogged(entry); }
    setEffort(null);                          // next set starts untagged
    setNote(""); setNoteOpen(false);
    onUpdate(e => ({ ...e, sets: next }));
  };
  const pickSet = (i) => {
    if(!active) return;
    if(selIdx===i){ setSelIdx(-1); setEffort(null); setNote(""); setNoteOpen(false); return; }
    setSelIdx(i); setReps(Number(sets[i].reps)||0); setWeight(Number(sets[i].weight)||0);
    setEffort(sets[i].effort || null);
    setNote(sets[i].note || ""); setNoteOpen(!!sets[i].note);
  };

  /* Progression nudge. Suggest more weight only when last time's heaviest set
     hit the target reps AND was not tagged hard or failed - the effort tag is
     what keeps this from cheerfully pushing you after a grinder. */
  const suggestion = (() => {
    // A written plan already says what to lift; second-guessing it from last
    // session's numbers would just argue with the program.
    if(isCardio || !active || selIdx>=0 || planned) return null;
    if(!prev || !prev.sets || !prev.sets.length) return null;
    const t = topSet(prev.sets);
    if(!t || !(Number(t.weight)>0)) return null;
    const heavy = Number(t.weight);
    // Every set at that weight counts, not just the one topSet returned -
    // sets tie on reps and the marked one can lose the tie-break.
    const atTop = prev.sets.filter(s => (Number(s.weight)||0) === heavy);
    const marks = atTop.map(s => effortKey(s.effort));
    // A red down mark is a decision, so act on it: offer the lighter weight
    // rather than merely declining to push.
    if(marks.indexOf("hard") !== -1){
      const down = heavy - wStep;
      return down > 0 && weight !== down ? { weight: down, dir:"down" } : null;
    }
    const goal = Number(entry.targetReps)>0 ? Number(entry.targetReps) : 12;
    const hitGoal = Math.max.apply(null, atTop.map(s=>Number(s.reps)||0)) >= goal;
    if(marks.indexOf("easy") === -1 && !hitGoal) return null;
    const up = heavy + wStep;
    return weight >= up ? null : { weight: up, dir:"up" };
  })();
  const removeSet = (i) => {
    const before = sets.slice();
    onUpdate(e => ({ ...e, sets: (e.sets||[]).filter((_,j)=>j!==i) }));
    if(selIdx===i) setSelIdx(-1);
    if(onUndoable) onUndoable("Set "+(i+1)+" removed", () => onUpdate(e => ({ ...e, sets: before })));
  };
  const saveCardio = () => {
    onUpdate(e => ({ ...e, cardio: { minutes: mins, distance: dist, unit: units==="kg" ? "km" : "mi" } }));
  };

  /* One line for something you have finished. The whole card is one tap away
     again, and the pencil says so. */
  if(collapsed){
    const best = topSet(sets);
    return (
      <div className="entry" style={{paddingTop:12,paddingBottom:12}}>
        <div className="entry-head" style={{alignItems:"center"}}>
          <div style={{flex:1,minWidth:0}}>
            <div className="entry-name" style={{opacity:.75}}>{entry.name}</div>
            <div className="entry-last">
              {sets.length} set{sets.length===1?"":"s"}
              {best ? " - top " + best.reps + " x " + fmtW(best.weight) + " " + units : ""}
            </div>
          </div>
          <span className="chip green" style={{flex:"0 0 auto"}}>done</span>
          <InfoBtn name={entry.name} hasVideo={hasDemo} onClick={()=>onHelp && onHelp(entry)} />
          {active &&
            <button className="entry-x"
              onClick={()=>{ setExpanded(true); if(closed) onUpdate(e => ({ ...e, closed: undefined })); }}
              aria-label={"Edit "+entry.name} title="Edit">
              <Icon d={ICONS.edit} size={16}/>
            </button>}
        </div>
      </div>
    );
  }

  return (
    <div className="entry">
      <div className="entry-head">
        <div style={{flex:1,minWidth:0}}>
          {/* Tapping the name opens the panel - but an underline is a weak
              signal next to the (i) used everywhere else, and Chris went
              looking for an explanation without finding one. Both work now. */}
          <div className="entry-name" onClick={()=>onHelp && onHelp(entry)}
            style={{cursor:"pointer",textDecorationLine:"underline",textDecorationColor:"var(--line-2)",textUnderlineOffset:3}}>
            {entry.name}
          </div>
          {/* Say WHY this differs from the routine. Without it a swapped
              exercise looks like the app lost your plan. */}
          {entry.substitutedFor &&
            <div className="entry-last">standing in for {entry.substitutedFor}</div>}
          {/* Mobility carries targets too, so this can't be gated on strength. */}
          {plan
            ? <div className="entry-last" style={{color:"var(--amber-2)"}}>
                Plan: {planLine(plan, units)}
              </div>
            : entry.targetSets>0 &&
              <div className="entry-last" style={{color:"var(--amber-2)"}}>
                Target: {entry.targetSets} x {entry.targetReps}
              </div>}
          {plan && planned &&
            <div className="entry-last">
              Up next: set {sets.length+1} of {plan.length} - {planned.reps} x {fmtW(planned.weight)} {units}
            </div>}
          {prev && !isCardio &&
            <div className="entry-last">
              Last time: {setsLine(prev.sets, units)}
            </div>}
          {restSecs !== undefined && restSecs !== null && !isCardio &&
            <div className="entry-last">
              Rest {restSecs===0 ? "off" : (restSecs>=60 ? (restSecs/60)+" min" : restSecs+"s")}
            </div>}
          {/* Machine setup from the last time you did this - the numbers you
              otherwise rediscover by trial and error every visit. */}
          {(entry.settings || (prev && prev.settings)) && !isCardio &&
            <div className="entry-last" style={{color:"var(--amber-2)"}}>
              {entry.settings || prev.settings}
            </div>}
        </div>
        {/* Visible while scrolling, so you can see what is left without
            opening each card. */}
        {targetCount > 0 && sets.length >= targetCount &&
          <span className="chip green" style={{flex:"0 0 auto",alignSelf:"flex-start"}}>done</span>}
        <InfoBtn name={entry.name} hasVideo={hasDemo}
          style={{alignSelf:"flex-start"}}
          onClick={()=>onHelp && onHelp(entry)} />
        {active && onMoveUp &&
          <button className="entry-x" onClick={onMoveUp} aria-label={"Move "+entry.name+" earlier"}
            title="Move earlier">
            <Icon d={ICONS.up} size={16}/>
          </button>}
        {active &&
          <button className="entry-x" onClick={onRemove} aria-label={"Remove "+entry.name}>
            <Icon d={ICONS.x} size={15}/>
          </button>}
      </div>

      {!isCardio && sets.map((s,i)=>{
        const row =
          <button className={"set-row "+(selIdx===i?"sel":"")} onClick={()=>pickSet(i)}>
            <span className="set-num">SET {i+1}</span>
            {/* "11 x 0 lb" for a hip switch reads like a broken record. No
                load, no load column. */}
            <span className="set-main">
              {isMobility ? s.reps+" reps" : s.reps+" x "+fmtW(s.weight)+" "+units}
            </span>
            {/* Chris: "what is the little red down arrow next to one of the
                sets? I don't understand what that does." His own feature, and
                he could not read it - because the row printed the GLYPH alone
                while the only place the word appears is the button that sets
                it. A mark you cannot interpret where you see it is noise. */}
            {/* A finished set is not silent any more: no face means it went as
                expected, which deserves the thumb rather than a blank. */}
            {(() => {
              const e = effortOf(s.effort);
              return e
                ? <span className={"chip "+e.cls} style={{flex:"0 0 auto",display:"inline-flex",alignItems:"center",gap:5}}>
                    <Icon d={ICONS[e.icon]} size={14}/> {e.label.toLowerCase()}
                  </span>
                : <span className="chip" style={{flex:"0 0 auto",display:"inline-flex",alignItems:"center",
                                                 gap:5,opacity:.62}} title="Finished">
                    <Icon d={ICONS.thumbUp} size={13}/>
                  </span>;
            })()}
            {s.note &&
              <span className="subtle" style={{flex:"0 0 auto",fontSize:12.5,fontStyle:"italic"}}>
                {s.note}
              </span>}
          </button>;
        // Swipe left to delete a set (portfolio standard); finished workouts stay read-only.
        return active
          ? <SwipeRow key={i} className="swipe-set" onDelete={()=>removeSet(i)}>{row}</SwipeRow>
          : <React.Fragment key={i}>{row}</React.Fragment>;
      })}
      {isCardio && entry.cardio &&
        <div className="set-row" style={{cursor:"default"}}>
          <span className="set-num">DONE</span>
          <span className="set-main">
            {entry.cardio.minutes} min{Number(entry.cardio.distance)>0 ? " - "+fmtW(entry.cardio.distance)+" "+(entry.cardio.unit||"mi") : ""}
          </span>
        </div>}

      {active && !isCardio && doneAll &&
        <div className="row" style={{marginTop:12}}>
          <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>setMoreSets(true)}>
            Add another set
          </button>
          <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>setExpanded(false)}>
            Collapse
          </button>
        </div>}

      {active && !isCardio && !doneAll &&
        <div className="logger">
          <Stepper label={isMobility ? "Reps (or per side)" : "Reps"} value={reps} onChange={setReps} step={1} min={0}/>
          {!isMobility &&
            <Stepper label={"Weight ("+units+")"} value={weight} onChange={setWeight} step={wStep} min={0}/>}
          {suggestion &&
            <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10,
              borderColor: suggestion.dir==="up" ? "var(--amber-line)" : "#d1735c55",
              color: suggestion.dir==="up" ? "var(--amber-2)" : "#e79b86"}}
              onClick={()=>setWeight(suggestion.weight)}>
              {suggestion.dir==="up"
                ? "Ready for "+fmtW(suggestion.weight)+" "+units+"?"
                : "Drop to "+fmtW(suggestion.weight)+" "+units+"?"}
            </button>}
          {/* Optional. No mark means hold this weight. Meaningless on a
              mobility drill - there is no load to take up or down. */}
          {/* Two optional marks, nothing else. Chris: "default is just a
              thumbs up" - so the default needs no control at all. A pill you
              cannot press, sitting among pills you can, is a label pretending
              to be a button. Leave both unpicked and the logged row shows the
              thumb on its own. */}
          {!isMobility &&
          <div className="pills" style={{marginTop:10}}>
            {EFFORTS.map(e => (
              <button key={e.k} className={"pill "+(effort===e.k?"on":"")}
                style={{display:"inline-flex",alignItems:"center",gap:6}}
                aria-label={e.label} onClick={()=>setEffort(effort===e.k ? null : e.k)}>
                <Icon d={ICONS[e.icon]} size={14}/> {e.label}
              </button>
            ))}
          </div>}
          {/* Seat heights and arm positions are the thing you rediscover by
              trial and error on every club-gym visit. Save on blur. */}
          {noteOpen
            ? <input className="input" style={{marginTop:10}} value={note} maxLength={80} autoFocus
                onChange={e=>setNote(e.target.value)}
                placeholder="Note for this set - e.g. wanted 10" />
            : <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10}}
                onClick={()=>setNoteOpen(true)}>
                + Note for this set
              </button>}
          {!isMobility &&
          <input className="input" style={{marginTop:10}} defaultValue={entry.settings||""}
            placeholder="Machine setup - optional"
            onBlur={ev=>{ const v = ev.target.value.slice(0,80);
              if(v !== (entry.settings||"")) onUpdate(e => ({ ...e, settings: v || undefined })); }} />}
          {/* Chris: "should the checkmark be more prominent - my eyes
              immediately go to the big yellow button." Yes. A 17px glyph in a
              crowded header cannot compete with a full-width primary, and the
              moment you want it is the moment you are looking at that button.
              Logging stays primary; finishing sits beside it at the same
              height, with the word as well as the mark. */}
          <div className="row" style={{marginTop:12}}>
            <button className="btn btn-primary log-set-btn" style={{flex:1}} onClick={logSet}>
              {selIdx>=0 ? "Update set "+(selIdx+1) : "Log set "+(sets.length+1)}
            </button>
            {sets.length > 0 && selIdx < 0 &&
              <button className="btn btn-ghost" style={{flex:"0 0 auto",paddingLeft:16,paddingRight:16}}
                /* BUG (Chris: "the Done button isn't working"): setting closed
                   was not enough. `collapsed` is (doneAll || closed) && !expanded,
                   and `expanded` stays true after the pencil reopens a card or
                   after Add another set. So the record saved closed:true and the
                   card did not move - the worst kind of failure, because the data
                   said it worked. Closing has to clear the two flags that force it
                   open, not just set the one that asks it to shut. */
                onClick={()=>{
                  setExpanded(false); setMoreSets(false);
                  onUpdate(e => ({ ...e, closed: true }));
                }}
                aria-label={"Done with "+entry.name}>
                <Icon d={ICONS.check} size={17}/> Done
              </button>}
          </div>
          {selIdx>=0 &&
            <button className="btn btn-ghost btn-block btn-sm" style={{marginTop:8}} onClick={()=>setSelIdx(-1)}>
              Cancel edit
            </button>}
        </div>}
      {active && isCardio &&
        <div className="logger">
          <Stepper label="Minutes" value={mins} onChange={setMins} step={5} min={0}/>
          <Stepper label={"Dist ("+(units==="kg"?"km":"mi")+")"} value={dist} onChange={setDist} step={0.25} min={0}/>
          <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={saveCardio}>
            {entry.cardio ? "Update" : "Save"}
          </button>
        </div>}
    </div>
  );
}

/* "Show me" - everything the app knows about how to perform a movement, in
   one place: the illustration frames, the written how-to (generated on
   demand and cached on the exercise), and a demo link. Reachable from the
   picker and from any exercise name mid-workout, because the moment you
   need it is the moment you meet a name you don't recognize. */
function ExerciseHelp({ store, name, exerciseId, gym, onClose }){
  const [media, setMedia] = useState(undefined);   // undefined = looking, null = none
  const [frame, setFrame] = useState(0);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [vidBusy, setVidBusy] = useState(false);
  const [vidErr, setVidErr] = useState("");
  // "How do I do a Nordic curl HERE" - the gym you are standing in decides
  // the answer, so the inventory is the input, not a generic substitution
  // list. Cached per gym on the exercise: asked once, then instant.
  const gyms = (store.gyms||[]).filter(g => (g.equipment||[]).length);
  const [setupGym, setSetupGym] = useState(
    (gym && (gym.equipment||[]).length) ? gym.id : (gyms.length===1 ? gyms[0].id : null));
  const [setupBusy, setSetupBusy] = useState(false);
  const [setupErr, setSetupErr] = useState("");
  const ex = (store.data.exercises||[]).find(x => x.id === exerciseId)
          || (store.data.exercises||[]).find(x => normName(x.name) === normName(name));
  const notes = ex && ex.notes ? ex.notes : "";

  useEffect(() => {
    let alive = true;
    loadMediaIndex().then(idx => { if(alive) setMedia(matchMedia(idx, name)); });
    return () => { alive = false; };
  }, [name]);

  const writeCues = async () => {
    setBusy(true); setErr("");
    try{
      const system = "You write concise exercise instructions as plain text (no markdown, no headers). " +
        "Structure: one setup line; 2-4 numbered execution steps; then 'Cues:' with 2-3 short cues; " +
        "then 'Avoid:' with 1-2 common mistakes. Under 130 words total. No introduction or closing.";
      const out = await aiRelay("explain_exercise",
        [{ role:"user", content: "Exercise: "+name+"." +
            (ex ? " Type: "+(ex.type||"strength")+". Muscle group: "+(ex.muscleGroup||"")+"." +
                  " Equipment: "+(ex.equipment||"none")+"." : "") }],
        { system, maxTokens: 1000 });
      const text = (out||"").trim();
      if(!text) throw new Error("Nothing came back - try again.");
      if(ex){
        store.saveCollection("exercises", (store.data.exercises||[]).map(x =>
          x.id===ex.id ? { ...x, notes: text, updatedAt: nowISO() } : x));
      }else{ setErr("Saved nowhere - this movement isn't in your library yet."); }
    }catch(e){ setErr(e.message||"Couldn't write it."); log("ERROR","explain_exercise: "+e.message); }
    finally{ setBusy(false); }
  };

  const chosenGym = gyms.find(g => g.id === setupGym) || null;
  const setups = (ex && ex.setups) ? ex.setups : {};
  const setupText = chosenGym ? setups[chosenGym.id] : null;

  const findSetup = async () => {
    if(!chosenGym) return;
    setSetupBusy(true); setSetupErr("");
    try{
      const system = "You adapt one exercise to the equipment a gym actually has. " +
        "You are given an inventory list. Use ONLY items on that list - never assume anything else is there. " +
        "Give 2-3 options as plain text (no markdown), each on its own line as " +
        "'Option N - <equipment>: <one sentence setup>'. Order them best-first, closest to the real movement first. " +
        "If the inventory genuinely cannot support this movement or anything close, say so in one sentence and " +
        "name the single nearest substitute instead. Under 120 words. No introduction or closing.";
      const out = await aiRelay("adapt_exercise",
        [{ role:"user", content: "Exercise: "+name+"." +
            (ex ? " Type: "+(ex.type||"strength")+". Muscle group: "+(ex.muscleGroup||"")+"." : "") +
            " Gym: "+chosenGym.name+". Inventory: "+(chosenGym.equipment||[]).join(", ")+"." }],
        { system, maxTokens: 900 });
      const text = (out||"").trim();
      if(!text) throw new Error("Nothing came back - try again.");
      if(ex){
        store.saveCollection("exercises", (store.data.exercises||[]).map(x =>
          x.id===ex.id ? { ...x, setups: {...(x.setups||{}), [chosenGym.id]: text}, updatedAt: nowISO() } : x));
      }else{ setSetupErr("This movement isn't in your library yet, so the answer can't be saved."); }
      log("SETUP", name+" @ "+chosenGym.name);
    }catch(e){ setSetupErr(e.message||"Couldn't work it out."); log("ERROR","adapt_exercise: "+e.message); }
    finally{ setSetupBusy(false); }
  };

  const imgUrl = media && MEDIA_INDEX ? MEDIA_INDEX.base + media.f + "/" + frame + ".jpg" : null;
  // Cached on the exercise, so a movement is looked up once and then plays
  // straight away for good - and offline, the id is already here.
  const videoId = ex && ex.demoVideoId ? ex.demoVideoId : null;

  const findVideo = async () => {
    setVidBusy(true); setVidErr("");
    try{
      const v = await findDemoVideo(name + " exercise form");
      if(!v || !v.videoId) throw new Error("No demo found.");
      if(ex){
        store.saveCollection("exercises", (store.data.exercises||[]).map(x =>
          x.id===ex.id ? { ...x, demoVideoId: v.videoId, updatedAt: nowISO() } : x));
      }else{
        setVidErr("Found one, but this movement isn't in your library yet so it can't be saved.");
      }
      log("VIDEO","demo for "+name+" -> "+v.videoId);
    }catch(e){ setVidErr(e.message||"Couldn't find a demo."); log("ERROR","demo video: "+e.message); }
    finally{ setVidBusy(false); }
  };

  return (
    <div className="layer" style={{zIndex:88}}>
      <div className="layer-inner">
        <div className="layer-top" style={{zIndex:89}}>
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2 style={{flex:1,minWidth:0}}>{name}</h2>
        </div>

        {media === undefined &&
          <div className="card" style={{textAlign:"center",padding:"28px 16px"}}>
            <span className="spin"></span>
          </div>}

        {media &&
          <div className="card" style={{padding:10}}>
            <img src={imgUrl} alt={name+" - "+(frame===0?"start":"finish")+" position"}
              style={{width:"100%",borderRadius:10,display:"block",background:"var(--bg-3)"}} />
            <div className="updrow" style={{marginTop:8}}>
              <div className="pills" style={{marginTop:0}}>
                <button className={"pill "+(frame===0?"on":"")} onClick={()=>setFrame(0)}>Start</button>
                <button className={"pill "+(frame===1?"on":"")} onClick={()=>setFrame(1)}>Finish</button>
              </div>
              {normName(media.n) !== normName(name) &&
                <span className="subtle" style={{fontSize:11.5}}>shown: {media.n}</span>}
            </div>
          </div>}

        {media === null &&
          <div className="card">
            <p className="hint" style={{margin:0}}>
              No illustration on file for this one. The written how-to and the
              demo video below still work.
            </p>
          </div>}

        <div className="set-group">How to do it</div>
        <div className="card">
          {notes
            ? <div style={{whiteSpace:"pre-wrap",fontSize:14.5,lineHeight:1.5}}>{notes}</div>
            : <p className="hint" style={{marginTop:0}}>Nothing written down yet.</p>}
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10}}
            disabled={busy} onClick={writeCues}>
            {busy ? <span className="spin"></span> : (notes ? "Write it again" : "Write it for me")}
          </button>
        </div>

        {gyms.length>0 && <>
          <div className="set-group">Set it up where you are</div>
          <div className="card">
            {gyms.length>1 &&
              <div className="pills-row" style={{marginTop:0,marginBottom:10}}>
                {gyms.map(g =>
                  <button key={g.id} className={"pill "+(setupGym===g.id?"on":"")}
                    onClick={()=>setSetupGym(g.id)}>{g.name}</button>)}
              </div>}
            {!chosenGym
              ? <p className="hint" style={{margin:0}}>Pick a gym and I'll work it out from what's actually there.</p>
              : setupText
                ? <div style={{whiteSpace:"pre-wrap",fontSize:14.5,lineHeight:1.5}}>{setupText}</div>
                : <p className="hint" style={{marginTop:0}}>
                    {chosenGym.name} has {(chosenGym.equipment||[]).length} pieces of kit on file.
                  </p>}
            {setupErr && <div className="auth-msg err" style={{marginTop:10}}>{setupErr}</div>}
            {chosenGym &&
              <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10}}
                disabled={setupBusy} onClick={findSetup}>
                {setupBusy ? <span className="spin"></span>
                  : (setupText ? "Work it out again" : "How do I do this at "+chosenGym.name+"?")}
              </button>}
          </div>
        </>}

        <div className="set-group">Demo</div>
        {videoId
          ? <div className="card" style={{padding:8}}>
              <div style={{position:"relative",width:"100%",paddingTop:"56.25%",borderRadius:10,overflow:"hidden"}}>
                <iframe src={"https://www.youtube-nocookie.com/embed/"+videoId}
                  title={name+" demo"} allowFullScreen
                  allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
                  style={{position:"absolute",inset:0,width:"100%",height:"100%",border:0}} />
              </div>
              <a className="btn btn-ghost btn-sm btn-block" style={{marginTop:8,textDecoration:"none"}}
                href={demoUrl(name)} target="_blank" rel="noopener noreferrer">
                See other demos
              </a>
            </div>
          : <div className="card">
              {vidErr && <div className="auth-msg err" style={{marginBottom:10}}>{vidErr}</div>}
              <button className="btn btn-primary btn-block" disabled={vidBusy} onClick={findVideo}>
                {vidBusy ? <span className="spin"></span> : "Find a demo video"}
              </button>
              <a className="btn btn-ghost btn-sm btn-block" style={{marginTop:8,textDecoration:"none"}}
                href={demoUrl(name)} target="_blank" rel="noopener noreferrer">
                Search YouTube instead
              </a>
            </div>}
        {media &&
          <p className="hint center" style={{marginTop:14,opacity:.7}}>
            Illustrations: free-exercise-db (MIT)
          </p>}
      </div>
    </div>
  );
}

/* Nested full-screen layer: pick an exercise from the library (or create one
   on the spot). Rendered INSIDE the editor at a higher z-index so the editor
   keeps its state (playbook rule: no two screens on one overlay variable). */
function ExercisePicker({ store, gym, onPick, onCreate, onHelp, onClose }){
  const [q, setQ] = useState("");
  const [groupF, setGroupF] = useState("all");
  const [refIdx, setRefIdx] = useState(null);
  const [adding, setAdding] = useState(null);   // folder being fetched
  const needle = q.trim().toLowerCase();
  useEffect(() => { let alive = true;
    loadMediaIndex().then(i => { if(alive) setRefIdx(i); });
    return () => { alive = false; }; }, []);
  // Location-aware: flag exercises whose equipment this gym lacks.
  const notHere = (x) => !availableAt(x, gym);
  const list = (store.data.exercises||[])
    .filter(x => groupF==="all" || x.muscleGroup===groupF)
    .filter(x => !needle || (x.name||"").toLowerCase().indexOf(needle)!==-1)
    .slice().sort((a,b)=> (notHere(a)?1:0)-(notHere(b)?1:0) || (a.name||"").localeCompare(b.name||""));

  /* 873 movements ship with the app already (the illustration index). Searching
     them is free and offline; only ADDING one fetches its record. Anything
     already in the library is filtered out so the list never offers a
     duplicate. */
  const mine = new Set((store.data.exercises||[]).map(x => normName(x.name)));
  const refHits = searchReference(refIdx, mine, q, 8);

  const addFromRef = async (item) => {
    setAdding(item.f);
    try{ onPick(await createFromReference(store, item)); }
    catch(e){ log("ERROR","add from reference: "+e.message); }
    finally{ setAdding(null); }
  };

  return (
    <div className="layer">
      <div className="layer-inner">
        <div className="layer-top">
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2>Add exercise</h2>
        </div>
        {gym && Array.isArray(gym.equipment) && gym.equipment.length>0 &&
          <div className="hint" style={{marginTop:2}}>Showing availability at {gym.name}.</div>}
        <div className="search-wrap" style={{marginTop:4}}>
          <input className="input" value={q} onChange={e=>setQ(e.target.value)}
            placeholder="Search the library" autoCapitalize="off" autoCorrect="off" autoFocus />
          {q &&
            <button className="search-x" onClick={()=>setQ("")} aria-label="Clear search">
              <Icon d={ICONS.x} size={16}/>
            </button>}
        </div>
        <div className="pills-row">
          {["all"].concat(MUSCLE_GROUPS).map(g =>
            <button key={g} className={"pill "+(groupF===g?"on":"")} onClick={()=>setGroupF(g)}>
              {g==="all" ? "All muscles" : g}
            </button>)}
        </div>
        {/* The reference database, offered only when your own library does not
            already answer. Adding one brings its equipment, muscle group and
            written how-to with it, so the (i) works immediately. */}
        {refHits.length > 0 && <>
          <div className="set-group">Not in your library yet</div>
          {refHits.map(it => (
            <button key={it.f} className="item" onClick={()=>addFromRef(it)} disabled={!!adding}>
              <div className="item-body">
                <div className="item-title">{it.n}</div>
                <div className="item-meta">
                  <span className="chip blue">reference database</span>
                  {adding===it.f && <span className="chip">adding...</span>}
                </div>
              </div>
            </button>
          ))}
        </>}
        {q.trim().length>1 && !list.some(x=>(x.name||"").toLowerCase()===needle) &&
          <button className="btn btn-ghost btn-block" style={{marginTop:12}} onClick={()=>onCreate(q.trim())}>
            <Icon d={ICONS.plus} size={15}/> Create "{q.trim()}" myself
          </button>}
        <div className="list">
          {list.map(x => (
            <div key={x.id} className="item" style={{alignItems:"center"}}>
              <button style={{flex:1,minWidth:0,textAlign:"left",display:"block"}} onClick={()=>onPick(x)}>
                <div className="item-title">{x.name}</div>
                <div className="item-meta">
                  <span className={"chip "+typeClass(x.type)}>{x.type}</span>
                  {x.muscleGroup && <span className="chip">{x.muscleGroup}</span>}
                  {notHere(x) && <span className="chip red">not at this gym</span>}
                </div>
              </button>
              {/* The moment you meet a name you don't know is the moment you
                  need the picture - so the way in lives right here. */}
              {onHelp &&
                <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}}
                  onClick={(e)=>{ e.stopPropagation(); onHelp(x); }}>
                  Show me
                </button>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* Full-screen workout editor. active (no endedAt): elapsed clock, rest timer,
   Finish. Finished: view/edit history + delete. */
function WorkoutEditor({ store, workoutId, onClose, onFinish, onDelete, onSaveAsRoutine, undoable }){
  const workout = (store.data.workouts||[]).find(w=>w.id===workoutId);
  const [picker, setPicker] = useState(false);
  const [help, setHelp] = useState(null);          // {name, exerciseId} for the Show me panel
  // Finished workouts open read-only, then unlock. Nothing logged weeks ago
  // should be one stray tap from changing, but everything must be fixable -
  // an import that mis-read a set can't be a delete-and-start-over.
  const [editing, setEditing] = useState(false);
  const [restUntil, setRestUntil] = useState(0);
  const [, setTick] = useState(0);
  useEffect(()=>{ const iv=setInterval(()=>setTick(t=>t+1), 1000); return ()=>clearInterval(iv); },[]);
  if(!workout) return null;

  const active = !workout.endedAt;
  const units = store.cfg.units || "lb";
  const restSecs = store.cfg.restSecs===undefined ? 90 : store.cfg.restSecs;

  const patch = (p) => {
    store.saveCollection("workouts",
      (store.data.workouts||[]).map(w => w.id===workout.id ? { ...w, ...p, updatedAt: nowISO() } : w));
  };
  const updateEntry = (id, fn) => patch({ entries: (workout.entries||[]).map(e => e.id===id ? fn(e) : e) });
  /* An exercise added mid-workout lands at the bottom, which is rarely where
     you want to do it. Chris: "I want to add an exercise and then rearrange
     that it's happening second in line, not last just because it was added."
     Bubble-up is enough to place anything and costs one glyph rather than a
     drag handle that fights the scroll on a phone. */
  const moveEntryUp = (id) => {
    const es = (workout.entries||[]).slice();
    const i = es.findIndex(x => x.id === id);
    if(i <= 0) return;
    const t = es[i-1]; es[i-1] = es[i]; es[i] = t;
    patch({ entries: es });
  };
  /* Confirm replaced by undo. A dialog interrupts every removal to protect
     against the rare mistake; undo lets the common case be instant and still
     catches the mistake. */
  const removeEntry = (id) => {
    const before = (workout.entries||[]).slice();
    const e = before.find(x=>x.id===id);
    patch({ entries: before.filter(x=>x.id!==id) });
    if(undoable) undoable((e ? e.name : "Exercise") + " removed", () => patch({ entries: before }));
  };
  const addExercise = (x) => {
    patch({ entries: [...(workout.entries||[]), { id: uid(), exerciseId: x.id, name: x.name, type: x.type, sets: [], cardio: null }] });
    setPicker(false);
  };
  const createAndAdd = (name) => {
    const x = { id: uid(), name, type:"strength", muscleGroup:"Full body", equipment:"none",
                notes:"", custom:true, createdAt: nowISO(), updatedAt: nowISO() };
    store.saveCollection("exercises", [x, ...(store.data.exercises||[])]);
    addExercise(x);
  };
  /* Rest is per EXERCISE now, falling back to the global default. One
     number for trap bar deadlifts and calf raises was always wrong: the
     heavy hinge wants two or three minutes, the calf raise wants forty
     seconds, and being nagged by the wrong one teaches you to ignore it.
     Chris asked where the rest timer came from the first time he met it. */
  const onSetLogged = (entry) => {
    const ex = (store.data.exercises||[]).find(x => x.id === (entry && entry.exerciseId));
    const secs = (ex && Number(ex.restSecs) >= 0 && ex.restSecs !== undefined && ex.restSecs !== null)
      ? Number(ex.restSecs) : restSecs;
    if(active && secs > 0) setRestUntil(Date.now() + secs*1000);
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  };

  // "Same as last time": most recent OTHER workout containing this exercise.
  const lastPerf = (exerciseId) => {
    const ws = (store.data.workouts||[]).slice()
      .sort((a,b)=>String(b.startedAt||"").localeCompare(String(a.startedAt||"")));
    for(const w of ws){
      if(w.id===workout.id) continue;
      const e = (w.entries||[]).find(x=>x.exerciseId===exerciseId && (x.sets||[]).length);
      if(e){
        return { sets: e.sets, best: topSet(e.sets), settings: e.settings || "" };
      }
    }
    return null;
  };

  // Logging controls answer to canEdit; the clock, rest timer and Finish
  // button stay tied to a workout that is genuinely in progress.
  const canEdit = active || editing;
  const elapsed = active
    ? fmtClock((Date.now() - new Date(workout.startedAt).getTime())/1000)
    : null;
  const restLeft = Math.ceil((restUntil - Date.now())/1000);
  const entries = workout.entries || [];
  const doneCount = entries.filter(entryDone).length;
  const allDone = entries.length > 0 && doneCount === entries.length;
  const gym = (store.gyms||[]).find(g=>g.id===workout.gymId) || null;
  const setGym = (g) => {
    patch({ gymId: g ? g.id : null, gymName: g ? g.name : null });
    if(g) store.saveCfg({ ...store.cfg, lastGymId: g.id });
  };

  return (
    <div className="editor">
      <div className="editor-inner">
        <div className="editor-top">
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <div className="editor-title">
            {/* Save on blur, not per keystroke - each save is a whole-collection PUT. */}
            <input defaultValue={workout.name||""} onBlur={e=>{ if(e.target.value!==workout.name) patch({name:e.target.value}); }}
              placeholder="Workout name" />
            {/* The clock starts when the workout is created, so a stray tap
                two hours before you actually lift would bank a two-hour
                session. Tap it to start counting from now. */}
            {active
              ? <button className="elapsed" style={{textDecorationLine:"underline",
                  textDecorationColor:"var(--line-2)",textUnderlineOffset:3,padding:0}}
                  onClick={()=>{ if(confirm("Start the clock from now?")) patch({ startedAt: nowISO() }); }}>
                  {elapsed} elapsed
                  {entries.length > 0 ? " - " + doneCount + " of " + entries.length + " done" : ""}
                  {" - tap to reset"}
                </button>
              : <div className="elapsed">
                  {fmtDate(workout.date) + (workout.durationMin>0 ? " - "+workout.durationMin+" min" : "")}
                </div>}
          </div>
          {active
            ? <button className="btn btn-primary btn-sm" style={{flex:"0 0 auto"}}
                onClick={()=>{ if(confirm("Finish this workout?")) onFinish(workout); }}>
                Finish
              </button>
            : <button className={"btn btn-sm "+(editing?"btn-primary":"btn-ghost")} style={{flex:"0 0 auto"}}
                onClick={()=>setEditing(v=>!v)}>
                {editing ? "Done" : "Edit"}
              </button>}
        </div>

        {!active && editing &&
          <div className="card" style={{marginTop:10,marginBottom:2}}>
            <label className="label">Date</label>
            <input className="input" type="date" value={workout.date||todayStr()}
              onChange={e=>{ if(e.target.value) patch({ date: e.target.value,
                startedAt: e.target.value+"T12:00:00.000Z", endedAt: e.target.value+"T12:00:00.000Z" }); }} />
            <label className="label" style={{marginTop:12}}>Duration (minutes)</label>
            <input className="input" inputMode="numeric" defaultValue={workout.durationMin||0}
              onBlur={e=>{ const v = Math.max(0, Math.min(600, Math.round(Number(e.target.value)||0)));
                if(v !== (workout.durationMin||0)) patch({ durationMin: v }); }} />
          </div>}

        {(store.gyms||[]).length>0 &&
          <div className="pills-row">
            <button className={"pill "+(!workout.gymId?"on":"")} onClick={()=>setGym(null)}>No gym</button>
            {(store.gyms||[]).map(g =>
              <button key={g.id} className={"pill "+(workout.gymId===g.id?"on":"")} onClick={()=>setGym(g)}>
                {g.name}
              </button>)}
          </div>}

        {(workout.entries||[]).length===0 &&
          <div className="empty" style={{padding:"36px 20px"}}>
            <h3 className="title-sm">{active ? "Add your first exercise" : "Empty workout"}</h3>
            {active && <p>Pick from the library; sets pre-fill from your last session.</p>}
          </div>}

        {/* Marking exercises done left the loop open: the app knew the session
            was over and said nothing, while Finish sat in the header looking
            the same as it had all along. */}
        {active && allDone &&
          <div className="card" style={{marginTop:14,borderColor:"var(--amber-line)",background:"var(--amber-dim)",textAlign:"center"}}>
            <div style={{fontWeight:700,color:"var(--amber-2)"}}>Everything's done</div>
            <p className="hint" style={{marginTop:4,marginBottom:0}}>
              {doneCount} exercise{doneCount===1?"":"s"}, {workoutSets(workout)} set{workoutSets(workout)===1?"":"s"}
              {elapsed ? ", " + elapsed : ""}.
            </p>
            <button className="btn btn-primary btn-block" style={{marginTop:12}}
              onClick={()=>onFinish(workout)}>
              Finish this workout
            </button>
          </div>}

        {(workout.entries||[]).map((e, i) => (
          <EntryCard key={e.id} entry={e} prev={lastPerf(e.exerciseId)} units={units} active={canEdit}
            hasDemo={!!((store.data.exercises||[]).find(x=>x.id===e.exerciseId)||{}).demoVideoId}
            restSecs={((store.data.exercises||[]).find(x=>x.id===e.exerciseId)||{}).restSecs}
            onHelp={(en)=>setHelp({ name: en.name, exerciseId: en.exerciseId })}
            onUpdate={fn=>updateEntry(e.id, fn)} onRemove={()=>removeEntry(e.id)} onSetLogged={onSetLogged}
            onMoveUp={i>0 ? ()=>moveEntryUp(e.id) : null} onUndoable={undoable} />
        ))}

        {canEdit &&
          <button className="btn btn-ghost btn-block" style={{marginTop:14}} onClick={()=>setPicker(true)}>
            <Icon d={ICONS.plus} size={15}/> Add exercise
          </button>}

        {!active && (workout.entries||[]).length>0 &&
          <button className="btn btn-ghost btn-block" style={{marginTop:18}} onClick={()=>onSaveAsRoutine(workout)}>
            Save as routine
          </button>}
        {!active &&
          <button className="btn btn-danger btn-block" style={{marginTop:10}}
            onClick={()=>{ if(confirm("Delete this workout from your history?")) onDelete(workout.id); }}>
            Delete workout
          </button>}
        {/* An in-progress workout could only be FINISHED, so a mis-tapped
            empty one had to be saved to history and then deleted - and while
            it sat there it blocked the program from starting. */}
        {active &&
          <button className="btn btn-danger btn-block" style={{marginTop:18}}
            onClick={()=>{
              const empty = !(workout.entries||[]).length;
              if(confirm(empty ? "Discard this empty workout?"
                               : "Discard this workout? Nothing will be saved to your history."))
                onDelete(workout.id);
            }}>
            Discard workout
          </button>}
      </div>

      {/* The permanent length lives on the exercise; this is the one-off. You
          only discover a rest is too short while standing in it. */}
      {active && restLeft>0 &&
        <div className="rest-wrap">
          <button className="rest" onClick={()=>setRestUntil(0)}>
            Rest {fmtClock(restLeft)} <Icon d={ICONS.x} size={14}/>
          </button>
          <button className="rest-more" onClick={()=>setRestUntil(t => t + 30000)}
            aria-label="Add 30 seconds">+30s</button>
        </div>}

      {picker &&
        <ExercisePicker store={store} gym={gym} onPick={addExercise} onCreate={createAndAdd}
          onHelp={(x)=>setHelp({ name: x.name, exerciseId: x.id })} onClose={()=>setPicker(false)} />}

      {help &&
        <ExerciseHelp store={store} name={help.name} exerciseId={help.exerciseId} gym={gym}
          onClose={()=>setHelp(null)} />}
    </div>
  );
}

/* ============================================================
   AI HISTORY IMPORT - paste workout history from anywhere, the relay
   (task import_history -> Sonnet) organizes it into structured workouts,
   the user REVIEWS before anything saves (PriorityCaptain organizer
   pattern). Scan output is a draft, never an auto-commit.
   ============================================================ */
const normName = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

function importSystemPrompt(units, libraryNames, gymNames){
  return "You organize pasted workout history into strict JSON. Return ONLY a JSON object, " +
    "no prose and no markdown fences, shaped exactly like this: " +
    '{"workouts":[{"date":"YYYY-MM-DD or null","name":"short title","gym":"gym name or null","notes":"",' +
    '"entries":[{"exercise":"name","type":"strength|cardio|mobility","group":"muscle group",' +
    '"equipment":"what it is performed on","settings":"machine settings or empty",' +
    '"sets":[{"reps":N,"weight":N,"effort":"fail|up or omitted"}] (strength only, else null),' +
    '"cardio":{"minutes":N,"distance":N} (cardio/mobility only, else null)}]}],' +
    '"skipped":["input lines you could not interpret"]}. ' +
    "group must be exactly one of: " + MUSCLE_GROUPS.join(", ") + " - the PRIMARY mover " +
    '(use "Full body" only for genuine whole-body movements like swings and carries). ' +
    "equipment must be exactly one of: " + EQUIPMENT.join(", ") + ". Selectorised or plate-loaded " +
    'gym stations are "machine"; anything on a cable stack is "cable"; free weights get their ' +
    'implement (barbell/dumbbell/kettlebell). Use "none" only when you genuinely cannot tell. ' +
    "Rules: weights are in " + units + " unless the text clearly says otherwise (convert if needed); " +
    "bodyweight movements use weight 0; numbers are plain with no units. " +
    'effort: ONLY when the text marks the set - "fail"/"f"/"failed"/"missed" -> "fail"; ' +
    '"easy"/"too light"/"go up" -> "up". Omit it otherwise; never guess from the numbers. ' +
    'settings: machine setup noted in brackets or after the reps ("Seat 3, Arm 2", "Height 2", ' +
    '"Level 3") copied verbatim, else "". Do NOT put set data in settings. ' +
    "When an exercise clearly matches one of the user's library names, use the library name EXACTLY. " +
    "Library: " + libraryNames.join(", ") + ". " +
    (gymNames && gymNames.length
      ? 'gym: one of "'+gymNames.join('", "')+'" when the text names that place (match loosely - a ' +
        'short form or abbreviation of a gym name counts), else null. '
      : "gym: always null. ") +
    "Otherwise use a clean title-case name. Use dates from the text; null when absent. " +
    "Split distinct days into separate workouts. Never invent workouts, exercises, or sets that are not in the text.";
}

function ImportLayer({ store, onClose, onImported }){
  const [phase, setPhase] = useState("paste");   // paste | busy | review
  const [text, setText] = useState("");
  const [err, setErr] = useState("");
  const [parsed, setParsed] = useState([]);
  const [skipped, setSkipped] = useState([]);
  const units = store.cfg.units || "lb";

  const organize = async () => {
    const t = text.trim();
    if(t.length < 10){ setErr("Paste some workout history first."); return; }
    setErr(""); setPhase("busy");
    try{
      const names = (store.data.exercises||[]).map(x=>x.name);
      const gymNames = (store.gyms||[]).map(g=>g.name);
      const out = await aiRelay("import_history",
        [{ role:"user", content: t.slice(0, 20000) }],
        { system: importSystemPrompt(units, names, gymNames), maxTokens: 16000 });
      let obj;
      try{ obj = JSON.parse(stripFences(out)); }
      catch(e){ throw new Error("Couldn't read the result. Try pasting a smaller chunk."); }
      const ws = Array.isArray(obj && obj.workouts) ? obj.workouts : [];
      if(!ws.length) throw new Error("No workouts found in that text. Try a different chunk.");
      const lib = {}; (store.data.exercises||[]).forEach(x=>{ lib[normName(x.name)] = x; });
      const mediaIdx = await loadMediaIndex();
      const review = ws.map(w => {
        const gym = matchGym(store.gyms||[], w.gym);
        return {
        include: true,
        date: (typeof w.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(w.date)) ? w.date : todayStr(),
        name: (w.name||"Imported workout").slice(0,60),
        notes: (w.notes||"").slice(0,500),
        gymId: gym ? gym.id : null, gymName: gym ? gym.name : null,
        entries: (Array.isArray(w.entries)?w.entries:[]).map(e => {
          const type = EXERCISE_TYPES.includes(e.type) ? e.type : "strength";
          const sets = (type==="strength" && Array.isArray(e.sets))
            ? e.sets.map(s=>{
                const rec = { reps: Math.max(0, Math.min(999, Math.round(Number(s.reps)||0))),
                              weight: Math.max(0, Math.min(2000, Math.round((Number(s.weight)||0)*100)/100)) };
                const mark = effortKey(s.effort);   // also folds legacy easy/hard
                if(mark) rec.effort = mark;
                return rec;
              }).filter(s=>s.reps>0)
            : [];
          const cardio = (type!=="strength" && e.cardio && Number(e.cardio.minutes)>0)
            ? { minutes: Math.round(Number(e.cardio.minutes)), distance: Math.max(0, Number(e.cardio.distance)||0), unit: units==="kg"?"km":"mi" }
            : null;
          const name = String(e.exercise||"Exercise").slice(0,60);
          const group = MUSCLE_GROUPS.includes(e.group) ? e.group : "Full body";
          const settings = String(e.settings||"").slice(0,80);
          const equip = EQUIPMENT.includes(e.equipment) ? e.equipment : "none";
          return { name, type, group, equip, sets, cardio, settings, ...nameSuggestion(mediaIdx, lib, name) };
        }).filter(e => e.sets.length || e.cardio),
        };
      }).filter(w => w.entries.length);
      if(!review.length) throw new Error("Nothing usable was parsed. Try a different chunk.");
      setParsed(review);
      setSkipped(Array.isArray(obj.skipped) ? obj.skipped.slice(0,20) : []);
      setPhase("review");
      log("IMPORT","parsed "+review.length+" workouts");
    }catch(e){
      setErr(e.message||"Import failed."); setPhase("paste");
      log("ERROR","import: "+e.message);
    }
  };

  const toggle = (i) => setParsed(p => p.map((w,j)=> j===i ? {...w, include:!w.include} : w));
  const setDate = (i, d) => setParsed(p => p.map((w,j)=> j===i ? {...w, date:d} : w));
  const toggleSuggest = (i, j) => setParsed(p => p.map((w,wi)=> wi!==i ? w
    : { ...w, entries: w.entries.map((e,ei)=> ei!==j ? e : { ...e, useSuggest: !e.useSuggest }) }));
  const libHas = (n) => (store.data.exercises||[]).some(x => normName(x.name) === normName(n));

  const importAll = () => {
    const inc = parsed.filter(p=>p.include);
    if(!inc.length){ setErr("Everything is set to skip."); return; }
    // 1. Create any exercises the library doesn't have yet (dedup by name).
    const lib = {}; (store.data.exercises||[]).forEach(x=>{ lib[normName(x.name)] = x; });
    const created = [];
    inc.forEach(w => w.entries.forEach(e => {
      const key = normName(chosenName(e));
      if(!lib[key]){
        const x = { id: uid(), name: chosenName(e), type: e.type, muscleGroup: e.group || "Full body",
                    equipment: e.equip || "none", notes: "", custom: true,
                    createdAt: nowISO(), updatedAt: nowISO() };
        lib[key] = x; created.push(x);
      }
    }));
    if(created.length) store.saveCollection("exercises", [...created, ...(store.data.exercises||[])]);
    // 2. Create the workouts as FINISHED history (endedAt set; duration unknown).
    const workouts = inc.map(w => ({
      id: uid(), name: w.name, date: w.date,
      startedAt: w.date + "T12:00:00.000Z", endedAt: w.date + "T12:00:00.000Z",
      durationMin: 0, notes: w.notes, imported: true,
      gymId: w.gymId || null, gymName: w.gymName || null,
      entries: w.entries.map(e => ({
        id: uid(), exerciseId: lib[normName(chosenName(e))].id, name: lib[normName(chosenName(e))].name,
        type: e.type, sets: e.sets, cardio: e.cardio,
        settings: e.settings || undefined,
      })),
    }));
    store.saveCollection("workouts", [...workouts, ...(store.data.workouts||[])]);
    log("IMPORT","imported "+workouts.length+" workouts, "+created.length+" new exercises");
    onImported(workouts.length, created.length);
  };

  return (
    <div className="layer">
      <div className="layer-inner">
        <div className="layer-top">
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2>Import history</h2>
        </div>

        {phase==="paste" && <>
          <p className="hint" style={{marginTop:4}}>
            Paste workout history from anywhere - a notes app, a spreadsheet, another
            app's export. Any format works; the AI organizes it and you review
            everything before it saves. For long histories, paste a few weeks at a time.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          <textarea className="textarea" style={{minHeight:220,marginTop:12}} value={text}
            onChange={e=>setText(e.target.value)}
            placeholder={"e.g.\nMon 7/14 - push day\nbench 3x8 @ 185\nohp 135 x8x8x6\n20 min bike"} />
          <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={organize}>
            Organize with AI
          </button>
        </>}

        {phase==="busy" &&
          <div className="empty" style={{padding:"60px 20px"}}>
            <span className="spin spin-lg" style={{margin:"0 auto 16px",display:"block"}}></span>
            <p>Reading your history...</p>
          </div>}

        {phase==="review" && <>
          <p className="hint" style={{marginTop:4}}>
            Review before saving. Tap a workout to include or skip it; fix any dates.
            Exercises marked "new" will be added to your library.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          {parsed.map((w,i) => (
            <div key={i} className="entry" style={{opacity: w.include?1:.45}}>
              <div className="entry-head">
                <div style={{flex:1,minWidth:0}}>
                  <div className="entry-name">{w.name}</div>
                  <input className="input" type="date" value={w.date} style={{marginTop:8,maxWidth:180,padding:"8px 10px"}}
                    onChange={e=>setDate(i, e.target.value||todayStr())} />
                </div>
                {w.gymName && <span className="chip blue" style={{flex:"0 0 auto"}}>{w.gymName}</span>}
                <button className={"pill "+(w.include?"on":"")} style={{flex:"0 0 auto"}} onClick={()=>toggle(i)}>
                  {w.include ? "Included" : "Skipped"}
                </button>
              </div>
              {w.entries.map((e,j) => (
                <div key={j} className="set-row" style={{cursor:"default",display:"block"}}>
                  <div className="row" style={{gap:8}}>
                    <span className="set-main" style={{fontWeight:500}}>
                      {chosenName(e)}
                      {e.sets.length>0 && " - "+e.sets.length+" set"+(e.sets.length===1?"":"s")}
                      {e.cardio && " - "+e.cardio.minutes+" min"+(e.cardio.distance>0?" / "+fmtW(e.cardio.distance)+" "+e.cardio.unit:"")}
                    </span>
                    {!libHas(chosenName(e)) && <span className="chip violet" style={{flex:"0 0 auto"}}>new</span>}
                  </div>
                  {e.sets.length>0 &&
                    <div style={{marginTop:2,fontSize:13,color:"var(--ink-2)"}}>{setsLine(e.sets, units)}</div>}
                  {e.settings && <div className="hint" style={{marginTop:2}}>{e.settings}</div>}
                  {e.suggestName &&
                    <button className="pill" style={{marginTop:6}} onClick={()=>toggleSuggest(i,j)}>
                      {e.useSuggest
                        ? "standard name - tap to keep \""+e.name+"\""
                        : "use standard name \""+e.suggestName+"\"?"}
                    </button>}
                </div>
              ))}
            </div>
          ))}
          {skipped.length>0 &&
            <div className="card" style={{marginTop:12}}>
              <div className="subtle" style={{marginBottom:6}}>Couldn't interpret:</div>
              {skipped.map((s,i)=><div key={i} className="hint">{String(s).slice(0,120)}</div>)}
            </div>}
          <button className="btn btn-primary btn-block" style={{marginTop:14}} onClick={importAll}>
            Import {parsed.filter(p=>p.include).length} workout{parsed.filter(p=>p.include).length===1?"":"s"}
          </button>
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>{ setPhase("paste"); setErr(""); }}>
            Back to paste
          </button>
        </>}
      </div>
    </div>
  );
}

/* ============================================================
   ROUTINES - reusable workout templates (the PriorityCaptain Templates
   pattern). Create/edit; "Start" instantiates a pre-filled workout;
   finished workouts can be captured back as routines.
   ============================================================ */
/* The active program's running order, with the next day marked. Also the
   place to build one from routines you already have, or step off it. */
function ProgramCard({ store, undoable }){
  const [picking, setPicking] = useState(false);
  const [name, setName] = useState("");
  const [order, setOrder] = useState([]);      // routine ids, in the order tapped
  const routines = store.data.routines || [];
  const prog = activeProgram(store);
  const next = programNext(prog, routines);

  const startProgram = () => {
    if(order.length < 2){ return; }
    const p = { id: uid(), name: (name.trim() || "My program").slice(0,60),
                routineIds: order, cursor: 0, createdAt: nowISO(), updatedAt: nowISO() };
    store.savePrograms([p, ...(store.programs||[])]);
    store.saveCfg({ ...store.cfg, activeProgramId: p.id });
    setPicking(false); setOrder([]); setName("");
    log("PROGRAM","created "+p.name+" ("+p.routineIds.length+" days)");
  };
  /* "Step off" used to only clear cfg.activeProgramId, leaving the program
     stored with no way to see or resume it - an unreachable record and a
     vague label. It deletes now, which is what the button was already
     effectively doing. Routines are untouched: the program owns the running
     order, not the workouts. */
  const deleteProgram = () => {
    const before = (store.programs||[]).slice();
    const wasActive = store.cfg.activeProgramId;
    store.savePrograms(before.filter(p => p.id !== prog.id));
    store.saveCfg({ ...store.cfg, activeProgramId: null });
    log("PROGRAM","deleted "+prog.name);
    /* Undo instead of a confirm - and it has to put the CURSOR back too. A
       program restored to day 1 of 10 has lost the thing you actually cared
       about, so the whole array and the active id both go back. */
    if(undoable) undoable('"' + prog.name + '" deleted', () => {
      store.savePrograms(before);
      store.saveCfg({ ...store.cfg, activeProgramId: wasActive });
    });
  };
  const setNextTo = (idx) => store.savePrograms((store.programs||[]).map(p =>
    p.id===prog.id ? { ...p, cursor: idx, updatedAt: nowISO() } : p));

  /* You can keep several programs - a home block and a travel block, say -
     but only one is being followed. Anything not active was previously
     invisible and unreachable, which made "multiple programs" a fiction. */
  const others = (store.programs||[]).filter(p => !prog || p.id !== prog.id);
  const follow = (p) => store.saveCfg({ ...store.cfg, activeProgramId: p.id });
  const OtherPrograms = () => !others.length ? null : (
    <div className="card" style={{marginBottom:12}}>
      <div className="subtle" style={{marginBottom:8}}>
        {prog ? "Your other programs" : "Your programs"}
      </div>
      {others.map(p => (
        <button key={p.id} className="set-row" onClick={()=>follow(p)}>
          <span className="set-main" style={{fontWeight:500}}>{p.name}</span>
          <span className="chip" style={{flex:"0 0 auto"}}>{(p.routineIds||[]).length} days</span>
          <span className="chip amber" style={{flex:"0 0 auto"}}>follow</span>
        </button>
      ))}
    </div>
  );

  if(prog && next && !picking){
    return (
      <>
      <div className="card" style={{marginBottom:12}}>
        <div className="updrow" style={{marginBottom:8}}>
          {/* Editable in place. Chris's imported program is called "My
              program" - the importer's fallback when no name is given - and
              there was no way anywhere to change it. Saves on blur, so it
              behaves like the routine name field. */}
          <input defaultValue={prog.name} maxLength={60}
            style={{fontWeight:700,flex:1,minWidth:0,background:"transparent",
                    border:"none",color:"var(--ink)",font:"inherit",padding:0}}
            aria-label="Program name"
            onBlur={e=>{
              const v = e.target.value.trim();
              if(v && v !== prog.name)
                store.savePrograms((store.programs||[]).map(x =>
                  x.id===prog.id ? {...x, name:v, updatedAt:nowISO()} : x));
            }} />
          <span className="subtle" style={{fontSize:12,flex:"0 0 auto"}}>
            {prog.routineIds.length} days - following
          </span>
        </div>
        {prog.routineIds.map((rid, i) => {
          const r = routines.find(x=>x.id===rid);
          if(!r) return null;
          const isNext = i === next.index;
          return (
            <button key={rid} className="set-row" onClick={()=>setNextTo(i)}
              style={{opacity:isNext?1:.7}}>
              <span className="set-num">{i+1}</span>
              <span className="set-main" style={{fontWeight:isNext?700:500}}>{r.name}</span>
              {isNext && <span className="chip amber" style={{flex:"0 0 auto"}}>next</span>}
            </button>
          );
        })}
        <p className="hint" style={{marginTop:8}}>Tap any day to make it the next one.</p>
        <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:6}} onClick={deleteProgram}>
          Delete this program
        </button>
      </div>
      <OtherPrograms />
      </>
    );
  }

  if(!picking){
    if(routines.length < 2 && !others.length) return null;
    return (
      <>
      <OtherPrograms />
      {routines.length >= 2 &&
        <div className="card" style={{marginBottom:12}}>
          <div style={{fontWeight:600,marginBottom:4}}>Run a program</div>
          <p className="hint" style={{marginTop:0}}>
            Put your routines in order once and the home screen tells you which
            day is next - no counting, no calendar.
          </p>
          <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}} onClick={()=>setPicking(true)}>
            Set up a program
          </button>
        </div>}
      </>
    );
  }

  return (
    <div className="card" style={{marginBottom:12}}>
      <div style={{fontWeight:600,marginBottom:8}}>Set up a program</div>
      <input className="input" value={name} onChange={e=>setName(e.target.value)}
        placeholder="Name it (e.g. Golf Power 30)" />
      <p className="hint" style={{marginTop:10}}>Tap routines in the order you train them.</p>
      {routines.map(r => {
        const at = order.indexOf(r.id);
        return (
          <button key={r.id} className="set-row" style={{opacity:at===-1?.75:1}}
            onClick={()=>setOrder(o => at===-1 ? [...o, r.id] : o.filter(x=>x!==r.id))}>
            <span className="set-num">{at===-1 ? "-" : at+1}</span>
            <span className="set-main" style={{fontWeight:at===-1?500:700}}>{r.name}</span>
          </button>
        );
      })}
      <button className="btn btn-primary btn-block" style={{marginTop:12}}
        disabled={order.length<2} onClick={startProgram}>
        {order.length<2 ? "Pick at least two days" : "Start this program ("+order.length+" days)"}
      </button>
      <button className="btn btn-ghost btn-block btn-sm" style={{marginTop:8}}
        onClick={()=>{ setPicking(false); setOrder([]); }}>Cancel</button>
    </div>
  );
}

function RoutinesScreen({ store, onOpen, onAdd, onStart, onImport, onBuild, onDelete, undoable }){
  const routines = (store.data.routines||[]).slice()
    .sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const activeW = (store.data.workouts||[]).find(w=>!w.endedAt) || null;
  if(!routines.length){
    return (
      <div className="empty">
        <div className="glyph">&gt;</div>
        <h3 className="title-sm">Reusable routines</h3>
        <p>Build a routine once - push day, 5x5, hotel circuit - then start a
        pre-filled workout from it in one tap. Or finish a workout you liked
        and save it as a routine from its detail view.</p>
        <button className="btn btn-primary" style={{marginTop:18}} onClick={onBuild}>
          Build me a program
        </button>
        <div className="row" style={{marginTop:12,justifyContent:"center"}}>
          <button className="btn btn-ghost btn-sm" onClick={onAdd}>
            <Icon d={ICONS.plus} size={15}/> New routine
          </button>
          <button className="btn btn-ghost btn-sm" onClick={onImport}>
            Import a program
          </button>
        </div>
      </div>
    );
  }

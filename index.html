          <span className="chip">{stat.sessions.length} session{stat.sessions.length===1?"":"s"}</span>
        </div>

        {ss.length>=2 &&
          <div className="card">
            <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",display:"block"}} aria-hidden="true">
              <polyline points={pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}
                fill="none" stroke="var(--amber)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
              {pts.map((p,i)=>(
                <circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1 ? 4 : 2.5}
                  fill={i===pts.length-1 ? "var(--amber)" : "var(--amber-2)"} />
              ))}
            </svg>
            <div className="updrow" style={{marginTop:8}}>
              <span className="subtle" style={{fontSize:12}}>Top set per session: {fmtW(lo)}-{fmtW(hi)} {units}</span>
              <span className="subtle" style={{fontSize:12}}>{fmtDate(ss[0].date)} - {fmtDate(ss[ss.length-1].date)}</span>
            </div>
          </div>}

        <div className="set-group">Sessions</div>
        <div className="list">
          {stat.sessions.slice().reverse().map((s,i)=>(
            <div key={i} className="item" style={{cursor:"default"}}>
              <div className="item-body">
                <div className="item-title" style={{fontSize:15}}>{fmtDate(s.date)}</div>
                <div className="item-meta">
                  <span className="chip amber">top {fmtW(s.top.weight)} {units} x {s.top.reps}</span>
                  <span className="chip">{fmtNum(Math.round(s.vol))} {units} total</span>
                  {s.top.weight===stat.pr.weight && s.date===stat.pr.date && <span className="chip green">PR</span>}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* Which tags count as a problem worth isolating. WARN is included because a
   silent fallback (a bad env value, a rejected match) is exactly the kind of
   thing you want to see when something "seems fine but is not". */
const PROBLEM_TAGS = ["ERROR", "WARN"];

function SettingsScreen({ store, onCheckUpdate, updMsg, update, onApplyUpdate }){
  const [logProblems, setLogProblems] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showLog, setShowLog] = useState(false);

  const problems = LOG.filter(l => PROBLEM_TAGS.indexOf(l.tag) !== -1);
  const errCount = problems.length;
  const shownLog = (logProblems ? problems : LOG).slice(-120);

  /* Copies what is ON SCREEN, so "problems only" then Copy gives exactly the
     problems. Header carries version and build - a log without them is a log
     nobody can act on. Falls back to a selectable prompt where the clipboard
     API is unavailable (older iOS in standalone mode) rather than failing
     silently. */
  const copyLog = async () => {
    const NL = String.fromCharCode(10);
    const header = "FitnessCaptain v" + APP_VERSION + " (build " + BUILD + ")"
                 + (logProblems ? " - problems only" : "") + NL;
    const body = shownLog.map(l => l.t + " [" + l.tag + "] " + l.msg).join(NL);
    const text = header + (body || "(nothing logged)");
    try{
      await navigator.clipboard.writeText(text);
      setCopied(true); setTimeout(()=>setCopied(false), 1800);
    }catch(e){
      try{ window.prompt("Copy the log:", text); }catch(_){}
    }
  };
  const setUnits = (u) => store.saveCfg({ ...store.cfg, units: u });
  return (
    <div>
      <div className="set-group">Account</div>
      <div className="card">
        <div className="subtle" style={{marginBottom:10}}>{store.authEmail || "Signed in"}</div>
        <button className="btn btn-ghost btn-block" onClick={()=>store.signOut()}>Sign out</button>
      </div>

      <div className="set-group">Preferences</div>
      <div className="card">
        <div className="subtle">Weight units</div>
        <div className="pills">
          <button className={"pill "+(store.cfg.units==="lb"?"on":"")} onClick={()=>setUnits("lb")}>lb</button>
          <button className={"pill "+(store.cfg.units==="kg"?"on":"")} onClick={()=>setUnits("kg")}>kg</button>
        </div>
        <div className="subtle" style={{marginTop:14}}>Rest timer after each set</div>
        <div className="pills">
          {[0,60,90,120].map(s => (
            <button key={s} className={"pill "+((store.cfg.restSecs===undefined?90:store.cfg.restSecs)===s?"on":"")}
              onClick={()=>store.saveCfg({ ...store.cfg, restSecs: s })}>
              {s===0 ? "Off" : s+"s"}
            </button>
          ))}
        </div>
        <div className="subtle" style={{marginTop:14}}>Flag weight loss faster than</div>
        <div className="pills">
          {[0.5,0.75,1,1.5,0].map(p => (
            <button key={p} className={"pill "+((store.cfg.lossGuardPct===undefined?DEFAULT_LOSS_GUARD:store.cfg.lossGuardPct)===p?"on":"")}
              onClick={()=>store.saveCfg({ ...store.cfg, lossGuardPct: p })}>
              {p===0 ? "Off" : p+"%/wk"}
            </button>
          ))}
        </div>
        <p className="hint" style={{marginTop:6}}>
          Losing faster than this usually costs muscle as well as fat. Shown on the Progress tab.
          {" "}This is the THRESHOLD, not your weight - log that with the + button ("Weigh in") or
          on Progress under Body.
        </p>
        <div className="subtle" style={{marginTop:14}}>Weekly sets per muscle group</div>
        <div className="pills">
          {["6-12","8-15","10-20","off"].map(t => (
            <button key={t} className={"pill "+((store.cfg.setsTarget===undefined?"8-15":store.cfg.setsTarget)===t?"on":"")}
              onClick={()=>store.saveCfg({ ...store.cfg, setsTarget: t })}>
              {t==="off" ? "Off" : t}
            </button>
          ))}
        </div>
      </div>

      <div className="set-group">About</div>
      <div className="updrow">
        {update
          ? <button className="btn btn-primary btn-sm" style={{margin:0}} onClick={()=>onApplyUpdate && onApplyUpdate()}><Icon d={ICONS.sparkle} size={14}/> Update to v{update.ver||update.build}</button>
          : <button className="btn btn-ghost btn-sm" style={{margin:0}} onClick={()=>onCheckUpdate && onCheckUpdate(true)}>Check for updates</button>}
        {updMsg && <span className="hint" style={{margin:0}}>{updMsg}</span>}
      </div>
      <p className="hint center" style={{marginTop:6}}>FitnessCaptain v{APP_VERSION}</p>

      {/* Chris: "it would be great if we had the log design like the other
          apps where you can copy a block, or show just problems and then copy
          that." Reading a log off a phone screen and retyping it is the worst
          part of reporting a fault, and the ONE line that matters is usually
          buried in forty that do not. */}
      <div className="set-group">Diagnostics</div>
      <div className="card">
        <button className="btn btn-ghost btn-block" onClick={()=>setShowLog(s=>!s)}>{showLog ? "Hide" : "Show"} log</button>
        {showLog && <>
          <div className="row" style={{marginTop:10}}>
            <button className={"btn btn-sm "+(logProblems ? "btn-primary" : "btn-ghost")} style={{flex:1}}
              onClick={()=>setLogProblems(v=>!v)}>
              {logProblems ? "Showing problems" : "Problems only"}
              {errCount>0 ? " ("+errCount+")" : ""}
            </button>
            <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={copyLog}>
              {copied ? "Copied" : "Copy"}
            </button>
          </div>
          <div className="subtle" style={{marginTop:10}}>
            v{APP_VERSION} (build {BUILD}), newest at the bottom.{" "}
            {logProblems
              ? (errCount ? errCount + " problem" + (errCount===1?"":"s") : "No problems logged")
              : LOG.length + " lines"}
          </div>
          <div className="log" style={{marginTop:12}}>
            {shownLog.length === 0
              ? <div className="subtle">Nothing to show. That is the good outcome.</div>
              : shownLog.map((l,i)=>(
                  <div key={i} className={PROBLEM_TAGS.indexOf(l.tag)!==-1 ? "err" : ""}>
                    <span className="t">{l.t} </span><span className="tag">[{l.tag}]</span> {l.msg}
                  </div>
                ))}
          </div>
        </>}
      </div>
    </div>
  );
}

/* ============================================================
   CENTER-+ ACTION SHEET + MORE HUB
   2026-07-24 portfolio nav standard: contextual FABs become one
   center + in the nav (MenuCaptain pattern) and the nav caps at
   5 slots, so Gyms + Exercises demote into a More hub
   (PriorityCaptain pattern). Entry-point re-plumb only - every
   action below lands on a screen/flow that already existed.

/* An open workout blocks starting another. That is correct - one at a time -
   but the old confirm() made it a dead end: OK opened the old one, Cancel did
   nothing, and the routine you tapped was unreachable until you went and
   discarded by hand. Three real options, and enough about the open workout to
   decide without going to look at it. */
function BlockedSheet({ existing, routine, onOpen, onDiscard, onClose }){
  const started = existing.startedAt ? new Date(existing.startedAt).getTime() : 0;
  const ageSecs = started ? (Date.now()-started)/1000 : 0;
  const sets = workoutSets(existing);
  const stale = ageSecs > 12*3600;
  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <h2 className="sheet-title">Something is already open</h2>
        <p className="hint" style={{marginTop:0}}>
          <b>{existing.name || "A workout"}</b>
          {started ? " - started " + fmtClock(ageSecs) + " ago" : ""}
          {", " + (existing.entries||[]).length + " exercise" + ((existing.entries||[]).length===1?"":"s")}
          {", " + sets + " set" + (sets===1?"":"s") + " logged"}.
          {stale ? " That looks abandoned rather than paused." : ""}
        </p>
        <button type="button" className="sheet-item" onClick={onOpen}>
          <span className="ic"><Icon d={ICONS.dumbbell} size={20}/></span>
          <div><div className="t1">Open {existing.name || "it"}</div>
               <div className="t2">Pick it back up where you left off</div></div>
        </button>
        <button type="button" className="sheet-item" onClick={onDiscard}>
          <span className="ic"><Icon d={ICONS.trash} size={20}/></span>
          <div><div className="t1">Discard it and start {routine.name}</div>
               <div className="t2">
                 {sets ? sets+" logged set"+(sets===1?"":"s")+" will be lost" : "Nothing logged, so nothing is lost"}
               </div></div>
        </button>
      </div>
    </>
  );
}

/* ============================================================
   APP SHELL
   ============================================================ */
// Nav = Workouts - Routines - [+] - Progress - More (5 slots, locked
// 2026-07-24 standard). Gyms + Exercises live under More; they keep TABS
// entries so the topbar titles them when opened from the hub.
const TABS = [
  { key:"workouts",  label:"Workouts",  eyebrow:"Train",      icon:ICONS.dumbbell },
  /* Chris: "is it obvious that programs are in the Routines tab?" It was not,
     and the header said one thing while the tab said another - eyebrow "Plan",
     title "Routines". The tab is Plan now, and the two things it holds are
     labelled outright rather than left to be inferred. A sixth tab was the
     other option; the nav is full at five, and a program IS an ordering of
     routines, so splitting them would separate things you move between
     constantly. */
  { key:"routines",  label:"Plan",      eyebrow:"Prepare",    icon:ICONS.repeat },
  { key:"progress",  label:"Progress",  eyebrow:"Momentum",   icon:ICONS.chart },
  { key:"more",      label:"More",      eyebrow:"Everything", icon:ICONS.more },
  { key:"gyms",      label:"Gyms",      eyebrow:"Places",     icon:ICONS.pin },
  { key:"exercises", label:"Exercises", eyebrow:"Library",    icon:ICONS.book },
];

function App(){
  const store = useStore();
  const [tab, setTab] = useState("workouts");
  const [inSettings, setInSettings] = useState(false);
  const [exSheet, setExSheet] = useState(null);   // null | {exercise: rec|null}
  const [workoutId, setWorkoutId] = useState(null);   // open workout editor
  const [importer, setImporter] = useState(false);    // AI history import layer
  const [routineImporter, setRoutineImporter] = useState(null);   // null | "paste" | "build" (AI program layer)
  const [gymSheet, setGymSheet] = useState(null);     // null | {gym: rec|null}
  const [startCheck, setStartCheck] = useState(null); // null | {routine, gym}
  const [gymView, setGymView] = useState(null);       // open gym place page (id)
  const [addSheet, setAddSheet] = useState(false);    // center-+ create ActionSheet
  const [weighIn, setWeighIn]   = useState(false);    // open the Body sheet on arrival
  const [blocked, setBlocked]   = useState(null);     // {existing, routine} - start blocked by an open one

  // ---- gym CRUD ----
  const saveGym = (rec) => {
    const gyms = store.gyms || [];
    const exists = gyms.some(g => g.id === rec.id);
    store.saveGyms(exists ? gyms.map(g => g.id===rec.id ? rec : g) : [...gyms, rec]);
    setGymSheet(null);
    showToast(exists ? "Gym updated" : "Gym added");
  };
  const deleteGym = (id) => {
    const before = (store.gyms||[]).slice();
    store.saveGyms(before.filter(g => g.id !== id));
    if(store.cfg.lastGymId === id) store.saveCfg({ ...store.cfg, lastGymId: null });
    setGymSheet(null); setGymView(null);
    showUndo("Gym deleted", () => store.saveGyms(before));
  };
  const [toast, setToast] = useState(null);   // null | {msg, undo}
  const toastRef = useRef();
  const showToast = (m) => {
    setToast({ msg: m, undo: null });
    clearTimeout(toastRef.current); toastRef.current = setTimeout(()=>setToast(null), 2200);
  };
  /* Undo for deletions. Every delete in this app is a filter on a collection,
     so the cheapest correct undo is to keep the WHOLE previous array and put
     it back - no index bookkeeping, no partial restore, and order is
     preserved exactly. Held only for as long as the toast is up; after that
     the deletion stands.

     Longer window than a plain toast (6s vs 2.2s) because reading "deleted",
     realising it was wrong and reaching the button takes longer than reading
     a confirmation you expected. */
  const showUndo = (msg, restore) => {
    setToast({ msg, undo: () => { restore(); clearTimeout(toastRef.current); setToast(null); } });
    clearTimeout(toastRef.current); toastRef.current = setTimeout(()=>setToast(null), 6000);
  };
  // The common shape: drop one record from a collection, offer the array back.
  const deleteFrom = (file, id, label) => {
    const before = (store.data[file] || []).slice();
    store.saveCollection(file, before.filter(r => r.id !== id));
    showUndo(label + " deleted", () => store.saveCollection(file, before));
  };

  // ---- workout lifecycle ----
  // atGym (optional) starts the workout AT that gym (from a place page).
  // Guarded because plain onClick handlers pass an event object here.
  const startWorkout = (atGym) => {
    const gymArg = (atGym && atGym.id && atGym.name) ? atGym : null;
    const existing = (store.data.workouts||[]).find(w=>!w.endedAt);
    if(existing){
      // One active at a time; "start here" retargets its gym.
      if(gymArg && existing.gymId !== gymArg.id){
        store.saveCollection("workouts", (store.data.workouts||[]).map(w =>
          w.id===existing.id ? { ...w, gymId: gymArg.id, gymName: gymArg.name, updatedAt: nowISO() } : w));
      }
      setWorkoutId(existing.id); return;
    }
    const gym = gymArg || (store.gyms||[]).find(g=>g.id===store.cfg.lastGymId) || null;
    const w = { id: uid(), name: dayPartName(), date: todayStr(), startedAt: nowISO(),
                endedAt: null, durationMin: 0, notes: "", entries: [],
                gymId: gym ? gym.id : null, gymName: gym ? gym.name : null };
    store.saveCollection("workouts", [w, ...(store.data.workouts||[])]);
    if(gymArg) store.saveCfg({ ...store.cfg, lastGymId: gymArg.id });
    setWorkoutId(w.id);
  };
  const startHere = (g) => { setGymView(null); setTab("workouts"); startWorkout(g); };

  // Center-+ ActionSheet dispatch. Every pick maps onto an existing flow.
  const pickAdd = (what) => {
    setAddSheet(false);
    if(what==="start"){ setTab("workouts"); startWorkout(); }
    else if(what==="fromRoutine"){ setTab("routines"); }
    else if(what==="exercise"){ setExSheet({exercise:null}); }
    else if(what==="gym"){ setGymSheet({gym:null}); }
    else if(what==="routine"){ setTab("routines"); createRoutine(); }
    else if(what==="buildProgram"){ setTab("routines"); setRoutineImporter("build"); }
    else if(what==="importProgram"){ setTab("routines"); setRoutineImporter("paste"); }
    else if(what==="weigh"){ setTab("progress"); setWeighIn(true); }
  };

  // ---- routines ----
  const [routineId, setRoutineId] = useState(null);   // open routine editor
  const createRoutine = () => {
    const r = { id: uid(), name: "New routine", items: [], gymId: null, gymName: null,
                createdAt: nowISO(), updatedAt: nowISO() };
    store.saveCollection("routines", [r, ...(store.data.routines||[])]);
    setRoutineId(r.id);
  };
  const deleteRoutine = (id) => {
    setRoutineId(null);
    deleteFrom("routines", id, "Routine");
  };
  // Instantiate a routine into a pre-filled workout (the whole point).
  const startRoutine = (r) => {
    const existing = (store.data.workouts||[]).find(w=>!w.endedAt);
    if(existing){
      // Resume without ceremony when it IS this routine.
      if(existing.routineId === r.id){ setWorkoutId(existing.id); setRoutineId(null); return; }
      /* Otherwise ask - but with a REAL choice. This was a confirm(), which
         offers OK or Cancel: OK opened the OLD workout and Cancel did nothing,
         so there was no path to the routine you actually tapped without going
         and discarding by hand first. Chris hit exactly that - tapped Start on
         a 3-exercise routine and landed in a "Morning workout" that had been
         open for four days with one exercise in it. */
      setBlocked({ existing, routine: r });
      return;
    }
    beginRoutine(r);
  };

  /* Everything after "nothing else is open". Split out so discarding a stale
     workout can go STRAIGHT here: re-entering startRoutine after the delete
     re-read a store that had not flushed yet, found the workout it had just
     removed, and put the sheet straight back up. */
  const beginRoutine = (r) => {
    const gym = (store.gyms||[]).find(g=>g.id===r.gymId)
             || (store.gyms||[]).find(g=>g.id===store.cfg.lastGymId) || null;
    // A routine written for the home gym gets run in hotels. Check at the
    // door rather than letting him discover it at exercise three.
    if(gym){
      if(inventoryTrusted(gym)){
        if(blockedItems(r, gym, store).length){ setStartCheck({routine:r, gym}); return; }
      }else if((store.cfg.invAsked||[]).indexOf(gym.id) === -1){
        // Ask about an unknown gym ONCE, ever. A prompt that fires every
        // time you train somewhere is a prompt you learn to dismiss.
        setStartCheck({routine:r, gym}); return;
      }
    }
    createFromRoutine(r, gym, {});
  };

  /* Build the workout, applying any accepted substitutions. A swap is
     recorded as the exercise ACTUALLY DONE, with substitutedFor kept for
     honesty - logging a dumbbell RDL as a trap bar deadlift would poison the
     strength trend the weekly check-in reads. */
  const createFromRoutine = (r, gym, subs) => {
    const w = { id: uid(), name: r.name, date: todayStr(), startedAt: nowISO(),
                endedAt: null, durationMin: 0, notes: "", routineId: r.id,
                gymId: gym ? gym.id : null, gymName: gym ? gym.name : null,
                entries: (r.items||[]).map(it => {
                  const sub = subs && subs[it.id];
                  return {
                    id: uid(),
                    exerciseId: sub ? sub.id : it.exerciseId,
                    name: sub ? sub.name : it.name,
                    type: sub ? (sub.type||it.type) : it.type,
                    substitutedFor: sub ? it.name : undefined,
                    sets: [], cardio: null,
                    targetSets: it.targetSets, targetReps: it.targetReps,
                    // A per-set plan rides along so the editor can pre-fill each
                    // set with its own numbers rather than one figure for all.
                    // A substitute inherits the SHAPE but not the loads - the
                    // weights were chosen for a different movement.
                    plan: sub ? undefined : (planOf(it) || undefined),
                  };
                }) };
    store.saveCollection("workouts", [w, ...(store.data.workouts||[])]);
    setStartCheck(null); setRoutineId(null); setTab("workouts"); setWorkoutId(w.id);
  };
  // Capture a finished workout as a reusable routine.
  const saveAsRoutine = (w) => {
    const items = (w.entries||[]).filter(e => (e.sets||[]).length || e.cardio || e.type!=="strength")
      .map(e => {
        const done = (e.sets||[]).filter(s => (Number(s.reps)||0) > 0);
        const reps = done.map(s=>Number(s.reps)||0);
        const mode = reps.length ? reps.slice().sort((a,b)=> reps.filter(v=>v===a).length - reps.filter(v=>v===b).length).pop() : 10;
        // If the sets actually differed, keep them set by set - flattening a
        // pyramid to "5 sets of 12" throws away the whole scheme. Uniform
        // work still collapses to the simpler form.
        const varied = done.length > 1 &&
          done.some(s => (Number(s.reps)||0) !== (Number(done[0].reps)||0) ||
                         (Number(s.weight)||0) !== (Number(done[0].weight)||0));
        const item = { id: uid(), exerciseId: e.exerciseId, name: e.name, type: e.type,
                       targetSets: done.length || 3, targetReps: mode };
        if(varied) item.plan = done.slice(0, MAX_PLAN_SETS)
          .map(s => ({ reps: Number(s.reps)||0, weight: Number(s.weight)||0 }));
        return item;
      });
    if(!items.length){ showToast("Nothing to capture from this workout"); return; }
    const r = { id: uid(), name: w.name || "Routine", items,
                gymId: w.gymId||null, gymName: w.gymName||null,
                createdAt: nowISO(), updatedAt: nowISO() };
    store.saveCollection("routines", [r, ...(store.data.routines||[])]);
    showToast("Saved as routine: "+r.name);
  };
  const finishWorkout = (w) => {
    const mins = Math.max(1, Math.round((Date.now() - new Date(w.startedAt).getTime())/60000));
    store.saveCollection("workouts",
      (store.data.workouts||[]).map(x => x.id===w.id ? { ...x, endedAt: nowISO(), durationMin: mins, updatedAt: nowISO() } : x));
    // Advance the program past whatever was just finished. Keyed off the
    // routine actually trained, not the stored cursor, so doing days out of
    // order still leaves "next" pointing somewhere sensible.
    const prog = activeProgram(store);
    if(prog && w.routineId){
      const at = (prog.routineIds||[]).indexOf(w.routineId);
      if(at !== -1){
        store.savePrograms((store.programs||[]).map(p => p.id===prog.id
          ? { ...p, cursor: (at+1) % prog.routineIds.length, updatedAt: nowISO() } : p));
      }
    }
    setWorkoutId(null);
    showToast("Workout saved - "+mins+" min");
  };
  const deleteWorkout = (id) => {
    setWorkoutId(null);
    deleteFrom("workouts", id, "Workout");
  };

  // ---- exercise CRUD ----
  const saveExercise = (rec) => {
    const list = store.data.exercises || [];
    const exists = list.some(x => x.id === rec.id);
    store.saveCollection("exercises", exists ? list.map(x => x.id===rec.id ? rec : x) : [rec, ...list]);
    setExSheet(null);
    showToast(exists ? "Exercise updated" : "Exercise added");
  };
  const deleteExercise = (id) => {
    setExSheet(null);
    deleteFrom("exercises", id, "Exercise");
  };

  // --- PWA self-update: fetch the deployed index.html (no-store), read its
  // BUILD stamp, offer a one-tap refresh when a genuinely newer build is live.
  // Checks on launch AND resume AND a periodic timer - installed PWAs are
  // usually RESUMED, not cold-launched (portable fix from MenuCaptain).
  const [update, setUpdate] = useState(null);   // { ver, build } of a newer deployed build, else null
  const [updMsg, setUpdMsg] = useState("");     // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);
  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v0.13.1").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ log("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      if(rBuild && buildIsNewer(rBuild, BUILD)){ log("UPDATE","newer build live: "+rBuild+" (v"+(rVer||"?")+")"); setUpdate({ ver:rVer, build:rBuild }); if(manual) setUpdMsg(""); }
      else { log("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ log("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);
  useEffect(()=>{
    let last=0; const GAP=60*1000;
    const maybe=()=>{ const now=Date.now(); if(now-last<GAP) return; last=now; checkUpdate(false); };
    const t=setTimeout(maybe, 1500);                       // initial launch check
    const onVis=()=>{ if(document.visibilityState==="visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    const iv=setInterval(maybe, 20*60*1000);               // periodic while open
    return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  },[checkUpdate]);

  // Service worker: app-shell offline caching. Registered with a RELATIVE path
  // so the scope is /fitnesscaptain-app/ on GitHub Pages ("/sw.js" would 404).
  // Deliberately no web manifest (template decision): without one, Add to Home
  // Screen uses the current page URL as the launch URL.
  useEffect(()=>{
    if(!("serviceWorker" in navigator)) return;
    const onLoad = ()=>{ navigator.serviceWorker.register("sw.js")
      .then(()=>log("SW","registered"))
      .catch(e=>log("SW","register failed: "+(e&&e.message))); };
    if(document.readyState==="complete") onLoad(); else window.addEventListener("load", onLoad);
    return ()=>window.removeEventListener("load", onLoad);
  },[]);

  // Apply by navigating to a build-stamped URL so iOS can't serve cached HTML.
  // Wipe the SW caches first so the new build is never masked by a cached shell.
  function applyUpdate(){
    const stamp=(update&&update.build)||String(Date.now());
    log("UPDATE","applying -> "+stamp);
    try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("clearCache"); }catch(_){}
    window.location.replace(location.pathname + "?u=" + encodeURIComponent(stamp));
  }

  if(!store.authReady){
    return <div className="app"><div className="spin spin-lg"></div></div>;
  }
  if(store.recovery){
    return <SetPassword store={store} />;
  }
  if(!store.authed){
    return <AuthScreen store={store} />;
  }

  const activeTab = TABS.find(t=>t.key===tab) || TABS[0];

  // More stays lit while a hub screen (Gyms / Exercise Library) is open.
  const navBtn = (key) => {
    const t = TABS.find(x=>x.key===key);
    const on = tab===key || (key==="more" && (tab==="gyms" || tab==="exercises"));
    return (
      <button key={key} className={"nav-btn "+(on?"on":"")} onClick={()=>setTab(key)}
        aria-current={on?"page":undefined}>
        <Icon d={t.icon} size={22}/>
        {t.label}
      </button>
    );
  };

  return (
    <div className="app">
      {update &&
        <button className="update-bar" onClick={applyUpdate}>
          <span><Icon d={ICONS.sparkle} size={14}/> Update available <b>(v{update.ver||update.build})</b></span>
          <span className="update-go">Refresh</span>
        </button>}

      <div className="topbar">
        <div className="topbar-row">
          <div>
            <div className="eyebrow">{inSettings ? "Configure" : activeTab.eyebrow}</div>
            <h1 className="title">{inSettings ? "Settings" : activeTab.label}</h1>
          </div>
          <button className="icon-btn" onClick={()=>setInSettings(s=>!s)} aria-label="Settings">
            <Icon d={inSettings ? ICONS.back : ICONS.gear} size={21}/>
          </button>
        </div>
        {/* The error state used to be a dead label: it stuck until something
            else happened to trigger a pull, with no way to ask again. It is
            a button now - the one moment the badge should be tappable. */}
        {store.sync==="error"
          ? <button className="sync error" onClick={()=>store.pullAll()}>
              <span className="dot"></span>
              {(store.syncMsg || "Sync error")} - tap to retry
            </button>
          : <div className={"sync "+store.sync}>
              <span className="dot"></span>
              {store.sync==="idle" && "All changes saved"}
              {store.sync==="busy" && "Syncing..."}
              {store.sync==="pending" && "Offline - will sync"}
            </div>}
      </div>

      <div className="screen">
        {inSettings
          ? <SettingsScreen store={store} onCheckUpdate={checkUpdate} updMsg={updMsg} update={update} onApplyUpdate={applyUpdate} />
          : <>
              {tab==="workouts"  && <WorkoutsScreen store={store} onStart={startWorkout} onOpen={(w)=>setWorkoutId(w.id)} onImport={()=>setImporter(true)} onStartRoutine={startRoutine}
                onDelete={(w)=>deleteWorkout(w.id)}
                onDiscard={(w)=>deleteWorkout(w.id)} />}
              {tab==="gyms"      && <GymsScreen store={store} onOpen={(g)=>setGymView(g.id)} onAdd={()=>setGymSheet({gym:null})}
                onDelete={(g)=>deleteGym(g.id)} />}
              {tab==="exercises" && <ExercisesScreen store={store} onAdd={()=>setExSheet({exercise:null})} onEdit={(x)=>setExSheet({exercise:x})}
                onDelete={(x)=>deleteExercise(x.id)} />}
              {tab==="routines"  && <RoutinesScreen store={store} onOpen={(r)=>setRoutineId(r.id)} onAdd={createRoutine} onStart={startRoutine} onImport={()=>setRoutineImporter("paste")} onBuild={()=>setRoutineImporter("build")}
                onDelete={(r)=>deleteRoutine(r.id)} undoable={showUndo} />}
              {tab==="progress"  && <ProgressScreen store={store} weighIn={weighIn} onWeighInDone={()=>setWeighIn(false)} />}
              {tab==="more"      && <MoreScreen store={store} onOpenGyms={()=>setTab("gyms")}
                onOpenExercises={()=>setTab("exercises")} onOpenSettings={()=>setInSettings(true)} />}
            </>}
      </div>

      {addSheet &&
        <AddSheet hasRoutines={(store.data.routines||[]).length>0}
          active={!!(store.data.workouts||[]).find(w=>!w.endedAt)}
          onPick={pickAdd} onClose={()=>setAddSheet(false)} />}

      {exSheet &&
        <ExerciseSheet store={store} exercise={exSheet.exercise} onSave={saveExercise} onDelete={deleteExercise} onClose={()=>setExSheet(null)} />}

      {gymView &&
        <GymDetail store={store} gymId={gymView} onEdit={(g)=>setGymSheet({gym:g})}
          onStartHere={startHere} onClose={()=>setGymView(null)} notify={showToast} />}

      {gymSheet &&
        <GymSheet gym={gymSheet.gym} onSave={saveGym} onDelete={deleteGym} onClose={()=>setGymSheet(null)} />}

      {blocked &&
        <BlockedSheet existing={blocked.existing} routine={blocked.routine}
          onOpen={()=>{ setWorkoutId(blocked.existing.id); setRoutineId(null); setBlocked(null); }}
          onDiscard={()=>{
            const r = blocked.routine;
            store.saveCollection("workouts",
              (store.data.workouts||[]).filter(w => w.id !== blocked.existing.id));
            setBlocked(null);
            beginRoutine(r);   // gym check still runs, but the open-workout
                               // test does not - we just removed it.
          }}
          onClose={()=>setBlocked(null)} />}

      {startCheck &&
        <StartCheck store={store} routine={startCheck.routine} gym={startCheck.gym}
          onEditGym={()=>{
            // Mark it asked BEFORE opening the sheet: whether he fills it in
            // or backs out, this gym has now had its one prompt.
            const asked = store.cfg.invAsked || [];
            if(asked.indexOf(startCheck.gym.id) === -1)
              store.saveCfg({ ...store.cfg, invAsked: [...asked, startCheck.gym.id] });
            setGymSheet({gym: startCheck.gym}); setStartCheck(null);
          }}
          onStart={(subs)=>{
            const asked = store.cfg.invAsked || [];
            if(!inventoryTrusted(startCheck.gym) && asked.indexOf(startCheck.gym.id) === -1)
              store.saveCfg({ ...store.cfg, invAsked: [...asked, startCheck.gym.id] });
            createFromRoutine(startCheck.routine, startCheck.gym, subs);
          }}
          onCancel={()=>setStartCheck(null)} />}

      {workoutId &&
        <WorkoutEditor key={workoutId} store={store} workoutId={workoutId} undoable={showUndo}
          onClose={()=>setWorkoutId(null)} onFinish={finishWorkout} onDelete={deleteWorkout}
          onSaveAsRoutine={saveAsRoutine} />}

      {routineId &&
        <RoutineEditor key={routineId} store={store} routineId={routineId}
          onClose={()=>setRoutineId(null)} onDelete={deleteRoutine} onStart={startRoutine} />}

      {importer &&
        <ImportLayer store={store} onClose={()=>setImporter(false)}
          onImported={(nw, nx)=>{ setImporter(false);
            showToast("Imported "+nw+" workout"+(nw===1?"":"s")+(nx>0 ? " + "+nx+" new exercise"+(nx===1?"":"s") : "")); }} />}

      {routineImporter &&
        <ImportRoutinesLayer store={store} mode={routineImporter} onClose={()=>setRoutineImporter(null)}
          onImported={(nr, nx, progName)=>{ setRoutineImporter(null); setTab(progName ? "workouts" : "routines");
            showToast(progName
              ? progName+" is ready - your next day is on the home screen"
              : "Added "+nr+" routine"+(nr===1?"":"s")+(nx>0 ? " + "+nx+" new exercise"+(nx===1?"":"s") : "")); }} />}

      {!inSettings &&
        <nav className="nav">
          {["workouts","routines"].map(navBtn)}
          <button className="nav-btn nav-fab" onClick={()=>setAddSheet(true)} aria-label="Create">
            <span className="fab"><Icon d={ICONS.plus} size={26}/></span>
          </button>
          {["progress","more"].map(navBtn)}
        </nav>}

      {toast &&
        <div className="toast">
          {toast.msg}
          {toast.undo &&
            <button className="toast-undo" onClick={toast.undo}>Undo</button>}
        </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

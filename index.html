/* The same affordance everywhere an exercise name is written down: tap the
   (i) to see how it is done. One component so it looks and behaves
   identically in the library, in a routine, and mid-workout. */
function InfoBtn({ name, onClick, style, hasVideo, assets }){
  /* "Should we have icons for play video, view pictures and read description
     all there if they are all available?"

     Answered by context rather than one rule, because the two places this
     appears are doing different jobs.

     BROWSING (the library) is where knowing what exists matters - you are
     surveying coverage, and three small glyphs say at a glance which
     movements still have nothing. So pass `assets` there.

     DOING (mid-workout, mid-routine) is where you want one large target and
     no reading. Three icons in a row on a phone is 130px of chrome next to a
     set you are trying to log. One glyph, showing the richest thing waiting -
     a play circle if a demo is saved, otherwise the info circle - and it
     lands on the same panel either way.

     Both got bigger: 32px was under the 44px touch guideline. */
  if(assets){
    const on = [];
    if(assets.video)    on.push(["play",  ICONS.play,  "demo video"]);
    if(assets.pictures) on.push(["image", ICONS.image, "illustration"]);
    if(assets.notes)    on.push(["text",  ICONS.text,  "written how-to"]);
    return (
      <button className={"info-btn wide"+(assets.video?" has-video":"")} style={style}
        aria-label={on.length ? name+" - has "+on.map(a=>a[2]).join(", ") : "How to do "+name}
        onClick={(e)=>{ e.stopPropagation(); onClick(); }}>
        {on.length
          ? on.map(([k,d]) => <Icon key={k} d={d} size={16}/>)
          : <Icon d={ICONS.info} size={20}/>}
      </button>
    );
  }
  return (
    <button className={"info-btn"+(hasVideo?" has-video":"")} style={style}
      aria-label={(hasVideo ? "Watch the demo for " : "How to do ")+name}
      onClick={(e)=>{ e.stopPropagation(); onClick(); }}>
      <Icon d={hasVideo ? ICONS.play : ICONS.info} size={21}/>
    </button>
  );
}

/* ============================================================
   PASSWORD INPUT with reveal eyeball - the shared-shell STANDARD
   (PORTABLE-IMPROVEMENTS 2026-07-10). Used on EVERY password field.
   ============================================================ */
function PwInput({ value, onChange, placeholder, autoComplete, onEnter }){
  const [show, setShow] = useState(false);
  return (
    <div className="pw-wrap">
      <input className="input" type={show ? "text" : "password"} value={value}
        autoCapitalize="off" autoComplete={autoComplete||"current-password"}
        onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}
        onKeyDown={e=>{ if(e.key==="Enter" && onEnter) onEnter(); }} />
      <button type="button" className="pw-eye" onClick={()=>setShow(s=>!s)}
        aria-label={show ? "Hide password" : "Show password"}>
        <Icon d={show ? ICONS.eyeOff : ICONS.eye} size={19}/>
      </button>
    </div>
  );
}

/* ============================================================
   AUTH SCREEN - sign in / sign up / forgot password
   ============================================================ */
function AuthScreen({ store }){
  /* Arriving from the landing page's "Start free" should START something.
     The app opened on SIGN IN, so a first-time visitor met a form for an
     account they do not have and had to find the switch - the whole funnel
     leaking at the last step. welcome.html links to ./?signup=1 and that
     lands on Create account instead. Anyone else still gets sign in, which
     is right: returning users are the common case. */
  const [mode, setMode] = useState(() => {
    try{ return new URLSearchParams(location.search).get("signup") ? "up" : "in"; }
    catch(e){ return "in"; }
  });                                        // in | up
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [pending, setPending] = useState("");   // email awaiting confirmation
  const [resetSent, setResetSent] = useState(false);

  const submit = async () => {
    setErr(""); setOk("");
    if(!email.trim() || !pw){ setErr("Enter your email and password."); return; }
    if(mode==="up" && pw.length<6){ setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    try{
      if(mode==="up"){
        const { needsConfirm } = await store.signUp(email, pw);
        if(needsConfirm){
          setPending(email.trim());
          setOk("Check your inbox to confirm your email, then sign in.");
          setMode("in");
        }
      } else {
        await store.signIn(email, pw);
        // onAuthStateChange takes over from here.
      }
    }catch(e){
      let m = e.message || "Something went wrong.";
      // Translate raw vendor errors into human copy (playbook section 5).
      if(pending && email.trim()===pending && /invalid/i.test(m)) m = "Confirm your email first - check your inbox.";
      else if(/only request this after/i.test(m)) m = "We just sent an email - try again in a minute.";
      setErr(m); log("ERROR","auth: "+(e.message||m));
    }finally{ setBusy(false); }
  };

  const forgot = async () => {
    setErr(""); setOk("");
    if(!email.trim()){ setErr("Enter your email above first, then tap Forgot password."); return; }
    setBusy(true);
    try{ await store.requestReset(email); setResetSent(true); }
    catch(e){
      let m = e.message || "Couldn't send the reset email.";
      if(/only request this after/i.test(m)) m = "We just sent an email - try again in a minute.";
      setErr(m);
    }
    finally{ setBusy(false); }
  };

  if(resetSent){
    return (
      <div className="auth-wrap">
        <div className="auth-brand">
          <div className="mark">Fitness<span>Captain</span></div>
        </div>
        <div className="auth-msg ok">
          We sent a password-reset link to <b>{email.trim()}</b>. Tap it and you'll be able to set a new password.
        </div>
        <button className="btn btn-ghost btn-block" onClick={()=>{ setResetSent(false); setErr(""); setOk(""); }}>
          Back to sign in
        </button>
      </div>
    );
  }

  // The pending-confirmation trap (playbook section 5): after signup we dim
  // the sign-in flow toward the confirm-first message rather than letting a
  // raw "invalid credentials" confuse the user.
  return (
    <div className="auth-wrap">
      <div className="auth-brand">
        <div className="mark">Fitness<span>Captain</span></div>
        <div className="tag">Log workouts fast. See your progress build.</div>
      </div>
      {!CONFIGURED &&
        <div className="auth-msg err">This build isn't connected to a backend yet: the Supabase and API values still need to be set in index.html.</div>}
      {err && <div className="auth-msg err">{err}</div>}
      {ok && <div className="auth-msg ok">{ok}</div>}
      <div className="field">
        <label className="label">Email</label>
        <input className="input" type="email" autoComplete="email" autoCapitalize="off" autoCorrect="off"
          value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"
          onKeyDown={e=>{ if(e.key==="Enter") submit(); }} />
      </div>
      <div className="field">
        <label className="label">Password</label>
        <PwInput value={pw} onChange={setPw} onEnter={submit}
          placeholder={mode==="up" ? "At least 6 characters" : "Your password"}
          autoComplete={mode==="up" ? "new-password" : "current-password"} />
      </div>
      <button className="btn btn-primary btn-block" disabled={busy || !CONFIGURED} onClick={submit}>
        {busy ? <span className="spin"></span> : (mode==="up" ? "Create account" : "Sign in")}
      </button>
      <div className="auth-switch">
        {mode==="up" ? "Already have an account? " : "New here? "}
        <button onClick={()=>{ setMode(mode==="up"?"in":"up"); setErr(""); setOk(""); }}>
          {mode==="up" ? "Sign in" : "Create one"}
        </button>
      </div>
      {mode==="in" &&
        <button className="auth-forgot" disabled={busy} onClick={forgot}>Forgot password?</button>}
      <p className="hint center" style={{marginTop:18,opacity:.6}}>v{APP_VERSION}</p>
    </div>
  );
}

/* ============================================================
   SET PASSWORD - shown after a password-recovery link lands here.
   ============================================================ */
function SetPassword({ store }){
  const [pw, setPw] = useState("");
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    setErr("");
    if(pw.length<6){ setErr("Password must be at least 6 characters."); return; }
    if(pw!==confirm){ setErr("The two passwords don't match."); return; }
    setBusy(true);
    try{ await store.updatePassword(pw); }
    catch(e){ setErr(e.message||"Couldn't update the password."); }
    finally{ setBusy(false); }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-brand">
        <div className="mark">Fitness<span>Captain</span></div>
        <div className="tag">Choose a new password for {store.authEmail || "your account"}.</div>
      </div>
      {err && <div className="auth-msg err">{err}</div>}
      <div className="field">
        <label className="label">New password</label>
        <PwInput value={pw} onChange={setPw} placeholder="At least 6 characters" autoComplete="new-password" />
      </div>
      <div className="field">
        <label className="label">Confirm new password</label>
        <PwInput value={confirm} onChange={setConfirm} placeholder="Re-enter it" autoComplete="new-password" onEnter={submit} />
      </div>
      <button className="btn btn-primary btn-block" disabled={busy} onClick={submit}>
        {busy ? <span className="spin"></span> : "Update password"}
      </button>
      <p className="hint center" style={{marginTop:16,opacity:.6}}>v{APP_VERSION}</p>
    </div>
  );
}

/* ============================================================
   SWIPE-TO-DELETE row wrapper (portfolio standard, ported from Tracker).
   Swipe a row left to reveal a Delete action. Horizontal-only intent
   detection, so vertical scroll is unaffected; a swipe suppresses the
   row's open-on-tap.
   ============================================================ */
function SwipeRow({ onDelete, className, style, children }){
  const [dx,setDx] = useState(0);
  const st = useRef(null); const moved = useRef(false);
  // Pointer capture is deferred until horizontal drag intent: capturing on
  // pointerdown retargets the follow-up click to the swipe body, which eats
  // desktop mouse clicks on the wrapped row's buttons (rows look dead).
  function down(e){ st.current = { x:e.clientX, y:e.clientY, base:dx }; moved.current = false; }
  function move(e){
    if(!st.current) return;
    const ddx = e.clientX - st.current.x, ddy = e.clientY - st.current.y;
    if(!moved.current && Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)){
      moved.current = true;
      try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
    }
    if(moved.current){ setDx(Math.max(-96, Math.min(0, st.current.base + ddx))); }
  }
  function end(){ if(!st.current) return; st.current = null; setDx(d => { const nd = d <= -48 ? -84 : 0; if(nd===0) moved.current = false; return nd; }); }
  function clickCapture(e){ if(moved.current || dx !== 0){ e.stopPropagation(); e.preventDefault(); moved.current = false; setDx(0); } }
  return (
    /* Spacing belongs on the WRAP, not on the row inside it. The delete panel
       is absolutely positioned to fill this element, so a margin on the child
       makes the wrap taller than the visible card and the red shows above it -
       which is exactly the orange sliver Chris spotted on the in-progress
       card. Callers pass style here instead. */
    <div className={"swipe-wrap"+(className ? " "+className : "")} style={style}>
      <button className="swipe-del" onClick={(e)=>{ e.stopPropagation(); setDx(0); onDelete(); }}>
        <Icon d={ICONS.trash} size={18}/><span>Delete</span>
      </button>
      <div className="swipe-body" style={{ transform:"translateX("+dx+"px)", transition: st.current ? "none" : "transform .18s" }}
        onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onClickCapture={clickCapture}>
        {children}
      </div>
    </div>
  );
}

/* ============================================================
   SCREENS - step-1 shell. Domain features land in build-order steps
   2 (exercise library), 3 (workout logging), 4 (routines), 5 (progress).
   ============================================================ */
/* DAILY CHECKLIST - the non-training inputs that decide whether training
   works (protein, creatine, sleep, steps, sauna, mobility...). Deliberately
   NOT food tracking: the user defines their own items and ticks them off.
   Lives at the top of the home tab because that is the screen opened daily. */
function DailyCard({ store }){
  const [editing, setEditing] = useState(false);
  const [newLabel, setNewLabel] = useState("");
  const daily = store.daily || { habits:[], log:{} };
  const habits = daily.habits || [];
  const log = daily.log || {};
  const today = todayStr();
  const doneToday = log[today] || [];

  const save = (next) => {
    // Bound meta growth: keep roughly a year of history.
    const cutoff = shiftDay(today, -400);
    const log2 = {};
    Object.keys(next.log||{}).forEach(d => { if(!cutoff || d >= cutoff) log2[d] = next.log[d]; });
    store.saveDaily({ habits: next.habits, log: log2 });
  };
  const toggle = (id) => {
    const on = doneToday.indexOf(id) !== -1;
    const list = on ? doneToday.filter(x=>x!==id) : [...doneToday, id];
    save({ habits, log: { ...log, [today]: list } });
  };
  const addHabit = (label) => {
    const l = String(label||"").trim().slice(0,40);
    if(!l || habits.some(h=>h.label.toLowerCase()===l.toLowerCase())) return;
    save({ habits: [...habits, { id: uid(), label: l }], log });
    setNewLabel("");
  };
  const removeHabit = (id) => {
    const log2 = {};
    Object.keys(log).forEach(d => { log2[d] = (log[d]||[]).filter(x=>x!==id); });
    save({ habits: habits.filter(h=>h.id!==id), log: log2 });
  };

  if(!habits.length && !editing){
    return (
      <div className="card" style={{marginTop:14}}>
        <div style={{fontWeight:600,marginBottom:4}}>Daily checklist</div>
        <p className="hint" style={{marginTop:0}}>
          Track the things outside the gym that decide whether the training
          works - protein, supplements, sleep, steps, recovery. Your list, your rules.
        </p>
        <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}} onClick={()=>setEditing(true)}>
          Set up my checklist
        </button>
      </div>
    );
  }

  const unused = HABIT_SUGGESTIONS.filter(s => !habits.some(h=>h.label.toLowerCase()===s.toLowerCase()));

  const doneCount = doneToday.filter(id=>habits.some(h=>h.id===id)).length;
  const allDone = habits.length > 0 && doneCount === habits.length;

  /* Chris: one ticked habit was spending a header, a full-height row and a
     full-width Edit button - four lines of chrome for one checkbox, and it
     looked identical whether he was 0 of 1 or 1 of 1.

     A chip row instead. It stays ONE line as habits are added, where the old
     layout grew a row each time - so the problem got worse precisely when the
     checklist started doing its job. Editing moves to a pencil, and the whole
     row goes muted once everything is ticked: still visible, no longer asking
     for anything. */
  return (
    <div className="card" style={{marginTop:14,paddingTop:12,paddingBottom:12,
                                  opacity: allDone && !editing ? .62 : 1}}>
      <div className="updrow" style={{gap:10,alignItems:"center"}}>
        {/* Status lives with the label, NOT in the chip container - as a flex
            item among the chips it wrapped onto its own line and cost the row
            its whole point. */}
        <span className="subtle" style={{fontSize:12.5,flex:"0 0 auto"}}>
          {allDone && !editing ? "Today - all done" : "Today"}
          {!allDone && habits.length>1 ? " " + doneCount + "/" + habits.length : ""}
        </span>
        <div className="pills" style={{marginTop:0,flex:1}}>
          {habits.map(h => {
            const on = doneToday.indexOf(h.id) !== -1;
            const st = habitStreak(log, h.id);
            return (
              <button key={h.id} className={"pill "+(on?"on":"")} onClick={()=>toggle(h.id)}
                aria-label={(on?"Uncheck ":"Check ")+h.label}>
                {on ? "✓ " : ""}{h.label}{st>1 ? " · "+st+"d" : ""}
              </button>
            );
          })}
        </div>
        <button className="info-btn" style={{flex:"0 0 auto",width:34,height:34}}
          onClick={()=>setEditing(e=>!e)} aria-label={editing ? "Done editing checklist" : "Edit checklist"}>
          <Icon d={editing ? ICONS.check : ICONS.edit} size={16}/>
        </button>
      </div>

      {editing && <>
        <div className="hint" style={{marginTop:10,marginBottom:0}}>
          Tap a habit above to tick it. Remove or add below.
        </div>
        {habits.length>0 &&
          <div className="pills" style={{marginTop:8}}>
            {habits.map(h =>
              <button key={h.id} className="pill" onClick={()=>removeHabit(h.id)}>
                {h.label} <span style={{opacity:.6}}>&times;</span>
              </button>)}
          </div>}
        {unused.length>0 &&
          <div className="pills" style={{marginTop:8}}>
            {unused.map(x => <button key={x} className="pill" onClick={()=>addHabit(x)}>+ {x}</button>)}
          </div>}
        <div className="row" style={{marginTop:10}}>
          <input className="input" style={{flex:1}} value={newLabel} onChange={e=>setNewLabel(e.target.value)}
            placeholder="Add your own" onKeyDown={e=>{ if(e.key==="Enter") addHabit(newLabel); }} />
          <button className="btn btn-ghost btn-sm" style={{flex:"0 0 auto"}} onClick={()=>addHabit(newLabel)}>Add</button>
        </div>
      </>}
    </div>
  );
}

/* NEXT UP - the answer to "what do I do today" with zero thinking. Sits
   above everything on the home tab whenever a program is active. */
function NextUpCard({ store, onStartRoutine, onOpenWorkout }){
  /* Chris: "I should be able to preview this workout before starting it."
     The card named the day and counted the exercises, then offered a
     full-width Start. Committing to a session on a name and a number is a
     bad trade when you are standing in the gym deciding whether you have
     the time or the kit for it.

     Expanded IN PLACE rather than opening the routine editor. That editor
     already shows all of this, but it lives on another tab and it is an
     EDIT surface - the wrong thing to hand someone whose next action is to
     start training. */
  const [peek, setPeek] = useState(false);
  const prog = activeProgram(store);
  const next = programNext(prog, store.data.routines||[]);
  if(!next) return null;
  const busy = (store.data.workouts||[]).find(w=>!w.endedAt) || null;
  // Chris: "two sections that say there's a workout in progress is just
  // overload." He was right - this card grew a big "go to your workout in
  // progress" button AND a sentence about it, while the dedicated card
  // below said the same thing again. Now the in-progress card owns that
  // message alone. If the open workout IS this program day, this card is
  // redundant entirely and disappears; otherwise it goes quiet and just
  // says what is queued.
  if(busy && busy.routineId === next.routine.id) return null;
  if(busy) return (
    <div className="card" style={{marginTop:14}}>
      <div className="updrow" style={{marginBottom:6}}>
        <span className="subtle" style={{fontSize:12}}>{prog.name}</span>
        <span className="subtle" style={{fontSize:12}}>day {next.position} of {next.total}</span>
      </div>
      <div style={{fontWeight:700,fontSize:16}}>{next.routine.name}</div>
      <div className="item-meta" style={{marginTop:6}}>
        <span className="chip">up next</span>
        <span className="chip">{(next.routine.items||[]).length} exercise{(next.routine.items||[]).length===1?"":"s"}</span>
      </div>
    </div>
  );
  return (
    <div className="card" style={{marginTop:14,borderColor:"var(--amber-line)",background:"var(--amber-dim)"}}>
      <div className="updrow" style={{marginBottom:6}}>
        <span className="subtle" style={{fontSize:12}}>{prog.name}</span>
        <span className="subtle" style={{fontSize:12}}>day {next.position} of {next.total}</span>
      </div>
      <div style={{fontWeight:700,fontSize:18,color:"var(--amber-2)"}}>{next.routine.name}</div>
      <div className="item-meta" style={{marginTop:6}}>
        <button className="chip" style={{cursor:"pointer"}} onClick={()=>setPeek(v=>!v)}>
          {(next.routine.items||[]).length} exercise{(next.routine.items||[]).length===1?"":"s"}
          {peek ? " - hide" : " - see them"}
        </button>
        {next.routine.gymName && <span className="chip blue">{next.routine.gymName}</span>}
      </div>

      {peek &&
        <div className="card" style={{marginTop:10,background:"var(--bg)",paddingTop:6,paddingBottom:6}}>
          {(next.routine.items||[]).map(it => {
            const pl = planOf(it);
            return (
              <div key={it.id} className="set-row" style={{cursor:"default"}}>
                <span className="set-main" style={{fontWeight:500}}>{it.name}</span>
                <span className="chip" style={{flex:"0 0 auto"}}>
                  {pl ? pl.length + " sets"
                      : (it.type === "cardio" ? it.type
                         : (Number(it.targetSets)>0
                            ? it.targetSets + " x " + it.targetReps
                            : it.type))}
                </span>
              </div>
            );
          })}
          {/* Says what the session costs, which is the other half of the
              decision - the plan budgets about three minutes a set. */}
          <p className="hint" style={{margin:"8px 0 2px"}}>
            {(() => {
              const sets = (next.routine.items||[]).reduce((n,it) => {
                const pl = planOf(it);
                return n + (pl ? pl.length : (Number(it.targetSets)||0));
              }, 0);
              return sets ? sets + " sets, roughly " + Math.max(5, Math.round(sets*3)) + " minutes." : "";
            })()}
          </p>
        </div>}

      <button className="btn btn-primary btn-block" style={{marginTop:12}}
        onClick={()=>onStartRoutine(next.routine)}>
        Start {next.routine.name}
      </button>
    </div>
  );
}

function WorkoutsScreen({ store, onStart, onOpen, onImport, onDelete, onDiscard, onStartRoutine }){
  const units = store.cfg.units || "lb";
  const workouts = (store.data.workouts||[]).slice()
    .sort((a,b)=>String(b.startedAt||"").localeCompare(String(a.startedAt||"")));
  const activeW = workouts.find(w=>!w.endedAt);
  const done = workouts.filter(w=>w.endedAt);

  if(!workouts.length){
    return (
      <div>
        <div className="empty" style={{paddingBottom:10}}>
          <div className="glyph">FC</div>
          <h3 className="title-sm">Your training log starts here</h3>
          <p>Start a workout, add exercises, and log sets with two taps. Everything pre-fills from last time.</p>
          <button className="btn btn-primary" style={{marginTop:18}} onClick={onStart}>
            <Icon d={ICONS.plus} size={16}/> Start a workout
          </button>
          <button className="btn btn-ghost btn-sm" style={{marginTop:12}} onClick={onImport}>
            Import past workouts
          </button>
        </div>
        <NextUpCard store={store} onStartRoutine={onStartRoutine} onOpenWorkout={onOpen} />
        <DailyCard store={store} />
      </div>
    );
  }

  return (
    <div>
      {/* An open workout is the single most actionable thing on this screen,
          so it goes first - above the program card, which now stays quiet
          while one is running rather than repeating the same news. */}
      {/* Chris: "we should be able to swipe more of these cards to delete -
          like workout in progress, when I know I'm going to delete it."
          Every other row in the app already swipes; this one was a bare
          button. The confirm stays because an in-progress session can hold
          real logged work. */}
      {activeW &&
        <SwipeRow style={{marginTop:14}} onDelete={()=>{
          const n = workoutSets(activeW);
          if(confirm('Discard "' + (activeW.name || "this workout") + '"?' +
                     (n ? " " + n + " logged set" + (n===1?"":"s") + " will be lost." : "")))
            onDiscard(activeW);
        }}>
        <button className="item" style={{borderColor:"var(--amber-line)",background:"var(--amber-dim)"}} onClick={()=>onOpen(activeW)}>
          <div className="item-body">
            <div className="item-title" style={{color:"var(--amber-2)"}}>Workout in progress</div>
            <div className="item-meta">
              <span className="chip amber">{activeW.name}</span>
              <span className="chip">{(activeW.entries||[]).length} exercise{(activeW.entries||[]).length===1?"":"s"}</span>
              <span className="chip">{workoutSets(activeW)} sets</span>
              {/* A workout open for days is almost always forgotten rather
                  than paused. Say so here, so it is noticed before it blocks
                  the next Start. */}
              {activeW.startedAt && (Date.now()-new Date(activeW.startedAt).getTime())/1000 > 12*3600 &&
                <span className="chip red">
                  open {fmtClock((Date.now()-new Date(activeW.startedAt).getTime())/1000)}
                </span>}
            </div>
            <p className="hint" style={{margin:"8px 0 0"}}>Tap to pick it back up, swipe to discard it.</p>
          </div>
        </button>
        </SwipeRow>}

      <NextUpCard store={store} onStartRoutine={onStartRoutine} onOpenWorkout={onOpen} />
      <DailyCard store={store} />

      {!activeW &&
        /* Only ONE orange button per screen. With a program running, the
           Next up card is the recommendation and an ad-hoc start is the
           alternative - two primaries side by side make the app look
           undecided about what you should do. */
        <button className={"btn btn-block "+(activeProgram(store) ? "btn-ghost" : "btn-primary")}
          style={{marginTop:14}} onClick={onStart}>
          <Icon d={ICONS.plus} size={16}/> Start a workout
        </button>}

      <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10}} onClick={onImport}>
        Import past workouts
      </button>

      {!done.length
        ? <div className="empty" style={{padding:"40px 20px"}}>
            <p>Finished workouts show up here as your history.</p>
          </div>
        : <div className="list">
            {done.map(w => {
              const vol = workoutVolume(w);
              return (
                <SwipeRow key={w.id} onDelete={()=>onDelete(w)}>
                  <button className="item" onClick={()=>onOpen(w)}>
                    <div className="item-body">
                      <div className="item-title">{w.name || "Workout"}</div>
                      <div className="item-meta">
                        <span className="chip">{fmtDate(w.date)}</span>
                        {w.gymName && <span className="chip blue">{w.gymName}</span>}
                        <span className="chip amber">{(w.entries||[]).length} exercise{(w.entries||[]).length===1?"":"s"}</span>
                        {workoutSets(w)>0 && <span className="chip">{workoutSets(w)} sets</span>}
                        {vol>0 && <span className="chip">{fmtNum(vol)} {units}</span>}
                        {w.durationMin>0 && <span className="chip">{w.durationMin} min</span>}
                      </div>
                    </div>
                  </button>
                </SwipeRow>
              );
            })}
          </div>}
    </div>
  );
}

/* Assign a primary muscle group to library exercises that never got one
   (imports used to stamp everything "Full body"). Applies straight away and
   returns what changed so the caller can offer an undo: which muscle a
   bench press trains is not a judgement call, so making the user approve a
   list was pure friction. Anything odd is still editable per exercise. */
async function classifyExercises(store){
  const list = (store.data.exercises||[])
    .filter(x => (x.muscleGroup||"Full body")==="Full body").slice(0,120);
  if(!list.length) throw new Error("Nothing to sort.");
  const system = 'You assign each exercise its PRIMARY muscle group. Return ONLY strict JSON, ' +
    'no prose and no markdown fences: {"items":[{"name":"exact name given","group":"..."}]}. ' +
    'group must be exactly one of: ' + MUSCLE_GROUPS.join(", ") + '. ' +
    'Use "Full body" ONLY for genuine whole-body movements (swings, carries, sled work, ' +
    'burpees, general conditioning). Mobility drills get the area they target ' +
    '(a thoracic rotation drill is Back, a hip stretch is Legs). Return every name exactly ' +
    'as given, once.';
  const out = await aiRelay("classify_exercises",
    [{ role:"user", content: list.map(x=>x.name+" ("+(x.type||"strength")+")").join("\n") }],
    { system, maxTokens: 4000 });
  let obj;
  try{ obj = JSON.parse(stripFences(out)); }
  catch(e){ throw new Error("Couldn't read the result - try again."); }
  const byName = {}; list.forEach(x => { byName[normName(x.name)] = x; });
  const changes = (Array.isArray(obj && obj.items)?obj.items:[]).map(it => {
    const ex = byName[normName(it.name)];
    if(!ex || !MUSCLE_GROUPS.includes(it.group)) return null;
    const from = ex.muscleGroup || "Full body";
    if(it.group === from) return null;
    return { id: ex.id, name: ex.name, from, to: it.group };
  }).filter(Boolean);
  if(!changes.length) throw new Error("Those all look right already - nothing to change.");
  const map = {}; changes.forEach(c => { map[c.id] = c.to; });
  store.saveCollection("exercises", (store.data.exercises||[]).map(x =>
    map[x.id] ? { ...x, muscleGroup: map[x.id], updatedAt: nowISO() } : x));
  log("CLASSIFY","sorted "+changes.length+" exercises");
  return changes;
}

/* Rename the library to the reference database's canonical titles and fill
   empty descriptions from its written instructions. Denormalized name
   snapshots inside workouts and routines are rewritten too, or history
   would keep showing the old title forever. Own notes are never
   overwritten - only empty ones get filled. */
async function normalizeLibrary(store){
  const idx = await loadMediaIndex();
  if(!idx) throw new Error("Couldn't load the reference database.");
  const exs = store.data.exercises || [];
  const changes = [];
  exs.forEach(x => {
    const m = matchMediaScored(idx, x.name);
    if(!m || m.score < RENAME_THRESHOLD) return;
    const rename = normName(m.item.n) !== normName(x.name);
    const desc = !String(x.notes||"").trim();
    // Imports used to stamp every exercise "none", so a whole library can be
    // equipment-blind - which quietly breaks gym coverage and the picker's
    // "not at this gym" flag.
    const equip = !x.equipment || x.equipment === "none";
    if(!rename && !desc && !equip) return;
    changes.push({ id:x.id, fromName:x.name, toName:m.item.n, folder:m.item.f,
                   rename, desc, equip, fromNotes:x.notes||"", newNotes:"",
                   fromEquip:x.equipment||"none", newEquip:"" });
  });
  if(!changes.length) throw new Error("Everything already lines up with the reference database.");

  const need = changes.filter(c => c.desc || c.equip);
  let cursor = 0;
  const worker = async () => {
    while(cursor < need.length){
      const c = need[cursor++];
      const ref = await fetchReference(c.folder);
      if(c.desc) c.newNotes = refInstructions(ref);
      if(c.equip) c.newEquip = refEquipment(ref) || "";
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);

  const byId = {}; changes.forEach(c => { byId[c.id] = c; });
  store.saveCollection("exercises", exs.map(x => {
    const c = byId[x.id];
    if(!c) return x;
    const next = { ...x, updatedAt: nowISO() };
    if(c.rename) next.name = c.toName;
    if(c.desc && c.newNotes) next.notes = c.newNotes;
    if(c.equip && c.newEquip) next.equipment = c.newEquip;
    return next;
  }));
  const renamed = {}; changes.filter(c=>c.rename).forEach(c => { renamed[c.id] = c.toName; });
  if(Object.keys(renamed).length){
    store.saveCollection("workouts", (store.data.workouts||[]).map(w => ({
      ...w, entries: (w.entries||[]).map(e => renamed[e.exerciseId] ? { ...e, name: renamed[e.exerciseId] } : e)
    })));
    store.saveCollection("routines", (store.data.routines||[]).map(r => ({
      ...r, items: (r.items||[]).map(it => renamed[it.exerciseId] ? { ...it, name: renamed[it.exerciseId] } : it)
    })));
  }
  log("NORMALIZE","applied "+changes.length+" changes ("+Object.keys(renamed).length+" renames)");
  return changes;
}

function ExercisesScreen({ store, onAdd, onEdit, onDelete }){
  const [help, setHelp] = useState(null);          // {name, exerciseId} for the (i) panel
  // Chris asked "did we get all the exercise pictures?" - a question the app
  // should be able to answer itself rather than needing a script run.
  const [mediaIdx, setMediaIdx] = useState(null);
  const [addingRef, setAddingRef] = useState(null);
  useEffect(() => { let alive = true;
    loadMediaIndex().then(i => { if(alive) setMediaIdx(i); });
    return () => { alive = false; }; }, []);

  const [q, setQ] = useState("");
  /* Must sit AFTER q: it reads it, and const does not hoist. Putting this
     above the useState threw "Cannot access 'q' before initialization" and
     took the whole Library screen blank - the same trap as the Done flag. */
  /* Chris, filtered to Shoulders and looking at five results: "not enough
     exercises available, we need access to more of the library." The 873 were
     searchable from the PICKER but not from the screen actually called
     Exercises, which is where you go when you want to browse what exists. */
  const mineKeys = new Set((store.data.exercises||[]).map(x => normName(x.name)));
  const refHits = searchReference(mediaIdx, mineKeys, q, 12);
  const addRef = async (item) => {
    setAddingRef(item.f);
    try{ await createFromReference(store, item); }
    catch(e){ log("ERROR","library add from reference: "+e.message); }
    finally{ setAddingRef(null); }
  };
  const [typeF, setTypeF] = useState("all");
  const [groupF, setGroupF] = useState("all");
  const [normBusy, setNormBusy] = useState(false);
  const [normed, setNormed] = useState(null);      // change list, for the undo card
  const [normErr, setNormErr] = useState("");
  const [sorting, setSorting] = useState(false);
  const [sorted, setSorted] = useState(null);     // change list, for the undo card
  const [sortErr, setSortErr] = useState("");
  const exercises = store.data.exercises || [];
  const unclassified = exercises.filter(x => (x.muscleGroup||"Full body")==="Full body");

  const runNormalize = async () => {
    setNormBusy(true); setNormErr("");
    try{ setNormed(await normalizeLibrary(store)); }
    catch(e){ setNormErr(e.message||"Couldn't normalize."); log("ERROR","normalize: "+e.message); }
    finally{ setNormBusy(false); }
  };
  const undoNormalize = () => {
    const list = normed || [];
    const byId = {}; list.forEach(c => { byId[c.id] = c; });
    store.saveCollection("exercises", (store.data.exercises||[]).map(x => {
      const c = byId[x.id];
      return c ? { ...x, name: c.fromName, notes: c.fromNotes, equipment: c.fromEquip, updatedAt: nowISO() } : x;
    }));
    const back = {}; list.filter(c=>c.rename).forEach(c => { back[c.id] = c.fromName; });
    if(Object.keys(back).length){
      store.saveCollection("workouts", (store.data.workouts||[]).map(w => ({
        ...w, entries: (w.entries||[]).map(e => back[e.exerciseId] ? { ...e, name: back[e.exerciseId] } : e)
      })));
      store.saveCollection("routines", (store.data.routines||[]).map(r => ({
        ...r, items: (r.items||[]).map(it => back[it.exerciseId] ? { ...it, name: back[it.exerciseId] } : it)
      })));
    }
    log("NORMALIZE","undo "+list.length+" changes");
    setNormed(null);
  };

  const runSort = async () => {
    setSorting(true); setSortErr("");
    try{ setSorted(await classifyExercises(store)); }
    catch(e){ setSortErr(e.message||"Couldn't sort them."); log("ERROR","classify: "+e.message); }
    finally{ setSorting(false); }
  };
  const undoSort = () => {
    const map = {}; (sorted||[]).forEach(c => { map[c.id] = c.from; });
    store.saveCollection("exercises", (store.data.exercises||[]).map(x =>
      map[x.id] ? { ...x, muscleGroup: map[x.id], updatedAt: nowISO() } : x));
    log("CLASSIFY","undo "+(sorted||[]).length+" changes");
    setSorted(null);
  };

  if(!exercises.length){
    return (
      <div className="empty">
        <div className="glyph">+</div>
        <h3 className="title-sm">Exercise library</h3>
        <p>The starter library loads on your first sync. Add your own any time.</p>
        <button className="btn btn-primary" style={{marginTop:18}} onClick={onAdd}>
          <Icon d={ICONS.plus} size={16}/> Add an exercise
        </button>
      </div>
    );
  }

  const needle = q.trim().toLowerCase();
  const filtered = exercises
    .filter(x => typeF==="all" || x.type===typeF)
    .filter(x => groupF==="all" || x.muscleGroup===groupF)
    .filter(x => !needle || (x.name||"").toLowerCase().indexOf(needle)!==-1 ||
                 (x.equipment||"").toLowerCase().indexOf(needle)!==-1)
    .slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""));

  return (
    <div>
      <div className="search-wrap">
        <input className="input" value={q} onChange={e=>setQ(e.target.value)}
          placeholder="Search exercises" autoCapitalize="off" autoCorrect="off" />
        {q &&
          <button className="search-x" onClick={()=>setQ("")} aria-label="Clear search">
            <Icon d={ICONS.x} size={16}/>
          </button>}
      </div>
      <div className="pills-row">
        {["all"].concat(EXERCISE_TYPES).map(t =>
          <button key={t} className={"pill "+(typeF===t?"on":"")} onClick={()=>setTypeF(t)}>
            {t==="all" ? "All types" : t.charAt(0).toUpperCase()+t.slice(1)}
          </button>)}
      </div>
      <div className="pills-row">
        {["all"].concat(MUSCLE_GROUPS).map(g =>
          <button key={g} className={"pill "+(groupF===g?"on":"")} onClick={()=>setGroupF(g)}>
            {g==="all" ? "All muscles" : g}
          </button>)}
      </div>
      {normed
        ? <div className="card" style={{marginBottom:12}}>
            <div style={{fontWeight:600,marginBottom:6}}>
              Matched {normed.length} exercise{normed.length===1?"":"s"} to the reference database
            </div>
            {normed.slice(0,12).map(c => (
              <div key={c.id} className="set-row" style={{cursor:"default",display:"block"}}>
                <div style={{fontWeight:500,fontSize:14.5}}>
                  {c.rename ? c.fromName+" -> "+c.toName : c.toName}
                </div>
                {(c.desc && c.newNotes) || (c.equip && c.newEquip)
                  ? <div className="hint" style={{marginTop:1}}>
                      {[c.desc && c.newNotes ? "description added" : null,
                        c.equip && c.newEquip ? c.newEquip : null].filter(Boolean).join(" - ")}
                    </div>
                  : null}
              </div>
            ))}
            {normed.length>12 && <div className="hint">and {normed.length-12} more</div>}
            <div className="row" style={{marginTop:10}}>
              <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={undoNormalize}>Undo</button>
              <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>setNormed(null)}>Done</button>
            </div>
          </div>
        : <div className="card" style={{marginBottom:12}}>
            <div style={{fontWeight:600,marginBottom:4}}>Match the reference database</div>
            <p className="hint" style={{marginTop:0}}>
              Renames your exercises to the standard titles, and fills in any
              missing descriptions and equipment from the reference database.
              Your own notes are left alone.
            </p>
            {normErr && <div className="auth-msg err" style={{marginTop:8}}>{normErr}</div>}
            <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}}
              disabled={normBusy} onClick={runNormalize}>
              {normBusy ? <span className="spin"></span> : "Normalize my library"}
            </button>
          </div>}
      {sorted
        ? <div className="card" style={{marginBottom:12}}>
            <div style={{fontWeight:600,marginBottom:6}}>
              Sorted {sorted.length} exercise{sorted.length===1?"":"s"}
            </div>
            {sorted.slice(0,12).map(c => (
              <div key={c.id} className="set-row" style={{cursor:"default"}}>
                <span className="set-main" style={{fontWeight:500}}>{c.name}</span>
                <span className="chip amber" style={{flex:"0 0 auto"}}>{c.to}</span>
              </div>
            ))}
            {sorted.length>12 && <div className="hint">and {sorted.length-12} more</div>}
            <div className="row" style={{marginTop:10}}>
              <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={undoSort}>Undo</button>
              <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>setSorted(null)}>Done</button>
            </div>
          </div>
        : (unclassified.length >= 3 &&
            <div className="card" style={{marginBottom:12}}>
              <div className="subtle" style={{marginBottom:8}}>
                {unclassified.length} exercises have no muscle group. Sets by muscle
                needs them sorted - tap once and it's done.
              </div>
              {sortErr && <div className="auth-msg err" style={{marginBottom:8}}>{sortErr}</div>}
              <button className="btn btn-ghost btn-sm btn-block" disabled={sorting} onClick={runSort}>
                {sorting ? <span className="spin"></span> : "Sort them into muscle groups"}
              </button>
            </div>)}
      {!filtered.length
        ? <div className="empty" style={{padding:"36px 20px"}}>
            <h3 className="title-sm">No matches</h3>
            <p>Nothing fits that search and filter combination.</p>
          </div>
        : <div className="list">
            {filtered.map(x => (
              <SwipeRow key={x.id} onDelete={()=>onDelete(x)}>
                <div className="row" style={{gap:0,alignItems:"stretch"}}>
                  <button className="item" style={{flex:1,minWidth:0}} onClick={()=>onEdit(x)}>
                    <div className="item-body">
                      <div className="item-title">{x.name}</div>
                      <div className="item-meta">
                        <span className={"chip "+typeClass(x.type)}>{x.type}</span>
                        {x.muscleGroup && <span className="chip">{x.muscleGroup}</span>}
                        {x.equipment && x.equipment!=="none" && <span className="chip">{x.equipment}</span>}
                        {x.custom && <span className="chip violet">custom</span>}
                      </div>
                    </div>
                  </button>
                  <InfoBtn name={x.name}

                </div>
              </SwipeRow>
            ))}
          </div>}
      {/* Offered when your own library comes up short, which is exactly when
          you are looking for something you do not have. */}
      {refHits.length > 0 && <>
        <div className="set-group">Not in your library yet</div>
        {refHits.map(it => (
          <button key={it.f} className="item" disabled={!!addingRef} onClick={()=>addRef(it)}>
            <div className="item-body">
              <div className="item-title">{it.n}</div>
              <div className="item-meta">
                <span className="chip blue">reference database</span>
                {addingRef===it.f && <span className="chip">adding...</span>}
              </div>
            </div>
          </button>
        ))}
        <p className="hint center" style={{marginTop:8}}>
          Adding one brings its equipment, muscle group, instructions and pictures.
        </p>
      </>}

      {q.trim().length > 1 && refHits.length === 0 && mediaIdx &&
        <p className="hint center" style={{marginTop:12}}>
          Nothing else in the reference database matches "{q.trim()}". Use + to add your own.
        </p>}

      <p className="hint center" style={{marginTop:14,opacity:.7}}>
        {filtered.length} of {exercises.length} exercises
        {mediaIdx ? ", searching " + Object.keys(mediaIdx.items).length + " more" : ""}
      </p>
      {/* Coverage, stated plainly. The reference database is strong on
          conventional gym work and has nothing for specialty or mobility
          movements - landmine, med ball, 90/90 - so a shortfall here is
          expected, not a fault. Those are what the demo video is for. */}
      {mediaIdx && exercises.length > 0 &&
        <p className="hint center" style={{marginTop:2,marginBottom:0,opacity:.7}}>
          {(() => {
            const pics = exercises.filter(x => matchMedia(mediaIdx, x.name)).length;
            const vids = exercises.filter(x => x.demoVideoId).length;
            return pics + (pics===1 ? " has an illustration" : " have illustrations") + " - " +
                   vids + (vids===1 ? " has a saved demo" : " have a saved demo");
          })()}
        </p>}

      {/* No gym in scope here - the library is gym-agnostic, so the help
          panel offers its own picker instead of defaulting to one. */}
      {help &&
        <ExerciseHelp store={store} name={help.name} exerciseId={help.exerciseId}
          onClose={()=>setHelp(null)} />}
    </div>
  );
}

/* Add/edit one exercise. Deleting is allowed for seed items too - the
   once-per-account seed flag means they stay deleted. */
function ExerciseSheet({ store, exercise, onSave, onDelete, onClose }){
  const [name, setName] = useState(exercise ? (exercise.name||"") : "");
  const [type, setType] = useState(exercise ? (exercise.type||"strength") : "strength");
  const [group, setGroup] = useState(exercise ? (exercise.muscleGroup||"Full body") : "Full body");
  const [equip, setEquip] = useState(exercise ? (exercise.equipment||"none") : "none");
  const [notes, setNotes] = useState(exercise ? (exercise.notes||"") : "");
  // undefined = follow the app default, a number = this movement's own rest.
  const [rest, setRest] = useState(exercise && exercise.restSecs !== undefined ? exercise.restSecs : undefined);
  const [explaining, setExplaining] = useState(false);
  const [explainErr, setExplainErr] = useState("");
  const [help, setHelp] = useState(false);   // the same panel the (i) opens

  // "How do I do this?" - the explain_exercise relay task writes form cues
  // into the notes; the user reviews and Saves (nothing persists until then),
  // and the result is cached on the exercise from then on.
  const explain = async () => {
    if(!name.trim()){ setExplainErr("Name the exercise first."); return; }
    setExplaining(true); setExplainErr("");
    try{
      const system = "You write concise exercise instructions as plain text (no markdown, no headers). " +
        "Structure: one setup line; 2-4 numbered execution steps; then 'Cues:' with 2-3 short cues; " +
        "then 'Avoid:' with 1-2 common mistakes. Under 130 words total. No introduction or closing.";
      const out = await aiRelay("explain_exercise",
        [{ role:"user", content: "Exercise: "+name.trim()+". Type: "+type+". Muscle group: "+group+". Equipment: "+equip+"." }],
        { system, maxTokens: 1000 });
      if(out && out.trim()) setNotes(out.trim());
      else throw new Error("No instructions came back - try again.");
    }catch(e){ setExplainErr(e.message||"Couldn't fetch instructions."); }
    finally{ setExplaining(false); }
  };

  const save = () => {
    if(!name.trim()) return;
    onSave({
      id: exercise ? exercise.id : uid(),
      name: name.trim(), type, muscleGroup: group, equipment: equip,
      restSecs: rest,
      notes: notes.trim(),
      custom: exercise ? (exercise.custom!==false) : true,
      createdAt: exercise ? (exercise.createdAt||nowISO()) : nowISO(),
      updatedAt: nowISO(),
    });
  };

  return (
    <>
      <div className="scrim" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{exercise ? "Edit exercise" : "Add an exercise"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <div className="title-field">
          <label className="label">Name</label>
          <input className="title-input" value={name} onChange={e=>setName(e.target.value)}
            placeholder="e.g. Incline Dumbbell Press" autoFocus={!exercise} />
        </div>

        <div className="field">
          <label className="label">Type</label>
          <div className="pills" style={{marginTop:4}}>
            {EXERCISE_TYPES.map(t =>
              <button key={t} className={"pill "+(type===t?"on":"")} onClick={()=>setType(t)}>
                {t.charAt(0).toUpperCase()+t.slice(1)}
              </button>)}
          </div>
        </div>

        <div className="row">
          <div className="field">
            <label className="label">Muscle group</label>
            <select className="select" value={group} onChange={e=>setGroup(e.target.value)}>
              {MUSCLE_GROUPS.map(g=><option key={g} value={g}>{g}</option>)}
            </select>
          </div>
          <div className="field">
            <label className="label">Equipment</label>
            <select className="select" value={equip} onChange={e=>setEquip(e.target.value)}>
              {EQUIPMENT.map(g=><option key={g} value={g}>{g}</option>)}
            </select>
          </div>
        </div>

        <div className="field">
          <label className="label">Rest between sets</label>
          <div className="hint" style={{marginTop:0,marginBottom:6}}>
            A heavy hinge wants two or three minutes; a calf raise wants forty
            seconds. Leave it on the default unless this movement disagrees.
          </div>
          <div className="pills" style={{marginTop:4}}>
            <button className={"pill "+(rest===undefined?"on":"")} onClick={()=>setRest(undefined)}>
              App default
            </button>
            {[0,45,60,90,120,180].map(v => (
              <button key={v} className={"pill "+(rest===v?"on":"")} onClick={()=>setRest(v)}>
                {v===0 ? "None" : (v>=60 ? (v/60)+" min" : v+"s")}
              </button>
            ))}
          </div>
        </div>

        <div className="field">
          <label className="label">Notes / how to do it</label>
          <textarea className="textarea" style={notes.length>200 ? {minHeight:170} : null}
            value={notes} onChange={e=>setNotes(e.target.value)}
            placeholder="Form cues, seat settings, anything worth remembering." />
          {explainErr && <div className="auth-msg err" style={{marginTop:8,marginBottom:0}}>{explainErr}</div>}
          <div className="row" style={{marginTop:8}}>
            <button className="btn btn-ghost btn-sm" disabled={explaining} onClick={explain}>
              {explaining ? <span className="spin"></span> : (notes.trim() ? "Rewrite how-to" : "How to do it")}
            </button>
            {/* This used to be an anchor straight out to a YouTube SEARCH.
                Chris: tapping the exercise itself "just gives me a button
                that takes me out of app to YouTube" while the (i) plays the
                demo inline - two different answers to the same question.
                Same destination as the (i) now; the YouTube escape hatch
                still lives inside that panel. */}
            <button className="btn btn-ghost btn-sm" onClick={()=>setHelp(true)}>
              Pictures and video
            </button>
          </div>
        </div>

        <button className="btn btn-primary btn-block" onClick={save} disabled={!name.trim()}>
          {exercise ? "Save changes" : "Add exercise"}
        </button>
        {exercise &&
          <button className="btn btn-danger btn-block" style={{marginTop:10}}
            onClick={()=>{ if(confirm("Delete this exercise? Logged workouts keep their history.")) onDelete(exercise.id); }}>
            Delete exercise
          </button>}
      </div>

      {/* Layer z-index 88 beats the sheet's 61, so this opens OVER the form
          rather than the sheet having to close and lose unsaved edits. */}
      {help &&
        <ExerciseHelp store={store} name={name} exerciseId={exercise ? exercise.id : null}
          onClose={()=>setHelp(false)} />}
    </>
  );
}

/* ============================================================
   GYMS - the places you train. Each gym = equipment TAGS (drive the
   location-aware exercise picker) + a free-text INVENTORY (browsable, and
   the knowledge base the AI reads when designing workouts for a location).
   Rides on synced meta - no backend change.
   ============================================================ */
function GymSheet({ gym, onSave, onDelete, onClose }){
  const [name, setName] = useState(gym ? (gym.name||"") : "");
  const [kind, setKind] = useState(gym ? (gym.kind||"home") : "home");
  const [equip, setEquip] = useState(gym && Array.isArray(gym.equipment) ? gym.equipment : []);
  const [inventory, setInventory] = useState(gym ? (gym.inventory||"") : "");
  const [confirmed, setConfirmed] = useState(gym ? !!gym.invConfirmed : false);

  const toggleEquip = (e) => setEquip(prev => prev.includes(e) ? prev.filter(x=>x!==e) : [...prev, e]);

  const save = () => {
    if(!name.trim()) return;
    onSave({
      id: gym ? gym.id : uid(),
      name: name.trim(), kind, equipment: equip,
      invConfirmed: confirmed || undefined,
      inventory: inventory.trim(),
      // Carry the AI-organized catalog ONLY while the source text is
      // unchanged; edited text means the catalog is stale -> re-organize.
      catalog: (gym && (gym.inventory||"")===inventory.trim() && Array.isArray(gym.catalog)) ? gym.catalog : undefined,
      createdAt: gym ? (gym.createdAt||nowISO()) : nowISO(),
      updatedAt: nowISO(),
    });
  };

  return (
    <>
      {/* Above the gym place-page layer (z-80), since editing opens from it. */}
      <div className="scrim" style={{zIndex:85}} onClick={onClose}></div>
      <div className="sheet" style={{zIndex:86}}>
        <div className="sheet-grip"></div>
        <div className="sheet-head">
          <h2 className="sheet-title">{gym ? "Edit gym" : "Add a gym"}</h2>
          <button className="sheet-x" onClick={onClose}><Icon d={ICONS.x} size={18}/></button>
        </div>

        <div className="title-field">
          <label className="label">Name</label>
          <input className="title-input" value={name} onChange={e=>setName(e.target.value)}
            placeholder="e.g. Dallas home gym" autoFocus={!gym} />
        </div>

        <div className="field">
          <label className="label">Kind</label>
          <div className="pills" style={{marginTop:4}}>
            {GYM_KINDS.map(k =>
              <button key={k} className={"pill "+(kind===k?"on":"")} onClick={()=>setKind(k)}>
                {k.charAt(0).toUpperCase()+k.slice(1)}
              </button>)}
          </div>
        </div>

        <div className="field">
          <label className="label">Equipment available</label>
          <div className="hint" style={{marginTop:0,marginBottom:6}}>
            Used to flag exercises you can't do here.
          </div>
          <div className="pills" style={{marginTop:4}}>
            {EQUIPMENT.filter(e=>e!=="none").map(e =>
              <button key={e} className={"pill "+(equip.includes(e)?"on":"")} onClick={()=>toggleEquip(e)}>
                {e}
              </button>)}
          </div>
          {/* A short list cannot prove a thing is ABSENT - it might just be
              unfinished. Saying "that's everything" is better evidence than
              any count, and it is the only way a genuinely spartan hotel gym
              gets to flag what won't work there. */}
          <button className={"pill "+(confirmed?"on":"")} style={{marginTop:10}}
            onClick={()=>setConfirmed(c=>!c)}>
            {confirmed ? "That's everything here" : "Is this the full list?"}
          </button>
          {confirmed && equip.length < 6 &&
            <div className="hint" style={{marginTop:6,marginBottom:0}}>
              Short list, taken as complete - routines will flag anything that
              needs kit not ticked above.
            </div>}
        </div>

        <div className="field">
          <label className="label">Inventory (knowledge base)</label>
          <div className="hint" style={{marginTop:0,marginBottom:6}}>
            The detailed list - machines, dumbbell range, plates, attachments.
            Browsable here, and the AI reads it when designing workouts for
            this location. Paste freely; more detail = smarter suggestions.
          </div>
          <textarea className="textarea" style={{minHeight:140}} value={inventory}
            onChange={e=>setInventory(e.target.value)}
            placeholder={"e.g.\nDumbbells 5-75 lb\nSquat rack + 610 lb plates\nAssault bike, battle rope\nNo treadmill"} />
        </div>

        <button className="btn btn-primary btn-block" onClick={save} disabled={!name.trim()}>
          {gym ? "Save changes" : "Add gym"}
        </button>
        {gym &&
          <button className="btn btn-danger btn-block" style={{marginTop:10}}
            onClick={()=>{ if(confirm("Delete this gym? Logged workouts keep its name.")) onDelete(gym.id); }}>
            Delete gym
          </button>}
      </div>
    </>
  );
}

/* The Gyms TAB - places, MenuCaptain-style. List of gym cards; each opens
   a full place page with browsable equipment + inventory, that location's
   training stats, and "Start workout here". */
function GymsScreen({ store, onOpen, onAdd, onDelete }){
  const gyms = store.gyms || [];
  const workouts = store.data.workouts || [];
  if(!gyms.length){
    return (
      <div className="empty">
        <div className="glyph">@</div>
        <h3 className="title-sm">The places you train</h3>
        <p>Add your home gym, your clubs, even a generic hotel gym. Each keeps
        an equipment inventory the app uses to show what's possible where you
        are - and to design workouts for that location.</p>
        <button className="btn btn-primary" style={{marginTop:18}} onClick={onAdd}>
          <Icon d={ICONS.plus} size={16}/> Add a gym
        </button>
      </div>
    );
  }
  return (
    <div className="list">
      {gyms.map(g => {
        const here = workouts.filter(w => w.gymId===g.id && w.endedAt);
        const last = here.length ? here.reduce((a,b)=> (a.date>b.date?a:b)).date : null;
        return (
          <SwipeRow key={g.id} onDelete={()=>onDelete(g)}>
            <button className="item" onClick={()=>onOpen(g)}>
              <div className="item-body">
                <div className="item-title">{g.name}</div>
                <div className="item-meta">
                  <span className="chip amber">{g.kind}</span>
                  {here.length>0 && <span className="chip">{here.length} workout{here.length===1?"":"s"}</span>}

                  {g.inventory && <span className="chip green">inventory</span>}

              </div>
            </button>
          </SwipeRow>
        );
      })}
    </div>
  );
}

/* One gym as a full place page (nested layer): stats, training coverage
   computed against the user's OWN exercise library, and the inventory as a
   categorized catalog (AI-organized from the free text; raw text stays the
   source of truth). */
function GymDetail({ store, gymId, onEdit, onStartHere, onClose, notify }){
  const [organizing, setOrganizing] = useState(false);
  const [orgErr, setOrgErr] = useState("");
  const [scan, setScan] = useState(false);        // Gym Scan layer
  const [openCats, setOpenCats] = useState({});   // catalog sections start collapsed
  const toggleCat = (c) => setOpenCats(p=>({ ...p, [c]: !p[c] }));
  const gym = (store.gyms||[]).find(g=>g.id===gymId);
  if(!gym) return null;
  const here = (store.data.workouts||[]).filter(w => w.gymId===gym.id && w.endedAt);
  const last = here.length ? here.reduce((a,b)=> (a.date>b.date?a:b)).date : null;
  const invLines = (gym.inventory||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const hasTags = Array.isArray(gym.equipment) && gym.equipment.length>0;

  // Training coverage: which of MY exercises can I do here?
  const lib = store.data.exercises||[];
  const availCount = hasTags ? lib.filter(x=>availableAt(x, gym)).length : lib.length;
  const groups = hasTags ? MUSCLE_GROUPS.map(g => {
    const inGroup = lib.filter(x=>x.muscleGroup===g);
    return { g, total: inGroup.length, have: inGroup.filter(x=>availableAt(x, gym)).length };
  }).filter(x=>x.total>0) : [];

  const organize = async () => {
    if(!gym.inventory){ return; }
    setOrganizing(true); setOrgErr("");
    try{
      const system = 'You organize a gym equipment inventory into strict JSON. Return ONLY a JSON object, ' +
        'no prose and no markdown fences: {"catalog":[{"category":"...","items":[{"name":"...","detail":"..."}]}]}. ' +
        'category must be exactly one of: ' + CATALOG_CATEGORIES.map(c=>'"'+c+'"').join(", ") + '. ' +
        'name = a short item name (e.g. "Dumbbells", "Squat rack"); detail = that item\'s specifics from the ' +
        'text (ranges, counts, attachments), or "" if none. Include every item from the text exactly once, ' +
        'split multi-item lines, never invent equipment, omit empty categories.';
      const out = await aiRelay("organize_inventory",
        [{ role:"user", content: gym.inventory.slice(0, 8000) }],
        { system, maxTokens: 4000 });
      let obj;
      try{ obj = JSON.parse(stripFences(out)); }
      catch(e){ throw new Error("Couldn't organize that - try simplifying the inventory text."); }
      const catalog = (Array.isArray(obj && obj.catalog) ? obj.catalog : [])
        .filter(s => CATALOG_CATEGORIES.includes(s.category) && Array.isArray(s.items) && s.items.length)
        .map(s => ({ category: s.category,
                     items: s.items.map(it => ({ name: String(it.name||"").slice(0,60),
                                                 detail: String(it.detail||"").slice(0,200) }))
                                   .filter(it=>it.name) }))
        .sort((a,b)=>CATALOG_CATEGORIES.indexOf(a.category)-CATALOG_CATEGORIES.indexOf(b.category));
      if(!catalog.length) throw new Error("Nothing recognizable in the inventory text.");
      store.saveGyms((store.gyms||[]).map(g => g.id===gym.id ? { ...g, catalog, updatedAt: nowISO() } : g));
      log("GYM","catalog organized: "+catalog.length+" categories");
    }catch(e){ setOrgErr(e.message||"Organize failed."); log("ERROR","organize_inventory: "+e.message); }
    finally{ setOrganizing(false); }
  };

  const catalog = Array.isArray(gym.catalog) ? gym.catalog : null;

  return (
    <div className="layer">
      <div className="layer-inner">
        <div className="layer-top">
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2 style={{flex:1,minWidth:0}}>{gym.name}</h2>
          <button className="icon-btn" onClick={()=>onEdit(gym)} aria-label="Edit gym"><Icon d={ICONS.edit} size={18}/></button>
        </div>
        <div className="item-meta" style={{marginTop:2}}>
          <span className="chip amber">{gym.kind}</span>
          {here.length>0 && <span className="chip">{here.length} workout{here.length===1?"":"s"} here</span>}
          {last && <span className="chip">last {fmtDate(last)}</span>}
        </div>

        <button className="btn btn-primary btn-block" style={{marginTop:16}} onClick={()=>onStartHere(gym)}>
          <Icon d={ICONS.plus} size={16}/> Start workout here
        </button>

        {/* ONE section, not three. Equipment tags, the written inventory and
            the catalog were separate headings describing the same thing -
            what is in this room - and the scan that fills all of them was a
            small ghost button buried under the third one. Chris asked for the
            scan to be prominent and the page to read better; those are the
            same fix. */}
        <div className="set-group">What's here</div>

        {!hasTags && !invLines.length
          ? <div className="card" style={{borderColor:"var(--amber-line)",background:"var(--amber-dim)"}}>
              <div style={{fontWeight:700,color:"var(--amber-2)"}}>Nothing on file yet</div>
              <p className="hint" style={{marginTop:4}}>
                Until this gym knows what it has, it cannot tell you which of your
                exercises work here or offer a stand-in when one does not.
              </p>
              <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={()=>setScan(true)}>
                <Icon d={ICONS.play} size={15}/> Scan the equipment
              </button>
              <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}} onClick={()=>onEdit(gym)}>
                Or tick it by hand
              </button>
            </div>
          : <>
              <div className="card">
                {hasTags && lib.length>0 &&
                  <div className="subtle" style={{marginBottom:8}}>
                    {availCount} of {lib.length} exercises in your library work here.
                  </div>}
                {hasTags &&
                  <div className="pills" style={{marginTop:0}}>
                    {gym.equipment.map(e=><span key={e} className="pill on" style={{cursor:"default"}}>{e}</span>)}
                  </div>}
                {!hasTags &&
                  <p className="hint" style={{margin:0}}>
                    Inventory written down, but no equipment ticked - so availability
                    checks stay off. Scan again or tick them by hand.
                  </p>}
                <div className="row" style={{marginTop:12}}>
                  <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>setScan(true)}>
                    <Icon d={ICONS.play} size={14}/> Scan
                  </button>
                  <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>onEdit(gym)}>
                    Edit by hand
                  </button>
                </div>
              </div>

              {/* Per-muscle coverage is a second-order detail - useful, but not
                  what you open a gym page to find out. */}
              {hasTags && groups.length>0 &&
                <div className="pills" style={{marginTop:10}}>
                  {groups.map(x => (
                    <span key={x.g} className={"chip "+(x.have===x.total ? "green" : (x.have===0 ? "red" : "amber"))}>
                      {x.g} {x.have}/{x.total}
                    </span>
                  ))}
                </div>}
            </>}

        {orgErr && <div className="auth-msg err">{orgErr}</div>}
        {(catalog || invLines.length>0) && <div className="set-group">The detail</div>}
        {catalog
          ? <>
              {catalog.map(sec => (
                <div key={sec.category}>
                  <button className={"cat-head "+(openCats[sec.category]?"open":"")} onClick={()=>toggleCat(sec.category)}>
                    <span>{sec.category}</span>
                    <span className="chip">{sec.items.length}</span>
                    <span className="chev"><Icon d={ICONS.chev} size={16}/></span>
                  </button>
                  {openCats[sec.category] &&
                    <div className="card" style={{paddingTop:6,paddingBottom:6}}>
                      {sec.items.map((it,i)=>(
                        <div key={i} className="set-row" style={{cursor:"default",display:"block"}}>
                          <div style={{fontWeight:600,fontSize:14.5}}>{it.name}</div>
                          {it.detail && <div className="hint" style={{marginTop:1}}>{it.detail}</div>}
                        </div>
                      ))}
                    </div>}
                </div>
              ))}
              <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:12}} disabled={organizing} onClick={organize}>
                {organizing ? <span className="spin"></span> : "Re-organize from the inventory text"}
              </button>
            </>
          : invLines.length
            ? <>
                <div className="card">
                  {invLines.map((line,i)=>(
                    <div key={i} className="set-row" style={{cursor:"default"}}>
                      <span className="set-main" style={{fontWeight:500}}>{line}</span>
                    </div>
                  ))}
                </div>
                <button className="btn btn-primary btn-block" style={{marginTop:12}} disabled={organizing} onClick={organize}>
                  {organizing ? <span className="spin"></span> : "Organize with AI"}
                </button>
                <p className="hint center" style={{marginTop:8}}>
                  Sorts the text into categories - free weights, machines, cardio - for easy browsing.
                </p>
              </>
            : null /* The "What's here" card above already says this, and says
                      it better - two empty states on one screen just made the
                      page look broken twice. */}
      </div>

      {scan &&
        <GymScanLayer store={store} gym={gym} onClose={()=>setScan(false)}
          onSaved={(n)=>{ setScan(false);
            if(notify) notify("Added "+n+" item"+(n===1?"":"s")+" to "+gym.name); }} />}
    </div>
  );
}

/* GYM SCAN - photos + receipts/order screenshots -> vision AI -> reviewed
   items merge into the gym's inventory. Review-before-save is the load-
   bearing step: vision miscounts (the Dallas double-kettlebell) get fixed
   here. Photos are canvas-downscaled to ~1024px JPEG on-device, which also
   strips EXIF/GPS before anything is uploaded. z-bumped over GymDetail. */
const SCAN_MAX_IMAGES = 8;
function GymScanLayer({ store, gym, onClose, onSaved }){
  const [phase, setPhase] = useState("pick");    // pick | busy | review
  const [imgs, setImgs] = useState([]);          // [{b64, thumb}]
  const [err, setErr] = useState("");
  const [items, setItems] = useState([]);
  const [tags, setTags] = useState([]);
  const fileRef = useRef(null);
  const camRef  = useRef(null);
  const vidRef  = useRef(null);
  const [vidBusy, setVidBusy] = useState(false);

  const downscale = (file) => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const MAX = 1024;
        const scale = Math.min(1, MAX/Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width*scale));
        cv.height = Math.max(1, Math.round(img.height*scale));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        const dataUrl = cv.toDataURL("image/jpeg", 0.85);
        URL.revokeObjectURL(url);
        resolve({ b64: dataUrl.split(",")[1], thumb: dataUrl });
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that image.")); };
    img.src = url;
  });

  /* VIDEO WALKTHROUGH. Chris: "should be able to video scan or upload
     photos." Walking a gym filming as you go is a far better capture than
     framing eight stills - you sweep the room once and everything is in it.

     The relay only accepts IMAGES though (VISION_TASKS, jpeg/png/webp), so
     the video never leaves the phone: we pull evenly-spaced frames out of it
     locally and feed those through the SAME downscale path the photo picker
     uses. No backend change, no upload of a large file, and the review screen
     cannot tell the difference. */
  const framesFromVideo = (file, want) => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true; v.playsInline = true;
    let done = false;
    const cleanup = () => { try{ URL.revokeObjectURL(url); }catch(e){} };
    const fail = (msg) => { if(done) return; done = true; cleanup(); reject(new Error(msg)); };
    const ok = (frames) => { if(done) return; done = true; cleanup(); resolve(frames); };
    /* A video the browser cannot decode never fires loadedmetadata OR error -
       it simply sits there. Without this the button spun forever with no
       message, which is worse than failing: nothing tells you to try again
       with a different clip. Found by feeding it a malformed webm.

       Sized off measurement, not instinct: a 22s / 38MB phone clip took ~14s
       almost entirely in loading the file, while the frame grabbing itself was
       0.1s. A minute-long walk round is ~100MB, so 20s would have failed
       honest clips. This is the unreadable-file catch, not a speed limit. */
    setTimeout(() => fail("That video took too long to read - try a shorter clip."), 60000);
    v.onerror = () => fail("Couldn't read that video.");
    v.onloadedmetadata = async () => {
      try{
        /* Some recorders write no duration index, so the file claims 0.001s
           or Infinity and all eight seek targets collapse onto the same
           instant - you get eight copies of frame one. Seeking far past the
           end makes the browser scan for the real end and fire durationchange. */
        let dur = Number(v.duration);
        if(!isFinite(dur) || dur < 0.2){
          dur = await new Promise((settle) => {
            const onDur = () => {
              if(isFinite(v.duration) && v.duration > 0.2){
                v.removeEventListener("durationchange", onDur);
                settle(Number(v.duration));
              }
            };
            v.addEventListener("durationchange", onDur);
            try{ v.currentTime = 1e101; }catch(e){}
            setTimeout(() => { v.removeEventListener("durationchange", onDur); settle(Number(v.duration)); }, 4000);
          });
          try{ v.currentTime = 0; }catch(e){}
        }
        if(!isFinite(dur) || dur <= 0) throw new Error("That clip has no readable duration - try recording it again.");
        // Evenly spaced, skipping the very start and end - the first and last
        // frames of a hand-held clip are usually a blur or a pocket.
        const times = [];
        for(let i=0;i<want;i++) times.push(dur * (i+0.5) / want);
        const MAX = 1024;
        const scale = Math.min(1, MAX/Math.max(v.videoWidth||1, v.videoHeight||1));
        const cv = document.createElement("canvas");
        cv.width  = Math.max(1, Math.round((v.videoWidth||1)*scale));
        cv.height = Math.max(1, Math.round((v.videoHeight||1)*scale));
        const ctx = cv.getContext("2d");
        const out = [];
        /* Wait for "seeked", NOT requestVideoFrameCallback. rVFC only fires
           when the page is actually compositing, so the moment the app is not
           the foreground tab every seek stalls until its guard expires and the
           whole scan dies on the overall timeout. Measured on a real 22s
           1080x1920 phone clip: seeked returned all 8 frames, all distinct, in
           0.1s total; rVFC returned nothing in 20s. */
        const awaitFrame = () => new Promise((done) => {
          let settled = false;
          const finish = () => { if(!settled){ settled = true; done(); } };
          const onSeeked = () => { v.removeEventListener("seeked", onSeeked);
                                   setTimeout(finish, 60); };
          v.addEventListener("seeked", onSeeked);
          setTimeout(finish, 6000);                   // never hang on a bad clip
        });
        for(const t of times){
          const target = Math.min(t, Math.max(0, dur - 0.05));
          const waiter = awaitFrame();
          try{ v.currentTime = target; }catch(e){}
          await waiter;
          ctx.drawImage(v, 0, 0, cv.width, cv.height);
          const dataUrl = cv.toDataURL("image/jpeg", 0.85);
          out.push({ b64: dataUrl.split(",")[1], thumb: dataUrl });
        }
        ok(out);
      }catch(e){ fail(e.message || "Couldn't read that video."); }
    };
    v.src = url;
  });

  const addVideo = async (file) => {
    setErr(""); setVidBusy(true);
    try{
      const room = SCAN_MAX_IMAGES - imgs.length;
      if(room <= 0){ setErr("Already at "+SCAN_MAX_IMAGES+" shots - remove some first."); return; }
      const frames = await framesFromVideo(file, room);
      if(!frames.length) throw new Error("No frames came out of that video.");
      setImgs(p => [...p, ...frames]);
      log("SCAN","video -> "+frames.length+" frames");
    }catch(e){ setErr(e.message||"Couldn't read that video."); log("ERROR","scan video: "+e.message); }
    finally{ setVidBusy(false); }
  };

  const addFiles = async (fileList) => {
    setErr("");
    const files = Array.from(fileList||[]).filter(f=>/^image\//.test(f.type||""));
    if(!files.length) return;
    const room = SCAN_MAX_IMAGES - imgs.length;
    if(files.length > room) setErr("Max "+SCAN_MAX_IMAGES+" photos per scan - extras were dropped.");
    const added = [];
    for(const f of files.slice(0, Math.max(0, room))){
      try{ added.push(await downscale(f)); }
      catch(e){ log("ERROR","scan downscale: "+e.message); }
    }
    if(added.length) setImgs(p=>[...p, ...added]);
  };

  const analyze = async () => {
    if(!imgs.length){ setErr("Add at least one photo."); return; }
    setErr(""); setPhase("busy");
    try{
      const system = 'You inventory gym equipment from photos. Return ONLY strict JSON, no prose and no ' +
        'markdown fences: {"items":[{"name":"...","detail":"...","count":N,"confidence":"high|low"}],' +
        '"tags":["..."]}. Rules: physical exercise equipment only - ignore people, rooms, decor and ' +
        'clutter. The same item often appears in several photos: count DISTINCT physical items ' +
        'conservatively; when unsure use count 1 and confidence "low". Receipts and order screenshots ' +
        'are authoritative for exact model names - prefer them over guesses from photos. name = short ' +

  const loose = routines.filter(r => {
    const inAny = (store.programs||[]).some(pr => (pr.routineIds||[]).indexOf(r.id) !== -1);
    return !inAny;
  });
  return (
    <div className="list">
      {/* Named sections, because "is it obvious programs are in here" had the
          answer no. A program is an ordered set of days you follow; a routine
          is a single session you start whenever. */}
      {(store.programs||[]).length > 0 && <div className="set-group">Programs</div>}
      <ProgramCard store={store} undoable={undoable} />
      {/* Days that belong to a program are listed inside its card, so
          repeating them here made the tab look like twenty unrelated
          routines. Only unattached ones show below. */}
      {loose.length > 0 && <div className="set-group">Routines</div>}
      {loose.map(r => (
        <SwipeRow key={r.id} onDelete={()=>onDelete(r)}>
          <div className="item" style={{alignItems:"center"}}>
            <button style={{flex:1,minWidth:0,textAlign:"left",display:"block"}} onClick={()=>onOpen(r)}>
              <div className="item-title">{r.name}</div>
              <div className="item-meta">
                <span className="chip amber">{(r.items||[]).length} exercise{(r.items||[]).length===1?"":"s"}</span>
                {r.gymName && <span className="chip blue">{r.gymName}</span>}
              </div>
            </button>
            {/* Six routines meant six orange buttons in a column, all
                shouting equally - and the program card above already says
                which one is next. These are available, not recommended. */}
            <button className="btn btn-ghost btn-sm"
              style={{flex:"0 0 auto",color:"var(--amber-2)",borderColor:"var(--amber-line)"}}
              onClick={(e)=>{ e.stopPropagation(); onStart(r); }}>
              {activeW && activeW.routineId===r.id ? "Resume" : "Start"}
            </button>
          </div>
        </SwipeRow>
      ))}
      {/* Anchored: these sink out of reach at the foot of a growing list,
          which is exactly when you want another program. */}
      <div className="stick-actions">
        <div className="row">
          <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={onBuild}>
            Build me a program
          </button>
          <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={onImport}>
            Import a program
          </button>
        </div>
      </div>
    </div>
  );
}

/* Two ways to get a program into the app, one shared review-before-save:
   mode "paste" - convert a pasted program into routines (import_routines).
   mode "build" - the AI PROGRAM BUILDER: minutes/day + days/week + goals +
   gym (its inventory becomes a hard equipment constraint) -> a designed
   week (routine_suggest) -> the same review screen. */
function ImportRoutinesLayer({ store, mode, onClose, onImported }){
  const build = mode === "build";
  const units = store.cfg.units || "lb";
  const [phase, setPhase] = useState(build ? "intake" : "paste");   // intake | paste | busy | review
  const [text, setText] = useState("");
  const [err, setErr] = useState("");
  const [parsed, setParsed] = useState([]);
  const [skipped, setSkipped] = useState([]);
  // intake answers (Chris's spec: ask minutes/day and days/week first)
  // Asked once, then remembered - a fact about him, not about this program.
  const [bAge, setBAge] = useState(store.cfg.age ? String(store.cfg.age) : "");
  const [bMins, setBMins] = useState(30);
  const [bDays, setBDays] = useState(5);
  const [bGymId, setBGymId] = useState(store.cfg.lastGymId || null);
  const [goals, setGoals] = useState("");
  // Multi-day results become a program (ordered + "what's next") by default.
  const [asProgram, setAsProgram] = useState(true);
  const [progLabel, setProgLabel] = useState("");

  // Shared: model output -> review rows. forcedGym pins every routine to one
  // gym (builder); undefined means "trust the per-routine gym name" (paste).
  const toReview = async (out, forcedGym) => {
    const mediaIdx = await loadMediaIndex();
    let obj;
    try{ obj = JSON.parse(stripFences(out)); }
    catch(e){ throw new Error(build ? "Couldn't read the result - try again." : "Couldn't read the result. Try a smaller chunk."); }
    const rs = Array.isArray(obj && obj.routines) ? obj.routines : [];
    if(!rs.length) throw new Error(build ? "No program came back - try again." : "No routines found in that text.");
    const lib = {}; (store.data.exercises||[]).forEach(x=>{ lib[normName(x.name)] = x; });
    const review = rs.map(r => {
      // Same loose matching as the history importer - fixing one and leaving
      // the other on exact-match meant a pasted "Gym: Dallas Home Gym" landed
      // on a workout but not on a routine.
      const gym = forcedGym !== undefined ? forcedGym : matchGym(store.gyms||[], r.gym);
      return {
        include: true,
        name: (r.name||"Routine").slice(0,60),
        gymId: gym ? gym.id : null, gymName: gym ? gym.name : null,
        items: (Array.isArray(r.items)?r.items:[]).map(it => ({
          type: EXERCISE_TYPES.includes(it.type) ? it.type : "strength",
          group: MUSCLE_GROUPS.includes(it.group) ? it.group : "Full body",
          equip: EQUIPMENT.includes(it.equipment) ? it.equipment : "none",
          plan: (Array.isArray(it.sets) && it.sets.length > 1)
            ? it.sets.slice(0, MAX_PLAN_SETS).map(s => ({
                reps: Math.max(0, Math.min(999, Math.round(Number(s.reps)||0))),
                weight: Math.max(0, Math.min(2000, Math.round((Number(s.weight)||0)*100)/100)),
              })).filter(s=>s.reps>0)
            : undefined,
          targetSets: Math.max(0, Math.min(10, Math.round(Number(it.targetSets)||0))),
          targetReps: Math.max(0, Math.min(100, Math.round(Number(it.targetReps)||0))),
          ...nameSuggestion(mediaIdx, lib, String(it.exercise||"Exercise").slice(0,60)),
        })).filter(it=>it.name),
      };
    }).filter(r => r.items.length);
    if(!review.length) throw new Error("Nothing usable was parsed.");
    setParsed(review);
    setSkipped(Array.isArray(obj.skipped) ? obj.skipped.slice(0,20) : []);
    setPhase("review");
  };

  const organize = async () => {
    const t = text.trim();
    if(t.length < 10){ setErr("Paste a program first."); return; }
    setErr(""); setPhase("busy");
    try{
      const names = (store.data.exercises||[]).map(x=>x.name);
      const gymNames = (store.gyms||[]).map(g=>g.name);
      const system = "You convert a pasted training program into strict JSON. Return ONLY a JSON " +
        "object, no prose and no markdown fences: " +
        '{"routines":[{"name":"...","gym":"gym name or null","items":[{"exercise":"name",' +
        '"type":"strength|cardio|mobility","group":"muscle group","equipment":"what it is performed on",' +
        '"targetSets":N,"targetReps":N,"sets":[{"reps":N,"weight":N}] (only when sets differ)}]}],' +
        '"skipped":["lines you could not interpret"]}. ' +
        "group must be exactly one of: " + MUSCLE_GROUPS.join(", ") + " - the PRIMARY mover " +
        '(use "Full body" only for genuine whole-body movements like swings and carries). ' +
        "equipment must be exactly one of: " + EQUIPMENT.join(", ") + ' - gym stations are "machine", ' +
        'cable stacks "cable", free weights get their implement. ' +
        "Rules: one routine per named day/section, keep the section's name. " +
        "When an exercise clearly matches one of the user's library names use the library name EXACTLY: " +
        names.join(", ") + ". Otherwise use a clean title-case name. " +
        "type: lifts and carries = strength; running/bike/row intervals = cardio; stretches, holds and " +
        "mobility drills = mobility. targetSets/targetReps: for strength use the text's sets and reps " +
        'When the text prescribes DIFFERENT numbers per set ("25x20, 30x16, 35x12"), also return ' +
        '"sets":[{"reps":N,"weight":N}] in that order, max ' + MAX_PLAN_SETS + ', weight in the ' +
        "user's units and 0 when bodyweight; omit \"sets\" entirely when every set is the same. " +
        "(per-side counts stay as written; default 3 and 10 if unstated). MOBILITY keeps whatever " +
        "sets and reps the text gives it - a drill written '1x8' is an instruction, not a suggestion - " +
        "and only uses 0 and 0 when the text states no count at all. Cardio always uses 0 and 0 " +
        "because its duration rides in the name. " +
        "Supersets become separate consecutive items. " +
        (gymNames.length ? 'gym: one of "'+gymNames.join('", "')+'" when the text names it, else null. ' : "gym: always null. ") +
        "Never invent routines or exercises not in the text.";
      const out = await aiRelay("import_routines",
        [{ role:"user", content: t.slice(0, 20000) }],
        { system, maxTokens: 8000 });
      await toReview(out, undefined);
      log("IMPORT","parsed routines from paste");
    }catch(e){
      setErr(e.message||"Import failed."); setPhase("paste");
      log("ERROR","import_routines: "+e.message);
    }
  };

  const buildProgram = async () => {
    if(goals.trim().length < 3){ setErr("Say what you're training for - a few words is plenty."); return; }
    setErr(""); setPhase("busy");
    try{
      const gym = (store.gyms||[]).find(g => g.id === bGymId) || null;
      const names = (store.data.exercises||[]).map(x=>x.name);
      let coaching = "";
      // Time honesty: ~3 min per strength set incl. rest, minus warm-up/down.
      const setBudget = Math.max(6, Math.round((bMins-8)/3));
      const gymCtx = gym
        ? ((gym.equipment||[]).join(", ") +
           (gym.inventory ? ". Inventory: " + String(gym.inventory).replace(/\s+/g," ").slice(0,1500) : ""))
        : null;
      const system = "You are a careful strength and conditioning coach designing a weekly training " +
        "program. Return ONLY strict JSON, no prose and no markdown fences: " +
        '{"routines":[{"name":"...","items":[{"exercise":"name",' +
        '"type":"strength|cardio|mobility","group":"muscle group","targetSets":N,"targetReps":N}]}],"skipped":[]}. ' +
        "group must be exactly one of: " + MUSCLE_GROUPS.join(", ") + " - the PRIMARY mover. " +
        "Rules: EXACTLY " + bDays + " routines, one per training day, each named 'P<n> - <focus>' " +
        "(e.g. 'P1 - Lower Strength'). Every day must genuinely fit in " + bMins + " minutes including " +
        "a short warm-up: budget about 3 minutes per strength set with rest, so keep each day to roughly " +
        setBudget + " total strength sets plus at most 2-3 mobility or cardio items. " +
        "Spread the goals across the week; strength days get heavy compound anchors, power work comes " +
        "before fatigue, and mobility appears where it serves the goals. " +
        (gymCtx
          ? "Equipment available - prescribe ONLY movements this equipment supports: " + gymCtx + ". "
          : "Assume a minimal travel setup: bodyweight, dumbbells, a bench, and one cardio machine. ") +
        "When a movement matches one of the user's library names use it EXACTLY: " + names.join(", ") + ". " +
        "Otherwise use a clean title-case name. type: lifts and carries = strength; intervals or steady " +
        "cardio = cardio; stretches, holds and drills = mobility. targetSets/targetReps: strength gets " +
        "real numbers; cardio and mobility use 0 and 0 and carry their duration in the name " +
        "(e.g. 'AssaultBike Intervals - 12 min').";
      /* Age and an active deficit change what a good week looks like, and the
         builder was designing as if for a 30-year-old eating at maintenance.
         The deficit is DERIVED from his own weigh-ins rather than asked -
         weightTrend() already knows, and a number he is living is better
         evidence than a checkbox.

         The guidance below is about TRAINING only. Nothing here prescribes
         calories, protein or anything dose-related - same line every other AI
         surface in this app holds. */
      const age = Number(bAge) > 0 ? Number(bAge) : null;
      const trend = weightTrend(store);
      const ctx = [];
      if(age) ctx.push("Age " + age + ".");
      if(trend && trend.losing){
        ctx.push("Currently losing weight at about " + trend.pctPerWeek + "% of bodyweight per week" +
                 (trend.tooFast ? " - above their own " + trend.guardPct + "%/week guard" : "") + ".");
      }
      coaching = ((age && age >= 50) || (trend && trend.losing))
        ? " COACHING CONTEXT - adjust the design, do not comment on it in the output: " +
          ((age && age >= 50)
            ? "Over 50: keep the heavy compound anchors, they are what defend bone density and lean " +
              "mass, but favour joint-friendly variants (trap bar over straight bar, neutral grips, " +
              "controlled tempo), allow a longer warm-up inside the time budget, and leave at least " +
              "one day between sessions that load the same pattern hard. " : "") +
          ((trend && trend.losing)
            ? "Training in a calorie deficit: recovery is reduced, so hold INTENSITY (load) and trim " +
              "VOLUME rather than the reverse - dropping load in a deficit is what costs muscle. Keep " +
              "weekly sets per muscle group at the LOW end of the useful range rather than the high " +
              "end, and avoid high-eccentric novelty that produces soreness without adding stimulus. " : "") +
          "Do NOT give calorie, protein, macro or medication advice anywhere in the output. "
        : "";
      const user = "Goals: " + goals.trim().slice(0,1200) + "\n" +
        (ctx.length ? "Athlete: " + ctx.join(" ") + "\n" : "") +
        "Time: " + bMins + " minutes per day, " + bDays + " days per week." +
        (gym ? "\nTraining at: " + gym.name + "." : "\nNo fixed gym - traveling.");
      const out = await aiRelay("routine_suggest",
        [{ role:"user", content: user }],
        { system: system + coaching, maxTokens: 8000 });
      await toReview(out, gym);
      if(age && age !== store.cfg.age) store.saveCfg({ ...store.cfg, age });
      log("BUILD","program built ("+bDays+"d x "+bMins+"min"+(age?", age "+age:"")+")");
    }catch(e){
      setErr(e.message||"Couldn't build the program."); setPhase("intake");
      log("ERROR","routine_suggest: "+e.message);
    }
  };

  const toggle = (i) => setParsed(p => p.map((r,j)=> j===i ? {...r, include:!r.include} : r));
  const toggleSuggest = (i, j) => setParsed(p => p.map((r,ri)=> ri!==i ? r
    : { ...r, items: r.items.map((it,ii)=> ii!==j ? it : { ...it, useSuggest: !it.useSuggest }) }));
  const libHas = (n) => (store.data.exercises||[]).some(x => normName(x.name) === normName(n));

  const importAll = () => {
    const inc = parsed.filter(r=>r.include);
    if(!inc.length){ setErr("Everything is set to skip."); return; }
    const lib = {}; (store.data.exercises||[]).forEach(x=>{ lib[normName(x.name)] = x; });
    const created = [];
    inc.forEach(r => r.items.forEach(it => {
      const key = normName(chosenName(it));
      if(!lib[key]){
        const x = { id: uid(), name: chosenName(it), type: it.type, muscleGroup: it.group || "Full body",
                    equipment: it.equip || "none", notes: "", custom: true,
                    createdAt: nowISO(), updatedAt: nowISO() };
        lib[key] = x; created.push(x);
      }
    }));
    if(created.length) store.saveCollection("exercises", [...created, ...(store.data.exercises||[])]);
    const routines = inc.map(r => ({
      id: uid(), name: r.name, gymId: r.gymId, gymName: r.gymName,
      items: r.items.map(it => ({
        id: uid(), exerciseId: lib[normName(chosenName(it))].id, name: lib[normName(chosenName(it))].name,
        type: it.type,
        // Mobility keeps whatever dose was written; only cardio is dose-free.
        targetSets: it.type==="cardio" ? 0 : (it.targetSets || (it.type==="strength" ? 3 : 0)),
        targetReps: it.type==="cardio" ? 0 : (it.targetReps || (it.type==="strength" ? 10 : 0)),
        plan: (it.type!=="cardio" && planOf(it)) || undefined,
      })),
      createdAt: nowISO(), updatedAt: nowISO(),
    }));
    store.saveCollection("routines", [...routines, ...(store.data.routines||[])]);
    // A multi-day paste IS a program - capture the order now, while we still
    // know it, instead of leaving the user with loose routines to sequence.
    let progName = null;
    if(asProgram && routines.length > 1){
      const p = { id: uid(), name: (progLabel.trim() || "My program").slice(0,60),
                  routineIds: routines.map(r=>r.id), cursor: 0,
                  createdAt: nowISO(), updatedAt: nowISO() };
      store.savePrograms([p, ...(store.programs||[])]);
      store.saveCfg({ ...store.cfg, activeProgramId: p.id });
      progName = p.name;
      log("IMPORT","program created: "+p.name+" ("+p.routineIds.length+" days)");
    }
    log("IMPORT","imported "+routines.length+" routines, "+created.length+" new exercises");
    onImported(routines.length, created.length, progName);
  };

  return (
    <div className="layer">
      <div className="layer-inner">
        <div className="layer-top">
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          {/* Title matches the button that opened it - the screen used to say
              "Import routines" while every way in said "Import a program". */}
          <h2>{build ? "Build a program" : "Import a program"}</h2>
        </div>

        {phase==="intake" && <>
          <p className="hint" style={{marginTop:4}}>
            A few questions. The AI designs a week that actually fits your time,
            your equipment and where you are right now - and you review every day
            before anything saves.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          <label className="label" style={{marginTop:14}}>Your age</label>
          <div className="hint" style={{marginTop:0,marginBottom:6}}>
            Optional, asked once. Past fifty the same goals want joint-friendlier
            variants and more room between hard sessions.
          </div>
          <input className="input" inputMode="numeric" value={bAge} maxLength={3}
            onChange={e=>setBAge(e.target.value.replace(/[^0-9]/g,""))} placeholder="optional" />

          <label className="label" style={{marginTop:14}}>Minutes per day</label>
          <div className="pills">
            {[20,30,45,60].map(m => (
              <button key={m} className={"pill "+(bMins===m?"on":"")} onClick={()=>setBMins(m)}>{m}</button>
            ))}
          </div>
          <label className="label" style={{marginTop:14}}>Days per week</label>
          <div className="pills">
            {[2,3,4,5,6].map(d => (
              <button key={d} className={"pill "+(bDays===d?"on":"")} onClick={()=>setBDays(d)}>{d}</button>
            ))}
          </div>
          <label className="label" style={{marginTop:14}}>Where you'll train</label>
          <div className="pills">
            {(store.gyms||[]).map(g => (
              <button key={g.id} className={"pill "+(bGymId===g.id?"on":"")} onClick={()=>setBGymId(g.id)}>{g.name}</button>
            ))}
            <button className={"pill "+(!bGymId?"on":"")} onClick={()=>setBGymId(null)}>No gym / travel</button>
          </div>
          <label className="label" style={{marginTop:14}}>What are you training for?</label>
          <textarea className="textarea" style={{minHeight:110}} value={goals}
            onChange={e=>setGoals(e.target.value)}
            placeholder="e.g. mobility, power for my golf swing, strong bones, keep muscle as I age - plus arms, chest and abs" />
          <button className="btn btn-primary btn-block" style={{marginTop:14}} onClick={buildProgram}>
            Build my program
          </button>
        </>}

        {phase==="paste" && <>
          <p className="hint" style={{marginTop:4}}>
            Paste a whole program - day names, exercises, sets x reps. The AI
            turns each day into a routine; you review before anything saves.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          <textarea className="textarea" style={{minHeight:220,marginTop:12}} value={text}
            onChange={e=>setText(e.target.value)}
            placeholder={"e.g.\nDay 1 - Lower\nTrap Bar Deadlift 4x6\nGoblet Squat 3x10\n\nDay 2 - Push\nBench Press 4x8 ..."} />
          <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={organize}>
            Organize with AI
          </button>
        </>}

        {phase==="busy" &&
          <div className="empty" style={{padding:"60px 20px"}}>
            <span className="spin spin-lg" style={{margin:"0 auto 16px",display:"block"}}></span>
            <p>{build ? "Designing your week..." : "Reading the program..."}</p>
          </div>}

        {phase==="review" && <>
          <p className="hint" style={{marginTop:4}}>
            Review before saving. Exercises marked "new" will be added to your library.
          </p>
          {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}
          {parsed.map((r,i) => (
            <div key={i} className="entry" style={{opacity: r.include?1:.45}}>
              <div className="entry-head">
                <div style={{flex:1,minWidth:0}}>
                  <div className="entry-name">{r.name}</div>
                  {r.gymName && <div className="entry-last">{r.gymName}</div>}
                </div>
                <button className={"pill "+(r.include?"on":"")} style={{flex:"0 0 auto"}} onClick={()=>toggle(i)}>
                  {r.include ? "Included" : "Skipped"}
                </button>
              </div>
              {r.items.map((it,j) => (
                <div key={j} className="set-row" style={{cursor:"default",display:"block"}}>
                  <div className="row" style={{gap:8}}>
                    <span className="set-main" style={{fontWeight:500}}>
                      {chosenName(it)}
                      {planOf(it)
                        ? " - "+planLine(planOf(it), units)
                        : (it.type==="strength" && it.targetSets>0 ? " - "+it.targetSets+" x "+it.targetReps : "")}
                      {it.type!=="strength" && !planOf(it) && " - "+it.type}
                    </span>
                    {!libHas(chosenName(it)) && <span className="chip violet" style={{flex:"0 0 auto"}}>new</span>}
                  </div>
                  {it.suggestName &&
                    <button className="pill" style={{marginTop:6}} onClick={()=>toggleSuggest(i,j)}>
                      {it.useSuggest
                        ? "standard name - tap to keep \""+it.name+"\""
                        : "use standard name \""+it.suggestName+"\"?"}
                    </button>}
                </div>
              ))}
            </div>
          ))}
          {skipped.length>0 &&
            <div className="card" style={{marginTop:12}}>
              <div className="subtle" style={{marginBottom:6}}>Couldn't interpret:</div>
              {skipped.map((s,i)=><div key={i} className="hint">{String(s).slice(0,120)}</div>)}
            </div>}
          {parsed.filter(r=>r.include).length > 1 &&
            <div className="card" style={{marginTop:12}}>
              {/* Two pills, not one that flips. A lone pill reading "Yes" is
                  indistinguishable from a button that MEANS yes - Chris
                  pressed it to confirm and turned the program off. */}
              <div style={{fontWeight:600,marginBottom:8}}>Run these as a program</div>
              <div className="pills" style={{marginTop:0}}>
                <button className={"pill "+(asProgram?"on":"")} onClick={()=>setAsProgram(true)}>Yes</button>
                <button className={"pill "+(!asProgram?"on":"")} onClick={()=>setAsProgram(false)}>No</button>
              </div>
              {asProgram && <>
                <input className="input" style={{marginTop:10}} value={progLabel}
                  onChange={e=>setProgLabel(e.target.value)} placeholder="Name it (e.g. Golf Power 30)" />
                <p className="hint" style={{marginTop:8,marginBottom:0}}>
                  Keeps them in this order and shows what's next on your home screen.
                  Finish a day and it advances on its own.
                </p>
              </>}
            </div>}
          {/* Name the thing being created. Saying "Import 5 routines" while
              the user is plainly setting up a program reads like a different
              action - it made Chris stop and ask whether it was the right
              button. */}
          <button className="btn btn-primary btn-block" style={{marginTop:14}} onClick={importAll}>
            {(() => {
              const n = parsed.filter(r=>r.include).length;
              if(asProgram && n > 1)
                return "Start " + (progLabel.trim() || "this program") + " - " + n + " days";
              return (build ? "Save " : "Import ") + n + " routine" + (n===1?"":"s");
            })()}
          </button>
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>{ setPhase(build ? "intake" : "paste"); setErr(""); }}>
            {build ? "Change the answers" : "Back to paste"}
          </button>
        </>}
      </div>
    </div>
  );
}

/* Full-screen routine editor (same layer pattern as the workout editor). */
function RoutineEditor({ store, routineId, onClose, onDelete, onStart }){
  const routine = (store.data.routines||[]).find(r=>r.id===routineId);
  const [picker, setPicker] = useState(false);
  const [help, setHelp] = useState(null);          // {name, exerciseId} for the Show me panel
  if(!routine) return null;
  const units = store.cfg.units || "lb";
  const gym = (store.gyms||[]).find(g=>g.id===routine.gymId) || null;

  const patch = (p) => store.saveCollection("routines",
    (store.data.routines||[]).map(r => r.id===routine.id ? { ...r, ...p, updatedAt: nowISO() } : r));
  const patchItem = (id, p) => patch({ items: (routine.items||[]).map(it => it.id===id ? { ...it, ...p } : it) });
  const removeItem = (id) => patch({ items: (routine.items||[]).filter(it => it.id!==id) });
  const addExercise = (x) => {
    patch({ items: [...(routine.items||[]), {
      id: uid(), exerciseId: x.id, name: x.name, type: x.type,
      targetSets: 3, targetReps: 10,
    }]});
    setPicker(false);
  };
  const createAndAdd = (name) => {
    const x = { id: uid(), name, type:"strength", muscleGroup:"Full body", equipment:"none",
                notes:"", custom:true, createdAt: nowISO(), updatedAt: nowISO() };
    store.saveCollection("exercises", [x, ...(store.data.exercises||[])]);
    addExercise(x);
  };
  const setGym = (g) => patch({ gymId: g ? g.id : null, gymName: g ? g.name : null });
  const bump = (it, field, delta, min, max) => patchItem(it.id, { [field]: Math.max(min, Math.min(max, (Number(it[field])||0) + delta)) });

  // ---- per-set plans ----
  // Switching on seeds the plan from the uniform target, so you start from
  // what the exercise already said rather than from nothing.
  const enablePlan = (it) => {
    const n = Math.max(1, Math.min(MAX_PLAN_SETS, Number(it.targetSets)||3));
    const reps = Math.max(1, Number(it.targetReps)||10);
    const last = lastPerfWeight(it.exerciseId);
    patchItem(it.id, { plan: Array.from({length:n}, () => ({ reps, weight: last })) });
  };
  const clearPlan = (it) => patchItem(it.id, { plan: undefined });
  const bumpPlan = (it, idx, field, delta, min, max) => {
    const p = (planOf(it)||[]).map((s,i) => i!==idx ? s
      : { ...s, [field]: Math.max(min, Math.min(max, Math.round(((Number(s[field])||0)+delta)*100)/100)) });
    patchItem(it.id, { plan: p });
  };
  const addPlanSet = (it) => {
    const p = planOf(it) || [];
    if(p.length >= MAX_PLAN_SETS) return;
    patchItem(it.id, { plan: [...p, { ...(p[p.length-1] || { reps:10, weight:0 }) }] });
  };
  const removePlanSet = (it, idx) => {
    const p = (planOf(it)||[]).filter((_,i)=>i!==idx);
    patchItem(it.id, p.length ? { plan: p } : { plan: undefined });
  };
  // Seed a new plan's weight from whatever was last actually lifted, so the
  // first thing you see is a real number rather than zero.
  function lastPerfWeight(exerciseId){
    const ws = (store.data.workouts||[]).slice()
      .sort((a,b)=>String(b.startedAt||"").localeCompare(String(a.startedAt||"")));
    for(const w of ws){
      const e = (w.entries||[]).find(x=>x.exerciseId===exerciseId && (x.sets||[]).length);
      if(e){ const t = topSet(e.sets); if(t) return Number(t.weight)||0; }
    }
    return 0;
  }

  const sBtn = { width:34, height:34, borderRadius:"50%", background:"var(--bg-4)", border:"1px solid var(--line-2)",
                 display:"inline-flex", alignItems:"center", justifyContent:"center", fontSize:17, fontWeight:700, flex:"0 0 auto" };

  return (
    <div className="editor">
      <div className="editor-inner">
        <div className="editor-top">
          <button className="icon-btn" onClick={onClose} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <div className="editor-title">
            <input defaultValue={routine.name||""} onBlur={e=>{ if(e.target.value!==routine.name) patch({name:e.target.value||"Routine"}); }}
              placeholder="Routine name" />
            <div className="elapsed">{(routine.items||[]).length} exercise{(routine.items||[]).length===1?"":"s"}</div>
          </div>
          <button className="btn btn-primary btn-sm" style={{flex:"0 0 auto"}}
            disabled={!(routine.items||[]).length} onClick={()=>onStart(routine)}>
            Start
          </button>
        </div>

        {(store.gyms||[]).length>0 &&
          <div className="pills-row">
            <button className={"pill "+(!routine.gymId?"on":"")} onClick={()=>setGym(null)}>Any gym</button>
            {(store.gyms||[]).map(g =>
              <button key={g.id} className={"pill "+(routine.gymId===g.id?"on":"")} onClick={()=>setGym(g)}>
                {g.name}
              </button>)}
          </div>}

        {(routine.items||[]).length===0 &&
          <div className="empty" style={{padding:"36px 20px"}}>
            <h3 className="title-sm">Add exercises</h3>
            <p>Pick the movements and set targets. Starting the routine creates a
            workout pre-filled with all of them.</p>
          </div>}

        {(routine.items||[]).map(it => (
          <div key={it.id} className="entry">
            <div className="entry-head">
              <div style={{flex:1,minWidth:0}}>
                <div className="entry-name">{it.name}</div>
                {it.type!=="strength" && <div className="entry-last">{it.type}</div>}
                {it.type==="mobility" && !(it.targetSets>0) &&
                  <div className="entry-last" style={{color:"var(--amber-2)"}}>no reps set</div>}
              </div>
              <InfoBtn name={it.name}
                hasVideo={!!((store.data.exercises||[]).find(x=>x.id===it.exerciseId)||{}).demoVideoId}
                onClick={()=>setHelp({ name: it.name, exerciseId: it.exerciseId })} />
              <button className="entry-x" onClick={()=>removeItem(it.id)} aria-label={"Remove "+it.name}>
                <Icon d={ICONS.x} size={15}/>
              </button>
            </div>
            {/* Mobility drills have doses too - "90/90 Hip Switch 1x8" is an
                instruction, not a suggestion. Only cardio is genuinely
                dose-free here, since it carries its duration in the name. */}
            {it.type!=="cardio" && !planOf(it) &&
              <>
                <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8,flexWrap:"wrap"}}>
                  <button style={sBtn} onClick={()=>bump(it,"targetSets",-1,1,10)} aria-label="Fewer sets">-</button>
                  <span style={{fontWeight:700,fontSize:17,minWidth:20,textAlign:"center"}}>{it.targetSets}</span>
                  <button style={sBtn} onClick={()=>bump(it,"targetSets",1,1,10)} aria-label="More sets">+</button>
                  <span className="subtle">sets of</span>
                  <button style={sBtn} onClick={()=>bump(it,"targetReps",-1,1,100)} aria-label="Fewer reps">-</button>
                  <span style={{fontWeight:700,fontSize:17,minWidth:24,textAlign:"center"}}>{it.targetReps}</span>
                  <button style={sBtn} onClick={()=>bump(it,"targetReps",1,1,100)} aria-label="More reps">+</button>
                  <span className="subtle">reps</span>
                </div>
                <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>enablePlan(it)}>
                  Set each set separately
                </button>
              </>}

            {/* Per-set prescription: a pyramid written down, one row per set. */}
            {it.type!=="cardio" && planOf(it) &&
              <div style={{marginTop:8}}>
                {planOf(it).map((s,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginTop:6,flexWrap:"wrap"}}>
                    <span className="set-num" style={{minWidth:44}}>SET {i+1}</span>
                    <button style={sBtn} onClick={()=>bumpPlan(it,i,"reps",-1,1,100)} aria-label="Fewer reps">-</button>
                    <span style={{fontWeight:700,fontSize:16,minWidth:22,textAlign:"center"}}>{s.reps}</span>
                    <button style={sBtn} onClick={()=>bumpPlan(it,i,"reps",1,1,100)} aria-label="More reps">+</button>
                    <span className="subtle">x</span>
                    <button style={sBtn} onClick={()=>bumpPlan(it,i,"weight",-(units==="kg"?2.5:5),0,2000)} aria-label="Less weight">-</button>
                    <span style={{fontWeight:700,fontSize:16,minWidth:34,textAlign:"center"}}>{fmtW(s.weight)}</span>
                    <button style={sBtn} onClick={()=>bumpPlan(it,i,"weight",(units==="kg"?2.5:5),0,2000)} aria-label="More weight">+</button>
                    <button className="pill" style={{marginLeft:"auto"}} onClick={()=>removePlanSet(it,i)}>Remove</button>
                  </div>
                ))}
                <div className="row" style={{marginTop:10}}>
                  {planOf(it).length < MAX_PLAN_SETS &&
                    <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>addPlanSet(it)}>
                      <Icon d={ICONS.plus} size={14}/> Add set
                    </button>}
                  <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={()=>clearPlan(it)}>
                    Same for every set
                  </button>
                </div>
              </div>}
          </div>
        ))}

        <button className="btn btn-ghost btn-block" style={{marginTop:14}} onClick={()=>setPicker(true)}>
          <Icon d={ICONS.plus} size={15}/> Add exercise
        </button>

        <button className="btn btn-danger btn-block" style={{marginTop:18}}
          onClick={()=>{ if(confirm("Delete this routine?")) onDelete(routine.id); }}>
          Delete routine
        </button>
      </div>

      {picker &&
        <ExercisePicker store={store} gym={gym} onPick={addExercise} onCreate={createAndAdd}
          onHelp={(x)=>setHelp({ name: x.name, exerciseId: x.id })} onClose={()=>setPicker(false)} />}

      {help &&
        <ExerciseHelp store={store} name={help.name} exerciseId={help.exerciseId} gym={gym}
          onClose={()=>setHelp(null)} />}
    </div>
  );
}

/* Step 5: PROGRESS - computed entirely client-side from finished workouts.
   Three lenses: this week, 12-week volume bars, per-exercise trends
   (top-set line chart + session history + best-lift records). */
/* BODY METRICS - weight / waist / body fat, plus the rate-of-loss guard.
   The guard exists because losing weight too fast costs muscle: it compares
   the trailing 4-week trend against a threshold THE USER sets, and only ever
   suggests they look at it. Waist is here because it is the honest non-scale
   signal when the scale stalls. */
function BodySection({ store, openNow, onOpened }){
  const units = store.cfg.units || "lb";
  const [sheet, setSheet] = useState(false);
  // Opened from the + menu, which is the entry point most likely to be used.
  useEffect(() => { if(openNow){ setSheet(true); onOpened && onOpened(); } }, [openNow]);
  const rows = (store.metrics||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const withW = rows.filter(r => Number(r.weight)>0);
  const latest = rows.length ? rows[rows.length-1] : null;
  const lastW = withW.length ? withW[withW.length-1] : null;

  // Trailing-window rate of change, in % of bodyweight per week.
  let pctPerWeek = null, spanDays = 0;
  if(withW.length >= 2){
    const cutoff = shiftDay(todayStr(), -LOSS_WINDOW_DAYS);
    const win = withW.filter(r => !cutoff || r.date >= cutoff);
    if(win.length >= 2){
      const a = win[0], b = win[win.length-1];
      spanDays = Math.round((new Date(b.date+"T00:00:00") - new Date(a.date+"T00:00:00"))/86400000);
      if(spanDays >= 7){
        const pctTotal = ((Number(a.weight)-Number(b.weight))/Number(a.weight))*100;
        pctPerWeek = pctTotal / (spanDays/7);
      }
    }
  }
  const guard = Number(store.cfg.lossGuardPct);
  const guardPct = guard>0 ? guard : DEFAULT_LOSS_GUARD;
  const tooFast = pctPerWeek !== null && pctPerWeek > guardPct;

  // 90-day weight sparkline.
  const chartCut = shiftDay(todayStr(), -90);
  const ch = withW.filter(r => !chartCut || r.date >= chartCut);
  const W=288, H=90, PAD=10;
  let pts = null;
  if(ch.length >= 2){
    const ws = ch.map(r=>Number(r.weight));
    const lo = Math.min(...ws), hi = Math.max(...ws), span = Math.max(0.1, hi-lo);
    pts = ch.map((r,i)=>[
      PAD + (W-2*PAD)*i/(ch.length-1),
      H-PAD - (H-2*PAD)*(Number(r.weight)-lo)/span
    ]);
  }

  return (
    <>
      <div className="set-group">Body</div>
      {!rows.length
        ? <div className="card">
            <p className="hint" style={{marginTop:0}}>
              Log your weight (and waist, if you want the honest signal when the
              scale stalls). Two entries a week is plenty - the trend matters, not the day.
            </p>
            <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}} onClick={()=>setSheet(true)}>
              Log a measurement
            </button>
          </div>
        : <div className="card">
            <div className="item-meta" style={{marginTop:0}}>
              {lastW && <span className="chip amber">{fmtW(lastW.weight)} {units}</span>}
              {latest && Number(latest.waist)>0 && <span className="chip blue">waist {fmtW(latest.waist)}</span>}
              {latest && Number(latest.bodyFat)>0 && <span className="chip">{fmtW(latest.bodyFat)}% fat</span>}
              {latest && <span className="chip">{fmtDate(latest.date)}</span>}
            </div>
            {pts &&
              <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",display:"block",marginTop:10}} aria-hidden="true">
                <polyline points={pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}
                  fill="none" stroke="var(--amber)" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1?4:2} fill="var(--amber-2)" />)}
              </svg>}
            {pctPerWeek !== null &&
              <div className="subtle" style={{marginTop:8,fontSize:12.5}}>
                {pctPerWeek > 0
                  ? "Down "+pctPerWeek.toFixed(2)+"% of bodyweight per week over the last "+spanDays+" days."
                  : (pctPerWeek < 0
                      ? "Up "+Math.abs(pctPerWeek).toFixed(2)+"% per week over the last "+spanDays+" days."
                      : "Holding steady over the last "+spanDays+" days.")}
              </div>}
            {tooFast &&
              <div className="auth-msg err" style={{marginTop:10}}>
                That is faster than your {guardPct}%/week guard. Rapid loss tends to
                take muscle with the fat - worth a look at protein and calories,
                and a word with your doctor if you are on a medication that
                suppresses appetite.
              </div>}
            <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:10}} onClick={()=>setSheet(true)}>
              Log a measurement
            </button>
          </div>}
      {sheet && <MetricSheet store={store} onClose={()=>setSheet(false)} />}
    </>
  );
}

function MetricSheet({ store, onClose }){
  const units = store.cfg.units || "lb";
  const rows = store.metrics || [];
  const [date, setDate] = useState(todayStr());
  const existing = rows.find(r => r.date === date);
  const [weight, setWeight] = useState(existing ? String(existing.weight||"") : "");
  const [waist, setWaist]   = useState(existing ? String(existing.waist||"") : "");
  const [fat, setFat]       = useState(existing ? String(existing.bodyFat||"") : "");
  const [err, setErr] = useState("");

  const save = () => {
    const w = Number(weight)||0, ws = Number(waist)||0, bf = Number(fat)||0;
    if(!w && !ws && !bf){ setErr("Enter at least one measurement."); return; }
    const rec = { id: (existing && existing.id) || uid(), date,
                  weight: w||undefined, waist: ws||undefined, bodyFat: bf||undefined,
                  updatedAt: nowISO() };
    const next = rows.filter(r => r.date !== date).concat([rec])
      .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    store.saveMetrics(next);
    log("BODY","measurement saved "+date);
    onClose();
  };
  const del = () => {
    store.saveMetrics(rows.filter(r => r.date !== date));
    onClose();
  };

  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <h3 className="title-sm" style={{marginBottom:12}}>Measurement</h3>
        {err && <div className="auth-msg err" style={{marginBottom:10}}>{err}</div>}
        <label className="label">Date</label>
        <input className="input" type="date" value={date} onChange={e=>{ setDate(e.target.value); setErr(""); }} />
        <label className="label" style={{marginTop:12}}>Weight ({units})</label>
        <input className="input" inputMode="decimal" value={weight} onChange={e=>setWeight(e.target.value)}
          placeholder="the one that matters" />
        <label className="label" style={{marginTop:12}}>Waist ({units==="kg"?"cm":"in"})</label>
        <input className="input" inputMode="decimal" value={waist} onChange={e=>setWaist(e.target.value)} placeholder="optional" />
        <label className="label" style={{marginTop:12}}>Body fat %</label>
        <input className="input" inputMode="decimal" value={fat} onChange={e=>setFat(e.target.value)} placeholder="optional" />
        <button className="btn btn-primary btn-block" style={{marginTop:16}} onClick={save}>Save</button>
        {existing &&
          <button className="btn btn-danger btn-block" style={{marginTop:8}} onClick={del}>Delete this entry</button>}
        <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

/* RETENTION LENS - the question that matters in a fat-loss phase: am I
   keeping my strength while the scale drops? Crosses the bodyweight trend
   against the estimated-max trend over the same window. Only compares
   exercises trained in BOTH halves, so it can't be fooled by new lifts. */
function RetentionLens({ store, exStats }){
  const rows = (store.metrics||[]).filter(r=>Number(r.weight)>0)
    .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const cut = shiftDay(todayStr(), -56);                 // 8-week window
  const win = rows.filter(r => !cut || r.date >= cut);
  if(win.length < 2) return null;
  const first = win[0], last = win[win.length-1];
  const days = Math.round((new Date(last.date+"T00:00:00") - new Date(first.date+"T00:00:00"))/86400000);
  if(days < 14) return null;

  const mid = shiftDay(last.date, -Math.round(days/2));
  const deltas = [];
  Object.values(exStats||{}).forEach(st => {
    const early = st.sessions.filter(s => s.date >= first.date && s.date <= mid);
    const late  = st.sessions.filter(s => s.date > mid && s.date <= last.date);
    if(!early.length || !late.length) return;
    const a = Math.max(...early.map(s=>s.est)), b = Math.max(...late.map(s=>s.est));
    if(a > 0) deltas.push(((b-a)/a)*100);
  });
  if(deltas.length < 2) return null;

  const strengthPct = deltas.reduce((s,x)=>s+x,0)/deltas.length;
  const weightPct = ((Number(last.weight)-Number(first.weight))/Number(first.weight))*100;
  const lost = weightPct < -0.5, gainedStrength = strengthPct > -1;
  const verdict = lost && gainedStrength
    ? "Bodyweight is down and your lifts are holding. That is fat loss with the muscle intact - exactly the outcome you want."
    : (lost && !gainedStrength
        ? "Bodyweight is down but your lifts are sliding with it. That usually means protein or calories are too low, or recovery is short."
        : (weightPct > 0.5 && strengthPct > 1
            ? "Bodyweight and lifts are both up - you are gaining, and at least some of it is strength."
            : "Bodyweight is roughly steady. Watch the lifts for the real signal."));

  return (
    <>
      <div className="set-group">Strength vs bodyweight</div>
      <div className="card">
        <div className="item-meta" style={{marginTop:0}}>
          <span className={"chip "+(weightPct<0?"green":"")}>
            weight {weightPct>0?"+":""}{weightPct.toFixed(1)}%
          </span>
          <span className={"chip "+(strengthPct>=0?"green":"red")}>
            lifts {strengthPct>0?"+":""}{strengthPct.toFixed(1)}%
          </span>
          <span className="chip">{days} days</span>
          <span className="chip">{deltas.length} lifts compared</span>
        </div>
        <div className="subtle" style={{marginTop:8,fontSize:12.5}}>{verdict}</div>
      </div>
    </>
  );
}

/* WEEKLY SETS BY MUSCLE GROUP - rolling 7 days so it reads fairly on a
   Tuesday, checked against a set range the user picks in Settings. This is
   what catches an under-trained group (a program heavy on pressing and
   light on pulling reads it immediately). */
function GroupVolume({ store }){
  const target = store.cfg.setsTarget === undefined ? "8-15" : store.cfg.setsTarget;
  if(target === "off") return null;
  const [min, max] = target.split("-").map(Number);
  const byId = {}; (store.data.exercises||[]).forEach(x => { byId[x.id] = x; });
  const byName = {}; (store.data.exercises||[]).forEach(x => { byName[normName(x.name)] = x; });
  const cut = shiftDay(todayStr(), -6);
  const counts = {};
  (store.data.workouts||[]).forEach(w => {
    if(!w.endedAt || !w.date || (cut && w.date < cut)) return;
    (w.entries||[]).forEach(e => {
      const hard = (e.sets||[]).filter(s => (Number(s.reps)||0) > 0).length;
      if(!hard) return;
      const ex = byId[e.exerciseId] || byName[normName(e.name)];
      const g = (ex && ex.muscleGroup) ? ex.muscleGroup : "Full body";
      counts[g] = (counts[g]||0) + hard;
    });
  });
  const total = Object.values(counts).reduce((s,n)=>s+n,0);
  if(!total) return null;

  return (
    <>
      <div className="set-group">Sets by muscle - last 7 days</div>
      <div className="card">
        <div className="pills" style={{marginTop:0}}>
          {MUSCLE_GROUPS.map(g => {
            const n = counts[g]||0;
            if(g==="Full body" && !n) return null;
            const cls = n>=min && n<=max ? "green" : (n<min ? "amber" : "blue");
            return <span key={g} className={"chip "+cls}>{g} {n}</span>;
          })}
        </div>
        <div className="subtle" style={{marginTop:8,fontSize:12.5}}>
          Green sits in your {min}-{max} set range. Amber is under it, blue is over.
          Full body counts toward everything it trains, so treat it as a bonus rather than a total.
        </div>
      </div>
    </>
  );
}

/* ============================================================
   THE WEEKLY CHECK-IN
   The Progress charts say WHAT HAPPENED. This is the layer that says what
   it means. Two halves on purpose:

   1. buildDigest() computes the numbers CLIENT-SIDE, free and
      deterministic. The card is useful the moment it renders, before any
      AI is involved.
   2. One deliberate tap sends that digest - numbers, never raw workout
      records - for a reading. A year of history therefore costs the same
      as a month, and the answer is cached for the week.
   ============================================================ */
const CHECKIN_MIN_SESSIONS = 4;   // below this a "trend" is noise, not a trend
const CHECKIN_WEEKS = 6;

function buildDigest(store){
  const units = store.cfg.units || "lb";
  const done = (store.data.workouts||[]).filter(w => w.endedAt && w.date);
  const cut28 = shiftDay(todayStr(), -27);
  const recent = done.filter(w => w.date >= cut28);

  // ---- sessions + volume, by week, most recent last ----
  const thisWeek = weekStartStr(todayStr());
  const weeks = [];
  { const d = new Date(thisWeek+"T00:00:00");
    d.setDate(d.getDate() - 7*(CHECKIN_WEEKS-1));
    const p = n => String(n).padStart(2,"0");
    for(let i=0;i<CHECKIN_WEEKS;i++){
      weeks.push(d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()));
      d.setDate(d.getDate()+7);
    } }
  const byWeek = {};
  weeks.forEach(k => { byWeek[k] = {sessions:0, sets:0, volume:0}; });
  done.forEach(w => {
    const k = weekStartStr(w.date);
    if(!byWeek[k]) return;
    byWeek[k].sessions++; byWeek[k].sets += workoutSets(w); byWeek[k].volume += workoutVolume(w);
  });
  const weekly = weeks.map(k => ({ week:k, ...byWeek[k] }));

  // ---- sets per muscle group, rolling 7 days, against the user's range ----
  const byId = {}, byNm = {};
  (store.data.exercises||[]).forEach(x => { byId[x.id] = x; byNm[normName(x.name)] = x; });
  const target = store.cfg.setsTarget === undefined ? "8-15" : store.cfg.setsTarget;
  const cut7 = shiftDay(todayStr(), -6);
  const groups = {};
  done.filter(w => w.date >= cut7).forEach(w => {
    (w.entries||[]).forEach(e => {
      const hard = (e.sets||[]).filter(s => (Number(s.reps)||0) > 0).length;
      if(!hard) return;
      const ex = byId[e.exerciseId] || byNm[normName(e.name)];
      const g = (ex && ex.muscleGroup) ? ex.muscleGroup : "Full body";
      groups[g] = (groups[g]||0) + hard;
    });
  });

  // ---- per-lift movement: best estimated 1RM, first half vs second half
  //      of the window. Only lifts trained in BOTH halves can be compared;
  //      anything else would report a change that never happened. ----
  const cut56 = shiftDay(todayStr(), -55);
  const mid = shiftDay(todayStr(), -27);
  const halves = {};
  done.filter(w => w.date >= cut56).forEach(w => {
    (w.entries||[]).forEach(e => {
      const sets = (e.sets||[]).filter(s => (Number(s.weight)||0)>0 && (Number(s.reps)||0)>0);
      if(!sets.length) return;
      const key = e.exerciseId || normName(e.name);
      const h = halves[key] || (halves[key] = {name:e.name, early:0, late:0});
      if(e.name) h.name = e.name;
      let best = 0;
      sets.forEach(s => { best = Math.max(best, estMax(s.weight, s.reps)); });
      const slot = w.date < mid ? "early" : "late";
      h[slot] = Math.max(h[slot], best);
    });
  });
  const lifts = Object.values(halves)
    .filter(h => h.early > 0 && h.late > 0)
    .map(h => ({ name:h.name, from:Math.round(h.early), to:Math.round(h.late),
                 pct: Math.round(((h.late-h.early)/h.early)*1000)/10 }))
    .sort((a,b) => b.pct - a.pct);

  // ---- effort marks, last 28 days (direction, not feeling) ----
  let up = 0, down = 0;
  recent.forEach(w => (w.entries||[]).forEach(e => (e.sets||[]).forEach(s => {
    const k = EFFORT_ALIAS[s.effort];
    if(k === "easy") up++; else if(k === "hard") down++;
  })));

  // ---- program adherence ----
  const prog = activeProgram(store);
  const nx = prog ? programNext(prog, store.data.routines||[]) : null;
  const program = prog ? {
    name: prog.name,
    day: nx ? nx.position : null,
    days: nx ? nx.total : (prog.routineIds||[]).length,
    sessionsLast28: recent.filter(w => w.routineId).length,
  } : null;

  // ---- body: one shared rule, see weightTrend() ----
  const bt = weightTrend(store);
  const body = bt ? { ...bt, units } : null;

  // ---- daily checklist, last 14 days ----
  const daily = store.daily || {habits:[], log:{}};
  let habits = null;
  if((daily.habits||[]).length){
    habits = (daily.habits||[]).map(h => {
      let hit = 0;
      for(let i=0;i<14;i++){
        const d = shiftDay(todayStr(), -i);
        if(((daily.log||{})[d]||[]).indexOf(h.id) !== -1) hit++;
      }
      return { label:h.label, days:hit, of:14 };
    });
  }

  const gyms = [...new Set(recent.map(w => w.gymName).filter(Boolean))];

  /* Set notes are the only thing in the record written in his own words -
     "wanted 10", "left shoulder tight" - and they carry intent the numbers
     cannot. Capped hard: the digest's whole value is being small and
     deterministic, and notes are the one unbounded field in it. */
  const notes = [];
  recent.forEach(w => (w.entries||[]).forEach(e => (e.sets||[]).forEach(s => {
    if(s.note && notes.length < 20)
      notes.push({ on: w.date, exercise: e.name, note: String(s.note).slice(0, 80) });
  })));

  return {
    units, generatedFor: thisWeek,
    sessionsLast28: recent.length,
    enough: recent.length >= CHECKIN_MIN_SESSIONS,
    weekly, setsTarget: target, groups, lifts, marks:{up, down},
    program, body, habits, gyms, notes,
  };
}

/* The card. Deterministic facts render immediately and cost nothing; the
   reading is one tap and cached for the week on cfg. */
function CheckInCard({ store }){
  const d = useMemo(() => buildDigest(store), [store.data.workouts, store.metrics, store.daily, store.cfg]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const saved = store.cfg.checkin || null;
  const fresh = saved && saved.week === d.generatedFor ? saved : null;

  const lastWeek = d.weekly[d.weekly.length-1] || {sessions:0,sets:0};
  const prevWeek = d.weekly[d.weekly.length-2] || {sessions:0,sets:0};
  const [gMin, gMax] = (d.setsTarget||"8-15").split("-").map(Number);
  // Early in a week EVERY group is under the minimum, so the row would list
  // all seven and tell you nothing. Only judge a week that has enough volume
  // in it to be judged, and name the three worst rather than all of them.
  const weekSets = Object.values(d.groups).reduce((s,n)=>s+n, 0);
  const low = (d.setsTarget === "off" || weekSets < gMin) ? []
    : MUSCLE_GROUPS.filter(g => g !== "Full body" && (d.groups[g]||0) < gMin)
        .sort((a,b) => (d.groups[a]||0) - (d.groups[b]||0));
  const lowShown = low.slice(0, 3);
  const lowRest  = low.length - lowShown.length;
  const best = d.lifts.length ? d.lifts[0] : null;
  const worst = d.lifts.length > 1 ? d.lifts[d.lifts.length-1] : null;

  const read = async () => {
    setBusy(true); setErr("");
    try{
      const system =
        "You are reading one person's training numbers and telling them what to change. " +
        "Plain text, no markdown, no headers, no greeting, no sign-off. Under 150 words. " +
        "Structure: what moved, what stalled, then ONE change to make next week. " +
        "The notes array is what they wrote about individual sets in their own words - " +
        "use it where it explains a number, and quote it briefly when you do. " +
        "EVERY claim must cite the number it came from - say 'chest is at 7 sets against your 8-15 range', " +
        "never 'consider more chest work'. If the data cannot support a claim, say so plainly instead of " +
        "inventing a trend; too little data is a real answer. " +
        "NEVER give calorie, protein, macro or medication advice, and never suggest a rate of weight loss - " +
        "if bodyweight is falling faster than their guard, say that plainly, note that this is where muscle " +
        "loss comes from, and tell them to raise it with their prescriber. Nothing more.";
      const out = await aiRelay("progress_summary",
        [{ role:"user", content: "My training numbers as JSON. Weights in " + d.units + ".\n" +
            JSON.stringify(d) }],
        { system, maxTokens: 900 });
      const text = (out||"").trim();
      if(!text) throw new Error("Nothing came back - try again.");
      store.saveCfg({ ...store.cfg, checkin: { week: d.generatedFor, text, at: nowISO() } });
      log("CHECKIN", "read for week " + d.generatedFor);
    }catch(e){ setErr(e.message||"Couldn't read it."); log("ERROR","progress_summary: "+e.message); }
    finally{ setBusy(false); }
  };

  return (
    <>
      <div className="set-group">Your last 4 weeks</div>
      <div className="card">
        <div className="item-meta" style={{marginBottom:8}}>
          <span className="chip">{d.sessionsLast28} session{d.sessionsLast28===1?"":"s"}</span>
          {d.program && <span className="chip amber">{d.program.name}</span>}
          {d.program && d.program.day &&
            <span className="chip">day {d.program.day} of {d.program.days}</span>}
          {d.gyms.slice(0,2).map(g => <span key={g} className="chip blue">{g}</span>)}
        </div>

        <div className="set-row" style={{cursor:"default"}}>
          <span className="set-main">This week vs last</span>
          <span className="chip">{lastWeek.sets} vs {prevWeek.sets} sets</span>
        </div>
        {best && best.pct > 0 &&
          <div className="set-row" style={{cursor:"default"}}>
            <span className="set-main">Moving most</span>
            <span className="chip green">{best.name} +{best.pct}%</span>
          </div>}
        {worst && worst.pct < 0 &&
          <div className="set-row" style={{cursor:"default"}}>
            <span className="set-main">Going backwards</span>
            <span className="chip red">{worst.name} {worst.pct}%</span>
          </div>}
        {lowShown.length > 0 &&
          <div className="set-row" style={{cursor:"default"}}>
            <span className="set-main">Under {gMin} sets this week</span>
            <span className="chip amber">
              {lowShown.map(g => g+" "+(d.groups[g]||0)).join(", ")}
              {lowRest > 0 ? " +"+lowRest+" more" : ""}
            </span>
          </div>}
        {d.body && d.body.tooFast &&
          <div className="set-row" style={{cursor:"default"}}>
            <span className="set-main">Weight falling</span>
            <span className="chip red">{d.body.pctPerWeek}%/wk vs {d.body.guardPct}% guard</span>
          </div>}

        {fresh &&
          <div style={{whiteSpace:"pre-wrap",fontSize:14.5,lineHeight:1.5,marginTop:12}}>{fresh.text}</div>}
        {err && <div className="auth-msg err" style={{marginTop:10}}>{err}</div>}

        {/* Below four sessions a "trend" is noise. Saying so is more useful
            than a confident reading of three data points. */}
        {!d.enough
          ? <p className="hint" style={{marginBottom:0,marginTop:12}}>
              Log {CHECKIN_MIN_SESSIONS - d.sessionsLast28} more session
              {CHECKIN_MIN_SESSIONS - d.sessionsLast28 === 1 ? "" : "s"} and I can read the trend properly.
            </p>
          : <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:12}}
              disabled={busy} onClick={read}>
              {busy ? <span className="spin"></span> : (fresh ? "Read it again" : "What should I change?")}
            </button>}
      </div>
    </>
  );
}

/* ============================================================
   STARTING A ROUTINE SOMEWHERE IT WAS NOT DESIGNED FOR

   Chris travels: a program written for the Dallas home gym gets run in a
   hotel with three dumbbells. Finding that out at exercise three wrecks a
   30-minute session, so the check happens at the door.

   The hard part is Chris's own question: what do we do with a gym whose
   inventory is empty or thin? An equipment list only supports a NEGATIVE
   claim - "there is no GHD here" - if we believe the list is COMPLETE. A
   four-item list might be an honest hotel gym or an abandoned first
   attempt, and the app cannot tell which.

   So it never guesses. Either the list is trusted and we flag what is
   missing, or it is not and we say we do not know - and ask, once, at the
   only moment the answer is worth anything.
   ============================================================ */
const INVENTORY_TRUSTED_MIN = 6;   // tags below which absence proves nothing

function inventoryTrusted(gym){
  if(!gym) return false;
  const n = (gym.equipment||[]).length;
  // An explicit confirmation beats any count: a hotel gym really can hold
  // four things, and the owner saying "that is everything" is better
  // evidence than a threshold.
  if(gym.invConfirmed && n > 0) return true;
  return n >= INVENTORY_TRUSTED_MIN;
}

/* Exercises in this routine that the gym cannot support. Mobility and cardio
   are excluded: ankle rocks need no equipment, and swapping a bike for a
   treadmill is not a decision worth a screen. */
function blockedItems(routine, gym, store){
  if(!inventoryTrusted(gym)) return [];
  const byId = {};
  (store.data.exercises||[]).forEach(x => { byId[x.id] = x; });
  return (routine.items||[])
    .filter(it => it.type !== "mobility" && it.type !== "cardio")
    .map(it => ({ it, ex: byId[it.exerciseId] || null }))
    .filter(r => r.ex && !availableAt(r.ex, gym));
}

/* Substitutes come from YOUR OWN library first - deterministic, free, works
   offline, and a movement you have already logged carries its history and
   pre-fills forward. Ranked by how often you have actually done it, because
   a familiar lift is a better answer than a clever one. */
function substitutesFor(ex, gym, store, exclude){
  if(!ex) return [];
  // Never offer something already in this session. Caught in review: the
  // hotel case proposed Nordic Curl as a stand-in for the trap bar while
  // Nordic Curl was the very next exercise on the list.
  const skip = new Set([ex.id].concat(exclude || []));
  const counts = {};
  (store.data.workouts||[]).forEach(w => {
    if(!w.endedAt) return;
    (w.entries||[]).forEach(e => {
      if(!e.exerciseId) return;
      const n = (e.sets||[]).filter(s => (Number(s.reps)||0) > 0).length;
      if(n) counts[e.exerciseId] = (counts[e.exerciseId]||0) + 1;
    });
  });
  return (store.data.exercises||[])
    .filter(x => !skip.has(x.id)
              && (x.type||"strength") === (ex.type||"strength")
              && x.muscleGroup && x.muscleGroup === ex.muscleGroup
              && availableAt(x, gym))
    .map(x => ({ x, done: counts[x.id]||0 }))
    .sort((a,b) => b.done - a.done || String(a.x.name).localeCompare(String(b.x.name)))
    .slice(0, 3);
}

/* One screen, two modes: "here is what will not work" when the inventory can
   be trusted, and "I do not know what is here" when it cannot. */
function StartCheck({ store, routine, gym, onEditGym, onStart, onCancel }){
  const trusted = inventoryTrusted(gym);
  const blocked = blockedItems(routine, gym, store);
  const [subs, setSubs] = useState({});     // itemId -> exercise record
  const [asking, setAsking] = useState(null);
  const [askErr, setAskErr] = useState("");
  const [ideas, setIdeas] = useState({});   // itemId -> AI text

  const options = useMemo(() => {
    const o = {};
    const inRoutine = (routine.items||[]).map(i => i.exerciseId).filter(Boolean);
    blocked.forEach(({it, ex}) => { o[it.id] = substitutesFor(ex, gym, store, inRoutine); });
    return o;
  }, [routine.id, gym && gym.id, store.data.exercises, store.data.workouts]);

  // Only when the library has nothing that fits does this cost a call. It
  // reuses adapt_exercise, which already knows how to read an inventory.
  /* Asked for STRUCTURED output rather than prose, because a named movement
     you cannot select is only half an answer - the first version handed back
     advice and left you to go create the exercise yourself. Now the
     suggestion is acceptable in one tap and joins the library as a custom
     exercise, so its history starts accumulating like any other. */
  const askAI = async (it, ex) => {
    setAsking(it.id); setAskErr("");
    try{
      const system = "You name ONE replacement exercise. Reply with STRICT JSON only, no markdown, " +
        'no prose: {"name": "...", "equipment": "...", "why": "..."}. ' +
        "equipment must be exactly one of: " + JSON.stringify(EQUIPMENT) + ", and must be something the " +
        "gym's inventory actually supports - bodyweight is always allowed. " +
        "why is one short clause, under 15 words, on what makes it a fair stand-in. " +
        'If nothing can train the same thing here, reply {"name": null, "why": "<one sentence saying so>"}. ' +
        "Never invent equipment that is not on the inventory.";
      const out = await aiRelay("adapt_exercise",
        [{ role:"user", content: "Replace: "+ex.name+" (trains "+(ex.muscleGroup||"?")+", needs "+
            (ex.equipment||"none")+"). Gym: "+gym.name+". Inventory: "+(gym.equipment||[]).join(", ")+"." }],
        { system, maxTokens: 300 });
      let obj = null;
      try{
        const m = String(out||"").match(/\{[\s\S]*\}/);
        obj = m ? JSON.parse(m[0]) : null;
      }catch(e){ obj = null; }
      if(!obj) throw new Error("Couldn't read the answer - try again.");
      setIdeas(prev => ({...prev, [it.id]: {
        name: obj.name || null,
        equipment: EQUIPMENT.indexOf(obj.equipment) !== -1 ? obj.equipment : "bodyweight",
        why: String(obj.why||"").trim(),
      }}));
    }catch(e){ setAskErr(e.message||"Couldn't get an option."); log("ERROR","substitute: "+e.message); }
    finally{ setAsking(null); }
  };

  /* Accepting a suggestion CREATES it, so the swap behaves like any other
     exercise from here on - it shows in the library, gets an (i), collects
     history. Inherits the blocked movement's muscle group so weekly sets by
     muscle stay correct. */
  const acceptIdea = (it, ex) => {
    const idea = ideas[it.id];
    if(!idea || !idea.name) return;
    const existing = (store.data.exercises||[])
      .find(x => normName(x.name) === normName(idea.name));
    let rec = existing;
    if(!rec){
      rec = { id: uid(), name: idea.name.trim(), type: ex.type || "strength",
              muscleGroup: ex.muscleGroup || "Full body", equipment: idea.equipment,
              notes: "", custom: true, createdAt: nowISO(), updatedAt: nowISO() };
      store.saveCollection("exercises", [...(store.data.exercises||[]), rec]);
      log("SUBSTITUTE","created "+rec.name+" for "+ex.name);
    }
    setSubs(prev => ({...prev, [it.id]: rec}));
  };

  const swapCount = Object.keys(subs).length;

  if(!trusted) return (
    <div className="layer" style={{zIndex:86}}>
      <div className="layer-inner">
        <div className="layer-top">
          <button className="icon-btn" onClick={onCancel} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2 style={{flex:1,minWidth:0}}>{routine.name}</h2>
        </div>
        <div className="card">
          <div style={{fontWeight:600,marginBottom:4}}>
            I don't know what's at {gym ? gym.name : "this gym"}
          </div>
          <p className="hint" style={{marginTop:0}}>
            {(gym && (gym.equipment||[]).length)
              ? "Only " + gym.equipment.length + " item" + (gym.equipment.length===1?"":"s") + " are on file, which isn't enough to tell you what won't work here."
              : "Nothing is on file for it yet."}
            {" "}Tick what's actually there and I'll flag anything in a routine that can't be done - and offer something that can.
          </p>
          <button className="btn btn-primary btn-block" style={{marginTop:12}} onClick={onEditGym}>
            Tick what's here
          </button>
          <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}} onClick={()=>onStart({})}>
            Start {routine.name} anyway
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="layer" style={{zIndex:86}}>
      <div className="layer-inner">
        <div className="layer-top">
          <button className="icon-btn" onClick={onCancel} aria-label="Back"><Icon d={ICONS.back} size={20}/></button>
          <h2 style={{flex:1,minWidth:0}}>{routine.name}</h2>
        </div>

        <div className="card" style={{borderColor:"var(--amber-line)",background:"var(--amber-dim)"}}>
          <div style={{fontWeight:600}}>
            {blocked.length} of {(routine.items||[]).length} need kit that isn't at {gym.name}
          </div>
          <p className="hint" style={{marginTop:4,marginBottom:0}}>
            Based on the {(gym.equipment||[]).length} items on file. Keep anything you
            know you can do - a swap is only a suggestion.
          </p>
        </div>

        {blocked.map(({it, ex}) => {
          const chosen = subs[it.id];
          const opts = options[it.id] || [];
          return (
            <div key={it.id} className="card" style={{marginTop:12}}>
              <div className="updrow">
                <div style={{fontWeight:600,minWidth:0}}>{it.name}</div>
                <span className="chip amber" style={{flex:"0 0 auto"}}>needs {ex.equipment}</span>
              </div>

              {opts.length === 0 && !ideas[it.id] &&
                <p className="hint" style={{marginTop:8,marginBottom:0}}>
                  Nothing in your library trains {ex.muscleGroup || "this"} with what's here.
                </p>}

              {opts.map(({x, done}) => (
                <button key={x.id} className="set-row"
                  style={chosen && chosen.id===x.id ? {borderColor:"var(--amber-line)"} : null}
                  onClick={()=>setSubs(prev => {
                    const n = {...prev};
                    if(n[it.id] && n[it.id].id === x.id) delete n[it.id]; else n[it.id] = x;
                    return n;
                  })}>
                  <span className="set-main">{x.name}</span>
                  <span className="chip" style={{flex:"0 0 auto"}}>
                    {done ? done + " session" + (done===1?"":"s") : "new to you"}
                  </span>
                  {chosen && chosen.id===x.id && <span className="chip amber" style={{flex:"0 0 auto"}}>swapping</span>}
                </button>
              ))}

              {ideas[it.id] && (ideas[it.id].name
                ? <button className="set-row"
                    style={chosen && chosen.name===ideas[it.id].name ? {borderColor:"var(--amber-line)"} : null}
                    onClick={()=>acceptIdea(it, ex)}>
                    <span className="set-main">{ideas[it.id].name}</span>
                    <span className="chip blue" style={{flex:"0 0 auto"}}>{ideas[it.id].equipment}</span>
                    {chosen && chosen.name===ideas[it.id].name &&
                      <span className="chip amber" style={{flex:"0 0 auto"}}>swapping</span>}
                  </button>
                : <p className="hint" style={{marginTop:8,marginBottom:0}}>{ideas[it.id].why}</p>)}
              {ideas[it.id] && ideas[it.id].name && ideas[it.id].why &&
                <p className="hint" style={{marginTop:4,marginBottom:0}}>{ideas[it.id].why}</p>}

              <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:8}}
                disabled={asking===it.id} onClick={()=>askAI(it, ex)}>
                {asking===it.id ? <span className="spin"></span> : "Ask for another option"}
              </button>
            </div>
          );
        })}

        {askErr && <div className="auth-msg err" style={{marginTop:10}}>{askErr}</div>}

        {/* The list is never final. He might have brought a bell, or the hotel
            might have added a rack since - correcting it must be reachable
            from the screen making claims about it, not only from the Gyms
            tab. */}
        <button className="btn btn-ghost btn-sm btn-block" style={{marginTop:12}} onClick={onEditGym}>
          Fix what's listed at {gym.name}
        </button>

        <div className="stick-actions">
          <button className="btn btn-primary btn-block" onClick={()=>onStart(subs)}>
            {swapCount ? "Start with "+swapCount+" swap"+(swapCount===1?"":"s") : "Start unchanged"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ProgressScreen({ store, weighIn, onWeighInDone }){
  const units = store.cfg.units || "lb";
  const [exId, setExId] = useState(null);
  const done = (store.data.workouts||[]).filter(w=>w.endedAt)
    .slice().sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));

  if(!done.length){
    return (
      <div>
        <BodySection store={store} openNow={weighIn} onOpened={onWeighInDone} />
        <div className="empty">
          <div className="glyph">^</div>
          <h3 className="title-sm">Training progress</h3>
          <p>Finish a workout (or import your history) and your trends, records, and weekly volume build themselves - nothing to set up.</p>
        </div>
      </div>
    );
  }

  // ---- weekly buckets: 12 weeks ending with the current week ----
  const thisWeek = weekStartStr(todayStr());
  const weeks = [];
  { const d = new Date(thisWeek+"T00:00:00"); d.setDate(d.getDate()-77);
    const p = n => String(n).padStart(2,"0");
    for(let i=0;i<12;i++){
      weeks.push(d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()));
      d.setDate(d.getDate()+7);
    } }
  const byWeek = {};
  for(const w of done){
    const k = weekStartStr(w.date); if(!k) continue;
    const b = byWeek[k] || (byWeek[k] = {count:0,vol:0,mins:0,sets:0});
    b.count++; b.vol += workoutVolume(w); b.sets += workoutSets(w);
    for(const e of (w.entries||[])) if(e.cardio) b.mins += Number(e.cardio.minutes)||0;
  }
  const cur = byWeek[thisWeek] || {count:0,vol:0,mins:0,sets:0};
  const maxVol = Math.max(1, ...weeks.map(k => (byWeek[k]||{}).vol||0));

  // ---- per-exercise stats from weighted strength sets ----
  const exStats = {};
  for(const w of done){
    for(const e of (w.entries||[])){
      const sets = (e.sets||[]).filter(s => (Number(s.weight)||0)>0 && (Number(s.reps)||0)>0);
      if(!sets.length) continue;
      const id = e.exerciseId || e.name;
      const st = exStats[id] || (exStats[id] = {id, name:e.name, sessions:[], pr:null});
      if(e.name) st.name = e.name;               // denormalized snapshot; latest wins
      let top = sets[0], vol = 0, est = 0;
      for(const s of sets){
        vol += (Number(s.reps)||0)*(Number(s.weight)||0);
        if((Number(s.weight)||0) > (Number(top.weight)||0)) top = s;
        est = Math.max(est, estMax(s.weight, s.reps));
      }
      st.sessions.push({ date:w.date, top:{weight:Number(top.weight)||0, reps:Number(top.reps)||0}, vol, est });
      if(!st.pr || (Number(top.weight)||0) > st.pr.weight)
        st.pr = { weight:Number(top.weight)||0, reps:Number(top.reps)||0, date:w.date };
    }
  }
  // Most recently trained first - the list mirrors what you're actually doing.
  const tracked = Object.values(exStats)
    .sort((a,b)=>String(b.sessions[b.sessions.length-1].date).localeCompare(String(a.sessions[a.sessions.length-1].date)));
  const sel = exId ? exStats[exId] : null;

  return (
    <div>
      {/* The charts below say what happened; this says what it means, so it
          leads. Its facts are computed locally - the card is useful before
          any AI is involved. */}
      <CheckInCard store={store} />
      <div className="set-group">This week</div>
      <div className="card">
        <div className="item-meta" style={{marginTop:0}}>
          <span className="chip amber">{cur.count} workout{cur.count===1?"":"s"}</span>
          {cur.vol>0 && <span className="chip">{fmtNum(Math.round(cur.vol))} {units} moved</span>}
          {cur.sets>0 && <span className="chip">{cur.sets} sets</span>}
          {cur.mins>0 && <span className="chip blue">{cur.mins} cardio min</span>}
        </div>
      </div>

      <BodySection store={store} openNow={weighIn} onOpened={onWeighInDone} />

      <RetentionLens store={store} exStats={exStats} />

      <GroupVolume store={store} />

      <div className="set-group">Weekly volume - last 12 weeks</div>
      <div className="card">
        <svg viewBox="0 0 288 96" style={{width:"100%",height:"auto",display:"block"}} aria-hidden="true">
          {weeks.map((k,i)=>{
            const v = (byWeek[k]||{}).vol||0;
            const h = v>0 ? Math.max(4, 84*v/maxVol) : 2;
            return <rect key={k} x={i*24+5} y={92-h} width={14} height={h} rx={3}
              fill={v>0 ? (k===thisWeek ? "var(--amber)" : "var(--amber-line)") : "var(--bg-4)"} />;
          })}
        </svg>
        <div className="subtle" style={{marginTop:8,fontSize:12}}>
          Total weight moved per week. Peak: {fmtNum(Math.round(maxVol))} {units}. This week is the bright bar.
        </div>
      </div>

      <div className="set-group">By exercise</div>
      {!tracked.length
        ? <div className="card"><p className="subtle" style={{margin:0}}>Log weighted sets and each exercise shows up here with its trend and best lift.</p></div>
        : <div className="list">
            {tracked.map(s => (
              <button key={s.id} className="item" onClick={()=>setExId(s.id)}>
                <div className="item-body">
                  <div className="item-title">{s.name}</div>
                  <div className="item-meta">
                    <span className="chip amber">best {fmtW(s.pr.weight)} {units} x {s.pr.reps}</span>
                    <span className="chip">{s.sessions.length} session{s.sessions.length===1?"":"s"}</span>
                    <span className="chip">{fmtDate(s.sessions[s.sessions.length-1].date)}</span>
                  </div>
                </div>
              </button>
            ))}
          </div>}

      {sel && <ExerciseProgress stat={sel} units={units} onClose={()=>setExId(null)} />}
    </div>
  );
}

/* Per-exercise drill-in: top-set trend chart + records + session log. */
function ExerciseProgress({ stat, units, onClose }){
  const ss = stat.sessions.slice(-24);                 // chart the last 24 sessions
  const bestEst = Math.max(...stat.sessions.map(s=>s.est));
  const W=288, H=110, PAD=12;
  const ws = ss.map(s=>s.top.weight);
  const lo = Math.min(...ws), hi = Math.max(...ws);
  const span = Math.max(1, hi-lo);
  const pts = ss.map((s,i)=>[
    ss.length===1 ? W/2 : PAD + (W-2*PAD)*i/(ss.length-1),
    H-PAD - (H-2*PAD)*(s.top.weight-lo)/span
  ]);
  return (
    <div className="layer">
      <div className="layer-inner">
        <div className="layer-top">
          <button className="btn btn-ghost btn-sm" onClick={onClose}><Icon d={ICONS.back} size={15}/> Progress</button>
          <h2>{stat.name}</h2>
        </div>

        <div className="item-meta" style={{margin:"2px 0 14px"}}>
          <span className="chip amber">best {fmtW(stat.pr.weight)} {units} x {stat.pr.reps}</span>
          {bestEst > stat.pr.weight &&
            <span className="chip">est. max ~{fmtNum(Math.round(bestEst))} {units}</span>}
